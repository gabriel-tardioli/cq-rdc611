<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Prova dos ícones · CQ RDC 611</title>
<style>
/* Folha de prova: cada ícone nos três tamanhos que importam — 96 px para
   julgar o desenho, 46 px como aparece no cartão do menu, 22 px como aparece
   na lista de equipamentos. Um ícone que só funciona grande não serve. */
:root{ --bg:#0B0E10; --surface:#14181B; --border:rgba(255,255,255,.09);
       --text:#E9EEEC; --muted:#8C9793; --accent:#6C9CF5;
       --accent-soft:rgba(108,156,245,.16);
       --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
@media (prefers-color-scheme:light){
  :root{ --bg:#F5F7F8; --surface:#FFF; --border:rgba(13,25,30,.1);
         --text:#0F1618; --muted:#5F6E6A; --accent:#2E63C8;
         --accent-soft:rgba(46,99,200,.1) }
}
body{margin:0; padding:24px; background:var(--bg); color:var(--text);
  font:14px/1.5 var(--sans)}
h1{font-size:18px; margin:0 0 4px}
p.nota{margin:0 0 22px; color:var(--muted); font-size:12.5px}
.linha{display:flex; align-items:center; gap:20px; padding:14px 16px;
  margin-bottom:9px; background:var(--surface);
  border:1px solid var(--border); border-radius:12px}
.tile{display:grid; place-items:center; border-radius:14px;
  background:var(--accent-soft); color:var(--accent); flex:none}
.t96{width:96px; height:96px} .t96 svg{width:62px; height:62px; stroke-width:1.5}
.t46{width:46px; height:46px} .t46 svg{width:27px; height:27px; stroke-width:1.55}
.t22{width:26px; height:26px} .t22 svg{width:17px; height:17px; stroke-width:1.7}
svg{fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round}
.txt{flex:1}
.txt b{display:block; font-size:15px}
.txt span{color:var(--muted); font-size:12.5px}
</style>
</head>
<body>
<h1>Prova dos ícones</h1>
<p class="nota">96 px para julgar o desenho · 46 px como no cartão do menu ·
   26 px como na lista de equipamentos.</p>
<div id="saida"></div>

<script src="../base/semente.js"></script>
<script src="../base/cadastro.js"></script>
<script>
const svg = m => '<svg viewBox="0 0 24 24">' + m + '</svg>';
document.getElementById('saida').innerHTML = Cadastro.MODALIDADES.map(m => `
  <div class="linha">
    <span class="tile t96">${svg(m.icone)}</span>
    <span class="tile t46">${svg(m.icone)}</span>
    <span class="tile t22">${svg(m.icone)}</span>
    <span class="txt"><b>${m.curto}</b><span>IN ${m.in} · ${m.nome}</span></span>
  </div>`).join('');
</script>
</body>
</html>
