  {k:'id',          r:'Código do equipamento', req:true, dica:'Identifica o equipamento no acervo'},
  {k:'patrimonio',  r:'Patrimônio'}
];

function rascunhoNovo(){
  return {
    id:'', unidade:'', setor:'Ultrassom', sala:'',
    marca:'', modelo:'', ns:'', patrimonio:'', periodicidade:'Anual',
    transdutores:[transdutorNovo()]
  };
}
const transdutorNovo = () =>
  ({tipo:'Linear', modelo:'', ns:'', cod:'', protocolo:'', fmax:''});

/* Primeiro slot livre. Contar os transdutores não serve depois de uma
   remoção: um equipamento com T1 e T3 daria T3 de novo. */
function proximoSlot(eq){
  const usados = new Set(eq.transdutores.map(t => t.slot));
  let i = 1;
  while (usados.has('T' + i)) i++;
  return 'T' + i;
}

/* Campos de cada transdutor no formulário. */
const CAMPOS_TRANSD = [
  {k:'modelo',    r:'Modelo',            dica:'L12-3'},
  {k:'ns',        r:'Número de série'},
  {k:'cod',       r:'Código'},
  {k:'protocolo', r:'Protocolo',         dica:'Vasc Carótida'},
  {k:'fmax',      r:'Freq. máxima (MHz)', dica:'define o limite de resolução'}
];

function telaCadastro(){
  const d = ESTADO.rascunho = ESTADO.rascunho || rascunhoNovo();

  const campos = CAMPOS_EQUIP.map(c=>
    `<div class="campo-form" ${c.larg ? 'style="grid-column:span ' + c.larg + '"' : ''}>
      <label for="f-${c.k}">${esc(c.r)}${c.req ? ' *' : ''}</label>
      <input id="f-${c.k}" data-f="${c.k}" value="${esc(d[c.k])}"
             ${c.req ? 'required' : ''} autocomplete="off">
      ${c.dica ? `<span class="dica">${esc(c.dica)}</span>` : ''}
    </div>`).join('');

  const linhas = d.transdutores.map((tr,i)=>`
    <div class="bloco-transd" data-i="${i}">
      <div class="cabeca">
        <span class="slot">T${i+1}</span>
        <span class="nome">${esc(tr.modelo) || 'Transdutor sem modelo informado'}</span>
        <button class="tirar" data-tirar="${i}" title="Remover transdutor"
                aria-label="Remover transdutor T${i+1}"
                ${d.transdutores.length === 1 ? 'disabled' : ''}>×</button>
      </div>
      <div class="form-grid">
        <div class="campo-form"><label>Tipo</label>
          <select data-t="tipo">${TIPOS_TRANSD.map(x=>
            `<option${x === tr.tipo ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
        ${CAMPOS_TRANSD.map(c=>
          `<div class="campo-form"><label>${esc(c.r)}</label>
            <input data-t="${c.k}" value="${esc(tr[c.k])}"
                   ${c.dica ? `placeholder="${esc(c.dica)}"` : ''} autocomplete="off"></div>`).join('')}
      </div>
    </div>`).join('');

  const faltando = CAMPOS_EQUIP.filter(c => c.req && !String(d[c.k]).trim()).map(c => c.r);
  const duplicado = PARQUE.some(e => e.id.toLowerCase() === d.id.trim().toLowerCase());

  topo({voltar:'parque', titulo:'Novo equipamento', sub:hospAtual().nome});

  el('vista').innerHTML = `
    <p class="sub" style="margin:14px 0 4px">Os treze testes da IN nº 96 são criados
      automaticamente para cada transdutor informado.</p>

    <p class="rotulo">Identificação</p>
    <div class="card pad">
      <div class="form-grid">${campos}</div>
    </div>

    <p class="rotulo">Transdutores</p>
    <div class="card pad">
      ${linhas}
      <button class="bt mini" id="btMais" style="margin-top:14px">+ Adicionar transdutor</button>
      <p class="base-nota">O slot é atribuído na ordem — é ele que amarra o transdutor à sua
      aba de resultados. O número de série é a chave da linha de base: acompanha o hardware
      mesmo que o patrimônio seja reetiquetado.</p>
    </div>

    ${faltando.length
      ? `<p class="sub" style="margin-top:16px; color:var(--warn)">
           Falta preencher: ${esc(faltando.join(', '))}.</p>`
      : duplicado
      ? `<p class="sub" style="margin-top:16px; color:var(--warn)">
           Já existe um equipamento com o código <span class="mono">${esc(d.id)}</span>.</p>`
      : ''}

    ${acaoFixa(`
      <button class="bt" id="btCancelar">Cancelar</button>
      <button class="bt principal" id="btSalvar"
              ${faltando.length || duplicado ? 'disabled' : ''}>Cadastrar e iniciar</button>`)}`;

  /* Os campos gravam no rascunho sem redesenhar a tela, para não perder o
     cursor a cada tecla. Só a validação do rodapé é recalculada. */
  document.querySelectorAll('[data-f]').forEach(inp =>
    inp.addEventListener('input', ()=>{ d[inp.dataset.f] = inp.value; validarCadastro(); }));

  document.querySelectorAll('.bloco-transd').forEach(bloco =>
    bloco.querySelectorAll('[data-t]').forEach(inp =>
      inp.addEventListener('input', ()=>{
        d.transdutores[+bloco.dataset.i][inp.dataset.t] = inp.value;
      })));

  document.querySelectorAll('[data-tirar]').forEach(b =>
    b.addEventListener('click', ()=>{ d.transdutores.splice(+b.dataset.tirar, 1); render(); }));

  el('btMais').addEventListener('click', ()=>{ d.transdutores.push(transdutorNovo()); render(); });
  el('btCancelar').addEventListener('click', ()=> ir('parque', {rascunho:null}));
  el('btSalvar').addEventListener('click', salvarCadastro);
}

function validarCadastro(){
  const d = ESTADO.rascunho;
  const falta = CAMPOS_EQUIP.some(c => c.req && !String(d[c.k]).trim());
  const dup = PARQUE.some(e => e.id.toLowerCase() === d.id.trim().toLowerCase());
  el('btSalvar').disabled = falta || dup;
}

function salvarCadastro(){
  const d = ESTADO.rascunho;
  const eq = {
    id:d.id.trim(), relatorio:'', periodicidade:d.periodicidade,
    visita:hoje(), validade:'',
    hosp:ESTADO.hosp, unidade:d.unidade.trim(),
    marca:d.marca.trim(), modelo:d.modelo.trim(), ns:d.ns.trim(),
    patrimonio:d.patrimonio.trim(), setor:d.setor.trim(), sala:d.sala.trim(),
    semHistorico:true,            /* nasce sem acervo: tudo sai como ELB */
    transdutores:d.transdutores.map((tr,i)=>({
      slot:'T' + (i+1), tipo:tr.tipo,
      modelo:tr.modelo.trim() || '—', ns:tr.ns.trim() || '—', cod:tr.cod.trim() || '—',
      fmax:num(tr.fmax),
      tec:{protocolo:tr.protocolo.trim() || '—', potencia:'—', ad:'—', profmax:'—',
           rejeicao:'—', graymap:'—', bandafocal:'—', densidade:'—'}
    })),
    medidas:{}
  };
  PARQUE.push(eq);
  ir('equip', {equip:eq.id, rascunho:null, busca:''});
}

function hoje(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear();
}

          <span class="chip c-${rt.situacao}">${ROTULOS[rt.situacao]}</span>
          <span class="sub mono">${esc(tr.slot)}</span>
        </div>
        <div class="cli">${esc(tr.tipo)} · N/S ${esc(tr.ns)} · ${esc(tr.cod)} ·
          ${esc(tr.tec.protocolo)}</div>
        <div class="l3">
          <span class="progresso"><i style="width:${pct}%"></i></span>
          <span class="pct mono">${feitos}/${rt.total} medidos</span>
        </div>
      </button>
      <button class="apagar-t" data-apagar="${esc(tr.slot)}"
              title="Remover transdutor ${esc(tr.slot)}"
              aria-label="Remover o transdutor ${esc(tr.slot)}, ${esc(tr.modelo)}">×</button>
    </div>`;
  }).join('');

  topo({voltar:'parque', titulo:eq.marca + ' ' + eq.modelo,
        sub:eq.id + ' · N/S ' + eq.ns});

  el('vista').innerHTML = `
    <p class="sub" style="margin:14px 0 4px">${esc(eq.unidade) || '—'} ·
      ${esc(eq.sala) || '—'}${eq.visita ? ' · visita de ' + esc(eq.visita) : ''}</p>

    ${eq.semHistorico ? `<p class="sub" style="margin-top:12px; max-width:66ch">
      Equipamento recém-cadastrado: não há visita anterior, então todos os testes de
      linha de base sairão como <span class="mono">ELB</span> neste primeiro relatório.
      Os de critério fixo já saem avaliados.</p>`
    : temMedidas(eq) ? chaveHistorico()
    : `<p class="sub" style="margin-top:12px; max-width:66ch">
      Visita em branco: os treze testes de cada transdutor estão criados e esperando
      medida. Abra qualquer um e digite, ou use o botão de exemplo no rodapé.</p>`}

    <p class="rotulo">Vistoria</p>
    <button class="teste" id="btVistoria">
      <span class="chip c-${vist.pend === INSPECAO_EQUIP.length ? 'pend'
                          : vist.nconf ? 'nconf' : vist.pend ? 'pend' : 'conf'}">${
        vist.pend === INSPECAO_EQUIP.length ? 'não iniciada'
        : vist.nconf ? vist.nconf + ' não conforme(s)'
        : vist.pend ? 'em andamento' : 'conforme'}</span>
      <span class="corpo">
        <span class="nome">Console, monitor, transdutores e documentação</span>
        <span class="meta">${INSPECAO_EQUIP.length} itens · abre a visita · não é teste do Anexo I</span>
      </span>
      <span class="valor">${vist.conf + vist.nconf}/${INSPECAO_EQUIP.length}</span>
    </button>

    <p class="rotulo">Situação da visita</p>
    <div class="resumo">
      <div class="res-item"><div class="n mono" style="color:var(--ok)">${r.geral.conf}</div><div class="r">conformes</div></div>
      <div class="res-item"><div class="n mono" style="color:var(--warn)">${r.geral.nconf}</div><div class="r">não conformes</div></div>
      <div class="res-item"><div class="n mono" style="color:var(--info)">${r.geral.elb}</div><div class="r">ELB</div></div>
      <div class="res-item"><div class="n mono" style="color:var(--neutro)">${r.geral.na}</div><div class="r">não aplicáveis</div></div>
      <div class="res-item"><div class="n mono">${r.geral.pend}</div><div class="r">pendentes</div></div>
    </div>

    <p class="rotulo">Transdutores</p>
    <div class="lista">
      ${cartoes || '<p class="vazio-msg">Este equipamento ainda não tem transdutor cadastrado.</p>'}
      ${botaoNovo('btNovoT', 'Adicionar transdutor',
                  'Entra como ' + proximoSlot(eq) + ', com os treze testes prontos')}
    </div>

    ${acaoFixa(`
      ${cheio
        ? '<button class="bt" id="btLimparEq">Limpar medidas</button>'
        : ''}
      ${eq.transdutores.length
        ? `<button class="bt" id="btDemoEq">${
             !cheio ? 'Gerar demonstração' : vazios.length ? 'Completar medidas' : 'Regerar medidas'}</button>`
        : ''}
      <button class="bt principal" id="btRel">Ver o relatório</button>`)}`;

  ligarChave();
  document.querySelectorAll('.equip').forEach(b =>
    b.addEventListener('click', ()=> ir('transd', {slot:b.dataset.slot})));
  el('btNovoT').addEventListener('click', ()=> ir('cadTransd', {rascunho:null}));
  el('btRel').addEventListener('click', ()=> ir('relatorio'));
  el('btVistoria').addEventListener('click', ()=> ir('vistoria'));

  /* Remover é do cadastro: leva junto as medidas daquele slot, e só as dele. */
  document.querySelectorAll('[data-apagar]').forEach(b =>
    b.addEventListener('click', ()=>{
      const slot = b.dataset.apagar;
      const tr = eq.transdutores.find(x => x.slot === slot);
      if (!tr) return;
      if (confirm('Remover o transdutor ' + slot + ' — ' + tr.modelo +
                  '? As medidas coletadas nele também são apagadas.')){
        eq.transdutores = eq.transdutores.filter(x => x.slot !== slot);
        limparTransd(eq, slot);
        render();
      }
    }));

  const bDemo = el('btDemoEq'), bLimpa = el('btLimparEq');
  /* Com a visita já preenchida, o botão só cobre quem ficou para trás — um
     transdutor cadastrado depois da geração. Sem nada preenchido, gera tudo. */
  if (bDemo) bDemo.addEventListener('click', ()=>{
    if (cheio && vazios.length) vazios.forEach(tr => gerarDemo(eq, tr.slot));
    else gerarDemo(eq);
    render();
  });
  if (bLimpa) bLimpa.addEventListener('click', ()=>{
    if (confirm('Apagar as medidas deste equipamento? O cadastro não é afetado.')){
      limparMedidas(eq); render();
    }
  });
}

/* ==========================================================================

   ========================================================================== */

function painelBase(t, eq, tr, linha, col, valor, rotulo){
  const reg = eq.medidas[tr.slot][t.id];
  if (reg.marca === 'elb'){
    return `<div class="base-painel sem">
      <div>
        <h3>Linha de base</h3>
        <div class="base-nums"><div><span>Referência</span><b>descartada</b></div></div>
        <p class="base-nota">Marcado como <b>estabelecendo nova linha de base</b>. O
        histórico anterior deixa de valer para esta combinação, e a medida desta visita
        passa a ser a referência. O relatório sai com <span class="mono">ELB</span> nesta
        linha.${reg.marcaObs ? ' Justificativa: <i>' + esc(reg.marcaObs) + '</i>' : ''}</p>
      </div></div>`;
  }
  const r = contraBase(t, eq, tr.slot, linha, col, valor);
  if (!r){
    return `<div class="base-painel sem">
      <div>
        <h3>Linha de base</h3>
        <div class="base-nums"><div><span>Referência</span><b>—</b></div></div>
        <p class="base-nota">Primeira medida desta combinação de equipamento, transdutor,
        protocolo e técnica. Sem referência, o relatório sai com
        <span class="mono">ELB</span> — <em>estabelecendo linha de base</em> — e a avaliação
        fica para a próxima visita.</p>
      </div></div>`;
  }
  const exato = t.tolBase === 'exato';
  const cor = r.situacao === 'conf' ? 'var(--ok)' : 'var(--warn)';
  return `<div class="base-painel">
    <div>
      <h3>Linha de base${rotulo ? ' · ' + esc(rotulo) : ''}</h3>
      <div class="base-nums">
        <div><span>Referência (${r.serie.length} visitas)</span><b>${fmt(r.ref)}${t.un ? ' ' + t.un : ''}</b></div>
        <div><span>Esta visita</span><b>${fmt(valor)}${t.un ? ' ' + t.un : ''}</b></div>
        <div><span>${exato ? 'Diferença' : (t.tolAbs ? 'Desvio' : 'Variação')}</span>
             <b style="color:${cor}">${
               exato    ? fmt(r.delta, 0)
             : t.tolAbs ? (r.delta > 0 ? '+' : '') + fmt(r.delta) + (t.un ? ' ' + t.un : '')
                        : pctTxt(r.pct)}</b></div>
        <div><span>Avaliação</span><b><span class="chip c-${r.situacao}">${ROTULOS[r.situacao]}</span></b></div>
      </div>
      <p class="base-nota">Tolerância aplicada: ${esc(tolDe(t, tr))}.
        A caixa <b>Tolerância IN&nbsp;-&nbsp;96</b> do relatório traz o texto da norma:
        <i>${esc(t.tolIN)}</i></p>
    </div>
    <div>${sparkline(r, valor)}</div>
  </div>`;
}

/* --- as duas marcações manuais que o técnico pode dar a um teste --------- */
const MARCAS = {
  elb:{
    rot:'Estabelecendo nova linha de base',
    expl:`A medida desta visita passa a ser a referência, e o histórico anterior desta
      combinação deixa de valer. Use após troca de transdutor, manutenção corretiva ou
      mudança deliberada de técnica. O relatório sai com ELB nestas linhas.`
  },
  na:{
    rot:'Não aplicável',
    expl:`O teste não se aplica a este transdutor, ou não pôde ser realizado nesta visita.
      Sai do relatório como Não aplicável, com a justificativa, e não entra na contagem de
      pendências nem de não conformidades.`
  }
};

function blocoMarcas(reg){
  const m = reg.marca;
  const botoes = Object.keys(MARCAS).map(k=>
    `<button class="marca-bt" data-m="${k}" data-s="${k}" aria-pressed="${m === k}">
      ${esc(MARCAS[k].rot)}</button>`).join('');

  return `<div class="marcas">${botoes}</div>
    ${m ? `<div class="marca-ativa m-${m}">
      <b>${esc(MARCAS[m].rot)}</b>
      <p>${esc(MARCAS[m].expl.replace(/\s+/g,' ').trim())}</p>
      <input class="txt" id="cMarcaObs" value="${esc(reg.marcaObs)}" autocomplete="off"
             placeholder="Justificativa — sai na coluna Observações do relatório">
    </div>` : ''}`;
}

function telaTeste(){
  const eq = equipAtual(), tr = transdAtual();
  const t = POR_ID[ESTADO.teste];
  const reg = registro(eq, tr.slot, t.id);
  const a = avaliar(t, eq, tr);

  let corpo = '';

  if (t.tipo === 'qualit'){
    corpo = `<div class="opcoes">${t.opcoes.map(([rot,s])=>
      `<button class="opcao" data-res="${esc(rot)}" data-s="${s}" aria-pressed="${reg.res === rot}">${esc(rot)}
        <small>${s === 'conf' ? 'atende ao critério da IN-96' : 'registrar a descrição do artefato'}</small>
      </button>`).join('')}</div>
      <p class="rotulo" style="margin-top:4px">Descrição do artefato</p>
      <textarea class="obs" id="cObs" placeholder="Descreva o artefato observado">${esc(reg.obs)}</textarea>`;
  }

  else if (t.tipo === 'escalar'){
    corpo = `<div class="campos-num">${t.campos.map(c=>
      `<div class="campo-num${c.ctx ? ' ctx' : ''}">
        <label for="c-${c.k}">${esc(c.r)}${c.ctx ? ' · contexto' : ''}</label>
        <div class="linha">
          <input id="c-${c.k}" class="mono" data-k="${c.k}" inputmode="decimal"
                 placeholder="—" value="${val(reg[c.k])}">
          <span class="un">${esc(c.un)}</span>
        </div>
      </div>`).join('')}</div>`;
    if (t.deriv && !t.campos.some(c => nada(reg[c.k]))){
      const d = t.deriv(reg);
      corpo += `<div class="base-nums" style="margin:14px 2px 0">
        <div><span>${esc(d.r)}</span><b>${fmt(d.v)} ${esc(d.un)}</b></div>
        <div><span>Avaliação</span><b><span class="chip c-${a.situacao}">${ROTULOS[a.situacao]}</span></b></div>
      </div>`;
    }
    if (t.base) corpo += painelBase(t, eq, tr, undefined, t.metrica, reg[t.metrica]);
  }

  else if (t.tipo === 'booleana'){
    const linhas = t.linhas.map(l=>{
      const v = reg.linhas[l];
      const cels = t.cols.map(c=>{
        const s = serie(eq, tr.slot, t.id, l, c.k);
        const mudou = ESTADO.historico && s && s.every(p => p.v === 1) && v[c.k] === 0;
        return `<td><span class="sn">
          <button data-l="${esc(l)}" data-c="${c.k}" data-v="1" aria-pressed="${v[c.k] === 1}">Sim</button>
          <button data-l="${esc(l)}" data-c="${c.k}" data-v="0" aria-pressed="${v[c.k] === 0}">Não</button>
        </span>${mudou ? '<div class="sub" style="color:var(--warn); margin-top:3px">era Sim nas 3 visitas</div>' : ''}</td>`;
      }).join('');
      return `<tr><td class="mono">${esc(l)}</td>${cels}</tr>`;
    }).join('');
    corpo = `<div class="tab-scroll"><table>
      <thead><tr><th>${esc(t.indice)}</th>${t.cols.map(c=>`<th>${esc(c.r)}</th>`).join('')}</tr></thead>
      <tbody>${linhas}</tbody></table></div>
      <p class="base-nota" style="margin-top:12px">${ESTADO.historico
        ? 'Cada célula é comparada com o que se via nas visitas anteriores. O aviso aparece quando um alvo que sempre foi visto deixa de ser.'
        : 'Sem histórico não há o que comparar: as seis linhas saem como <span class="mono">ELB</span> no relatório.'}</p>`;
  }

  else {
    const linhas = linhasDe(t, reg);
    const corpoTab = linhas.map(l=>{
      const v = reg.linhas[l];
      const cels = t.cols.map(c=>
        `<td class="num"><input class="cel" data-l="${esc(l)}" data-c="${c.k}"
           inputmode="decimal" placeholder="—" value="${val(v[c.k])}"></td>`).join('');
      const completa = t.cols.every(c => !nada(v[c.k]));
      let sit = 'pend', ref = '';
      if (completa){
        const r = t.aval ? {situacao:t.aval(v, tr)} : contraBase(t, eq, tr.slot, l, t.metrica, v[t.metrica]);
        sit = r ? r.situacao : 'elb';
        if (r && r.ref !== undefined)
          ref = `<div class="sub mono" style="margin-top:3px">ref. ${fmt(r.ref)}${
            r.pct === null ? '' : ' · ' + pctTxt(r.pct)}</div>`;
      }
      return `<tr><td class="mono">${esc(l)}</td>${cels}
        <td><span class="chip c-${sit}">${ROTULOS[sit]}</span>${ref}</td></tr>`;
    }).join('');
    corpo = `<div class="tab-scroll"><table>
      <thead><tr><th>${esc(t.indice)}</th>${t.cols.map(c=>
        `<th class="num">${esc(c.r)}${c.un ? ' (' + esc(c.un) + ')' : ''}</th>`).join('')}
        <th>Avaliação</th></tr></thead>
      <tbody>${corpoTab}</tbody></table></div>`;

    if (t.base && !t.aval){
      const l0 = linhas[0];
      corpo += painelBase(t, eq, tr, l0, t.metrica, reg.linhas[l0][t.metrica], t.indice + ' ' + l0);
    }
    if (t.aval){
      corpo += `<p class="base-nota" style="margin-top:12px">Critério fixo:
        ${esc(tolDe(t, tr))}. Não depende de histórico — a avaliação sai já na primeira
        visita. Texto da norma: <i>${esc(t.tolIN)}</i></p>`;
    }
  }

  topo({voltar:'transd', titulo:t.num + '. ' + t.nome,
        sub:tr.modelo + ' · ' + tr.tec.protocolo});

  el('vista').innerHTML = `
    <p class="sub" style="margin:14px 0 2px">Tolerância: ${esc(tolDe(t, tr))}</p>

    ${blocoMarcas(reg)}

    ${t.semAq || reg.marca === 'na' ? '' : `<p class="rotulo">Parâmetros de aquisição deste teste</p>
    <div class="aquis">${['Gn','Fc','Fr','Pr'].map(k=>
      `<div class="aq"><span>${k}</span>
        <input class="mono" data-aq="${k}" value="${esc(reg.acq[k])}" placeholder="—"></div>`).join('')}</div>`}

    ${reg.marca === 'na' ? '' : corpo}

    <p class="rotulo">Demonstração</p>
    <div class="card pad">
      <div class="rodape-acoes" style="margin:0">
        <button class="bt mini" id="btGerarTeste">Gerar medidas de exemplo</button>
        ${regPreenchido(reg) ? '<button class="bt mini" id="btLimparTeste">Limpar este teste</button>' : ''}
      </div>
      <p class="base-nota" style="margin:11px 0 0">Preenche só este teste, com os parâmetros
      de aquisição e as medidas do acervo — ou, para um transdutor cadastrado agora, com
      valores gerados para a sua frequência.</p>
    </div>

    ${podeHistorico(eq) ? chaveHistorico() : ''}

    ${acaoFixa(`
      <button class="bt" id="btVoltar2">Roteiro</button>
      <button class="bt principal" id="btRel">Ver no relatório</button>`)}`;

  /* Toda escrita grava no registro e redesenha, para que avaliação, painel de
     linha de base e minigráfico acompanhem a digitação. */
  const guardar = () => { render(); };

  document.querySelectorAll('.marca-bt').forEach(b =>
    b.addEventListener('click', ()=>{
      reg.marca = reg.marca === b.dataset.m ? null : b.dataset.m;
      if (!reg.marca) reg.marcaObs = '';
      guardar();
    }));
  const obsM = el('cMarcaObs');
  if (obsM) obsM.addEventListener('change', ()=>{ reg.marcaObs = obsM.value; });

  document.querySelectorAll('[data-aq]').forEach(inp =>
    inp.addEventListener('change', ()=>{ reg.acq[inp.dataset.aq] = inp.value; }));

  document.querySelectorAll('.opcao').forEach(b =>
    b.addEventListener('click', ()=>{ reg.res = b.dataset.res; guardar(); }));
  const obs = el('cObs');
  if (obs) obs.addEventListener('change', ()=>{ reg.obs = obs.value; });

  document.querySelectorAll('.campo-num input[data-k]').forEach(inp =>
    inp.addEventListener('change', ()=>{ reg[inp.dataset.k] = num(inp.value); guardar(); }));

  document.querySelectorAll('input.cel').forEach(inp =>
    inp.addEventListener('change', ()=>{
      reg.linhas[inp.dataset.l][inp.dataset.c] = num(inp.value); guardar();
    }));

  document.querySelectorAll('.sn button').forEach(b =>
    b.addEventListener('click', ()=>{
      reg.linhas[b.dataset.l][b.dataset.c] = +b.dataset.v; guardar();
    }));

  el('btGerarTeste').addEventListener('click', ()=>{
    gerarDemoTeste(eq, tr, t.id); render();
  });
  const btLimpaT = el('btLimparTeste');
  if (btLimpaT) btLimpaT.addEventListener('click', ()=>{
    limparTeste(eq, tr.slot, t.id); render();
  });

  ligarChave();
  el('btVoltar2').addEventListener('click', ()=> ir('transd'));
  el('btRel').addEventListener('click', ()=> ir('relatorio'));
}

/* --- um bloco de resultado, na numeração do relatório -------------------- */
function blocoTeste(t, eq, tr, num){
  const reg = eq.medidas[tr.slot] && eq.medidas[tr.slot][t.id];
  const a = avaliar(t, eq, tr);
  const chip = s => `<span class="chip c-${s}">${ROTULOS_DOC[s]}</span>`;
  /* Marcado como nova linha de base: os valores continuam no relatório, mas a
     avaliação de todas as linhas é ELB — não há referência válida com que
     comparar, porque o histórico foi descartado de propósito. */
  const elbForcado = reg && reg.marca === 'elb';
  const sit = s => elbForcado ? 'elb' : s;
  let tabela = '';

  if (reg && reg.marca === 'na'){
    tabela = `<table><thead><tr><th>Resultado</th><th>Avaliação</th><th>Observações</th></tr></thead>
      <tbody><tr><td>Teste não aplicável a este transdutor.</td><td>${chip('na')}</td>
      <td>${esc(reg.marcaObs) || '—'}</td></tr></tbody></table>`;
  }
  else if (!reg || a.situacao === 'pend'){
    tabela = `<table><tbody><tr><td>Teste ainda não realizado.</td>
      <td style="width:1%">${chip('pend')}</td></tr></tbody></table>`;
  }
  else if (t.tipo === 'qualit'){
    tabela = `<table><thead><tr><th>Resultado</th><th>Avaliação</th><th>Observações</th></tr></thead>
      <tbody><tr><td>${esc(reg.res)}</td><td>${chip(a.situacao)}</td>
      <td>${esc(reg.obs) || '—'}</td></tr></tbody></table>`;
  }
  else if (t.tipo === 'escalar'){
    const d = t.deriv ? t.deriv(reg) : null;
    const r = t.base ? contraBase(t, eq, tr.slot, undefined, t.metrica, reg[t.metrica]) : null;
    tabela = `<table>
      <thead><tr>${t.campos.map(c=>`<th class="num">${esc(c.r)} (${esc(c.un)})</th>`).join('')}
        ${d ? `<th class="num">${esc(d.r)} (${esc(d.un)})</th>` : ''}
        ${t.base ? '<th class="num">Linha de base</th>' : ''}
        <th>Avaliação</th></tr></thead>
      <tbody><tr>${t.campos.map(c=>`<td class="num mono">${fmt(reg[c.k])}</td>`).join('')}
        ${d ? `<td class="num mono">${fmt(d.v)}</td>` : ''}
        ${t.base ? `<td class="num mono">${elbForcado || !r ? '—' : fmt(r.ref) + ' ' + t.un}</td>` : ''}
        <td>${chip(a.situacao)}</td></tr></tbody></table>`;
  }
  else if (t.tipo === 'booleana'){
    const linhas = t.linhas.map(l=>{
      const v = reg.linhas[l];
      let s0 = 'elb', nota = '';
      if (ESTADO.historico && !elbForcado){
        const mudou = t.cols.some(c=>{
          const s = serie(eq, tr.slot, t.id, l, c.k);
          return s && s.every(p => p.v === 1) && v[c.k] === 0;
        });
        s0 = mudou ? 'nconf' : 'conf';
        if (mudou) nota = ' <span class="sub">(mudou)</span>';
      }
      return `<tr><td class="mono">${esc(l)}</td>
        ${t.cols.map(c=>`<td>${v[c.k] ? 'Sim' : 'Não'}</td>`).join('')}
        <td>${chip(sit(s0))}${nota}</td></tr>`;
    }).join('');
    tabela = `<table><thead><tr><th>${esc(t.indice)}</th>
      ${t.cols.map(c=>`<th>${esc(c.r)}</th>`).join('')}<th>Avaliação</th></tr></thead>
      <tbody>${linhas}</tbody></table>`;
  }
  else {
    const linhas = linhasDe(t, reg).map(l=>{
      const v = reg.linhas[l];
      const r = t.aval ? {situacao:t.aval(v, tr)} : contraBase(t, eq, tr.slot, l, t.metrica, v[t.metrica]);
      return `<tr><td class="mono">${esc(l)}</td>
        ${t.cols.map(c=>`<td class="num mono">${fmt(v[c.k])}</td>`).join('')}
        ${t.aval ? '' : `<td class="num mono">${elbForcado || !r ? '—' : fmt(r.ref)}</td>`}
        <td>${chip(sit(r ? r.situacao : 'elb'))}</td></tr>`;
    }).join('');
    tabela = `<table><thead><tr><th>${esc(t.indice)}</th>
      ${t.cols.map(c=>`<th class="num">${esc(c.r)}${c.un ? ' (' + esc(c.un) + ')' : ''}</th>`).join('')}
      ${t.aval ? '' : '<th class="num">Linha de base</th>'}<th>Avaliação</th></tr></thead>
      <tbody>${linhas}</tbody></table>`;
  }

  const aq = reg && !t.semAq && reg.marca !== 'na'
    ? ['Gn','Fc','Fr','Pr'].filter(k => reg.acq[k]).map(k => k + ': ' + reg.acq[k]).join(' · ')
    : '';

  /* A justificativa da marcação vai logo abaixo da tabela — num relatório
     regulatório, um ELB ou um NA sem motivo declarado é um buraco. */
  const nota = elbForcado
    ? '* Estabelecendo nova linha de base' + (reg.marcaObs ? ' — ' + reg.marcaObs : '')
    : '';

  /* Título, parâmetros de aquisição e tabela são uma coisa só: na impressão o
     bloco inteiro passa para a folha seguinte em vez de partir no meio. */
  return `<div class="bloco-res">
    <h4><span class="num">${esc(num)}</span>${esc(t.nome)}</h4>
    ${aq ? `<p class="aq-linha">Parâmetros de Aquisição — ${esc(aq)}</p>` : ''}
    <div class="tab-scroll">${tabela}</div>
    ${nota ? `<p class="nota-marca">${esc(nota)}</p>` : ''}
  </div>`;
}

/* --- tabela de inspeção geral ------------------------------------------- */
function tabelaInspecao(itens, valores, obs, grupos){
  const linha = i=>{
    const v = (valores || {})[i];
    const o = ((obs || {})[i] || '').trim();
    return `<tr><td>${esc(i)}</td>
      <td style="width:1%">${v ? `<span class="chip c-${v === 'Conforme' ? 'conf' : 'nconf'}">${esc(v)}</span>`
                               : '<span class="chip c-pend">Não inspecionado</span>'}</td>
      <td style="width:22%">${esc(o) || '—'}</td></tr>`;
  };
  /* Com grupos, cada um abre uma linha de título — é como a vistoria é feita e
     como o laudo fica legível. Sem grupos, a tabela sai corrida, que é o caso
     da inspeção de transdutor, de dois itens. */
  const linhas = grupos
    ? grupos.map(g=>`<tr class="total"><td colspan="3">${esc(g.grupo)}</td></tr>`
                    + g.itens.map(linha).join('')).join('')
    : itens.map(linha).join('');
  return `<div class="tab-scroll"><table>
    <thead><tr><th>Inspeção</th><th>Avaliação</th><th>Observações</th></tr></thead>
    <tbody>${linhas}</tbody></table></div>`;
}

    if (a.situacao === 'nconf') achados.push({tr, t, a});
    if (a.situacao === 'na')    naoAplicaveis.push({tr, t});
    if (a.situacao === 'elb')   elbs++;
    if (a.situacao === 'pend')  pends++;

  const ano = (eq.visita || '').slice(-4) || String(new Date().getFullYear());

    .map(p => p.replace(/\s+/g, ' ').trim()).filter(Boolean);

/* ==========================================================================
   Persistência da visita

   Este coletor guarda cadastro e coleta no mesmo objeto do PARQUE — nasceu
   assim, e mudar isso mexeria em todas as telas. A separação acontece aqui,
   na fronteira do armazenamento: `CAMPOS_VISITA` diz o que é da visita, e só
   isso é gravado. O acervo continua vindo do cadastro da casca.

   Os transdutores são um caso à parte: são acervo, mas a casca não os modela
   — quem os cadastra é este coletor, na tela de transdutores. Então ficam
   gravados aqui também, sob `BD.transdutores`, e não junto da visita.
   ========================================================================== */

const CHAVE = 'coletor-cq-us-in96-v1';

/* O que pertence à visita e não ao acervo. Campo que não estiver nesta lista
   não é gravado — se um dia a coleta ganhar um dado novo no equipamento,
   acrescente aqui ou ele some ao recarregar. */
const CAMPOS_VISITA = ['medidas', 'inspecao', 'inspObs', 'inspTransd',
                       'visita', 'validade', 'semHistorico'];

function carregar(){
  try {
    const s = localStorage.getItem(CHAVE);
    if (s){
      const d = JSON.parse(s);
      if (d && typeof d === 'object') return {visitas: d.visitas || {}, transdutores: d.transdutores || {}};
    }
  } catch(e){ /* modo privado ou dado corrompido: começa limpo */ }
  return {visitas:{}, transdutores:{}};
}

let BD = carregar();

/* Devolve ao PARQUE o que estava gravado. Roda depois da ponte com o
   cadastro, senão a ponte reconstrói os equipamentos por cima. */
function hidratar(){
  PARQUE.forEach(eq => {
    const v = BD.visitas[eq.id];
    if (v) CAMPOS_VISITA.forEach(k => { if (v[k] !== undefined) eq[k] = v[k]; });
    const t = BD.transdutores[eq.id];
    if (t && t.length) eq.transdutores = t;
  });
}

/* O veredito de cada visita, gravado junto. É o que a tela de relatórios da
   casca lê — ela não conhece os treze testes nem a linha de base, e não pode
   recalcular nada. Mesmo formato do coletor de raios X. */
function atualizarResumos(){
  PARQUE.forEach(eq => {
    const v = BD.visitas[eq.id];
    if (!v) return;
    let r;
    try { r = resumoEquip(eq); }
    catch(e){ return; }   /* visita que não fecha a conta não impede o salvamento */
    v.resumo = {
      situacao: r.situacao,
      contagem: r.geral,
      concluidos: r.feitos,
      total: r.total,
      atualizado: Date.now()
    };
  });
}

/* Guarda o texto da última gravação: render() roda a cada toque, inclusive
   nos que só navegam, e reescrever o mesmo JSON a cada tela seria desperdício
   sem ganho nenhum. */
let ultimoGravado = null;

/* Equipamento em que ninguém tocou não tem visita. Sem esta guarda, gravar
   percorreria o parque inteiro e criaria um registro vazio para cada máquina
   — e a tela de relatórios da casca listaria o parque todo como visitado,
   cada um com zero de trinta e sete. */
const temVisita = eq => !!(
  (eq.medidas    && Object.keys(eq.medidas).length) ||
  (eq.inspecao   && Object.keys(eq.inspecao).length) ||
  (eq.inspTransd && Object.keys(eq.inspTransd).length));

function persistir(){
  PARQUE.forEach(eq => {
    /* Os transdutores são acervo e se gravam sempre: cadastrar uma sonda não
       é iniciar uma visita, mas também não pode se perder. */
    if (eq.transdutores) BD.transdutores[eq.id] = eq.transdutores;
    if (!temVisita(eq)){ delete BD.visitas[eq.id]; return; }
    const v = BD.visitas[eq.id] = BD.visitas[eq.id] || {};
    CAMPOS_VISITA.forEach(k => { if (eq[k] !== undefined) v[k] = eq[k]; });
  });
  try { atualizarResumos(); } catch(e){ /* resumo é conveniência, não bloqueia */ }
  try {
    const texto = JSON.stringify(BD);
    if (texto === ultimoGravado) return;
    localStorage.setItem(CHAVE, texto);
    ultimoGravado = texto;
  } catch(e){ /* cota estourada ou modo privado: a sessão segue em memória */ }
}

/* Apaga a visita deste equipamento do armazenamento, sem tocar no acervo nem
   nos transdutores — é o que "limpar medidas" quer dizer. */
function esquecerVisita(eqId){
  if (BD.visitas[eqId]) delete BD.visitas[eqId];
  ultimoGravado = null;
}

/* ==========================================================================
   Exportação da visita em planilha

   Formato longo, igual ao dos coletores de raios X: cada linha é uma
   grandeza, e o par variável/valor diz o que aquele número é. A diferença é
   a coluna `transdutor` — o eixo que só o ultrassom tem. Nos outros
   coletores ela não existe; no banco, empilhado, ela fica vazia para eles.

   O que a planilha guarda é a **leitura**. A situação vai junto por
   conveniência, mas depende da linha de base do serviço e do histórico: ao
   reimportar, reavalie, não confie na coluna.
   ========================================================================== */

const COLUNAS_PLANILHA = [{rot:'', larg:58}, {rot:'', larg:36}];

/* A unidade vai no rótulo, e não numa terceira coluna: assim a coluna B fica
   só com o que foi medido ou cadastrado. */
const un = u => u ? ' (' + u + ')' : '';

/* O motor trabalha em ponto flutuante; a planilha não precisa dos dezessete
   dígitos que sobram da conta. */
const arredP = v => (v == null || !isFinite(v)) ? v : Number(Number(v).toFixed(4));

function linhasPlanilha(eqId){
  const eq = PARQUE.find(e => e.id === eqId);
  const h = hospPorId(eq.hosp);
  const data = eq.visita || hoje();
  const L = [];

  const par   = (rot, val) => { if (val != null && val !== '' && val !== '—') L.push([rot, val]); };
  const sub   = (rot, val) => par('    ' + rot, val);
  const forte = rot => { const l = [rot, '']; l.forte = true; L.push(l); };
  const secao = t => L.push({secao:t});
  const vazio = () => L.push({vazio:true});

  L.push({titulo:'Controle de Qualidade — Ultrassom Diagnóstico'});
  par('Instrução Normativa', 'IN nº 96/2021 · RDC nº 611/2022');
  par('Data da visita', data);
  par('Relatório nº', eq.relatorio);
  par('Periodicidade', eq.periodicidade);
  vazio();

  secao('CLIENTE');
  par('Instituição', h.nome);
  par('CNPJ', h.cnpj);
  par('Endereço', h.endereco);
  par('Cidade', h.cidade);
  par('CEP', h.cep);
  par('Telefone', h.telefone);
  par('Responsável técnico', h.rt);
  par('Licença sanitária', h.alvara);
  vazio();

  secao('EQUIPAMENTO');
  par('Código', eq.id);
  par('Marca', eq.marca);
  par('Modelo', eq.modelo);
  par('Número de série', eq.ns);
  par('Patrimônio', eq.patrimonio);
  par('Unidade', eq.unidade);
  par('Setor', eq.setor);
  par('Sala', eq.sala);
  vazio();

  secao('VISTORIA DO EQUIPAMENTO');
  VISTORIA.forEach(g => {
    forte(g.grupo);
    g.itens.forEach(item => {
      par('    ' + item, (eq.inspecao || {})[item] || 'Não inspecionado');
      const o = (eq.inspObs || {})[item];
      if (o) par('        observação', o);
    });
  });
  vazio();

  /* Um bloco por transdutor: o cadastro da sonda, a técnica do protocolo que
     torna a medida repetível na próxima visita, e os treze testes. */
  eq.transdutores.forEach(tr => {
    secao('TRANSDUTOR ' + tr.slot + ' · ' + tr.modelo);
    par('Tipo', tr.tipo);
    par('Modelo', tr.modelo);
    par('Número de série', tr.ns);
    par('Código', tr.cod);
    par('Frequência máxima (MHz)', tr.fmax);

    forte('Técnica do protocolo');
    Object.keys(tr.tec || {}).forEach(k => sub(k, tr.tec[k]));

    forte('Inspeção do transdutor');
    (INSPECAO_TRANSD || []).forEach(item =>
      sub(item, ((eq.inspTransd || {})[tr.slot] || {})[item] || 'Não inspecionado'));

    testesDe(tr.slot).forEach(t => {
      const reg = (eq.medidas[tr.slot] || {})[t.id];
      const a = avaliar(t, eq, tr);
      forte(t.nome);

      if (!reg){ sub('Situação', 'não realizado'); return; }

      Object.keys(reg.acq || {}).forEach(k => {
        if (reg.acq[k] != null && reg.acq[k] !== '') sub('aquisição · ' + k, reg.acq[k]);
      });

      if (t.tipo === 'qualit'){
        sub('Avaliação', reg.res || '—');
      } else if (t.tipo === 'escalar'){
        (t.campos || []).forEach(c => {
          if (!nada(reg[c.k])) sub(c.r || c.k, arredP(reg[c.k]));
        });
      } else {
        linhasDe(t, reg).forEach(l => {
          (t.cols || []).forEach(c => {
            const val = (reg.linhas[l] || {})[c.k];
            if (!nada(val))
              sub(String(l) + ' · ' + (c.r || c.k) + un(c.un),
                  typeof val === 'number' ? arredP(val) : val);
          });
        });
      }

      if (t.tolIN) sub('Tolerância', t.tolIN);
      sub('Situação', ROTULOS[a.situacao] || a.texto);
      if (reg.marcaObs || reg.obs) sub('Observação', reg.marcaObs || reg.obs);
    });
    vazio();
  });

  return L;
}

function nomePlanilha(eqId){
  const eq = PARQUE.find(e => e.id === eqId);
  const d = String((eq && eq.visita) || hoje()).split('/');
  const iso = d.length === 3 ? d[2] + '-' + d[1] + '-' + d[0] : 'sem-data';
  return 'CQ_IN96_' + eqId + '_' + iso + '.xlsx';
}

/* Precisa ser chamada de dentro de um toque: tanto a folha de
   compartilhamento quanto o download exigem gesto do usuário. */
async function exportarPlanilha(eqId, botao){
  if (!window.Planilha){
    alert('O gerador de planilha não carregou. Recarregue o aplicativo.');
    return;
  }
  const rotulo = botao ? botao.textContent : '';
  if (botao){ botao.disabled = true; botao.textContent = 'Gerando…'; }
  try {
    const blob = Planilha.gerar({
      aba: 'Visita',
      colunas: COLUNAS_PLANILHA,
      linhas: linhasPlanilha(eqId),
      filtro: false, congelar: false
    });
    const como = await Planilha.salvar(blob, nomePlanilha(eqId));
    if (botao) botao.textContent = como === 'cancelado' ? rotulo : 'Planilha pronta';
  } catch (e){
    if (botao) botao.textContent = 'Falhou — tente de novo';
    console.error('exportarPlanilha', e);
  } finally {
    if (botao){
      botao.disabled = false;
      setTimeout(()=>{ if (botao) botao.textContent = rotulo; }, 2600);
    }
  }
}

/* ==========================================================================
   Vistoria do equipamento

   A inspeção visual não é teste do Anexo I, mas é o que abre a visita e o que
   o laudo traz antes dos resultados. Fica numa tela própria, percorrida de uma
   vez ao chegar na sala, em vez de espalhada entre os testes.

   Três estados por item: conforme, não conforme e não inspecionado. O terceiro
   é o inicial e sobrevive: visita em que ninguém olhou o cabo de alimentação
   sai dizendo isso, e não "conforme" por omissão.
   ========================================================================== */

function contarVistoria(eq){
  const c = {conf:0, nconf:0, pend:0};
  INSPECAO_EQUIP.forEach(i=>{
    const s = (eq.inspecao || {})[i];
    if (s === 'Conforme') c.conf++;
    else if (s) c.nconf++;
    else c.pend++;
  });
  return c;
}

function telaVistoria(){
  const eq = equipAtual();
  const c  = contarVistoria(eq);
  eq.inspecao = eq.inspecao || {};
  eq.inspObs  = eq.inspObs  || {};

  const linha = (item)=>{
    const i = INSPECAO_EQUIP.indexOf(item);
    const s = eq.inspecao[item];
    const o = eq.inspObs[item] || '';
    return `<div class="vist-item ${s && s !== 'Conforme' ? 'nc' : ''}">
      <span class="nome">${esc(item)}</span>
      <span class="sn">
        <button data-i="${i}" data-v="Conforme" aria-pressed="${s === 'Conforme'}">Conforme</button>
        <button data-i="${i}" data-v="Não conforme" aria-pressed="${!!s && s !== 'Conforme'}">Não conforme</button>
      </span>
      ${s && s !== 'Conforme'
        ? `<textarea class="obs" data-o="${i}"
             placeholder="O que foi encontrado — vai para a coluna de observações do laudo">${esc(o)}</textarea>`
        : ''}
    </div>`;
  };

  const itens = VISTORIA.map(g=>{
    const pendentes = g.itens.filter(i=>!eq.inspecao[i]).length;
    return `<div class="grupo-tit"><h2>${esc(g.grupo)}</h2>
        <span>${g.itens.length - pendentes}/${g.itens.length}</span></div>
      <div class="vist-lista">${g.itens.map(linha).join('')}</div>`;
  }).join('');

  topo({voltar:'equip', titulo:'Vistoria do equipamento',
        sub:eq.marca + ' ' + eq.modelo + ' · ' + eq.id});

  el('vista').innerHTML = `
    <div style="margin:14px 0 12px">
      <h1>Inspeção visual</h1>
      <div class="sub">${INSPECAO_EQUIP.length} itens · ${c.conf} conforme(s) ·
        ${c.nconf} não conforme(s) ·
        ${c.pend ? c.pend + ' ainda não inspecionado(s)' : 'nenhum item em aberto'}</div>
    </div>

    <p class="sub" style="margin:0 2px 14px; max-width:66ch">
      Console, monitor, transdutores, biossegurança e documentação. Ultrassom não
      emite radiação ionizante: aqui não há sinalização luminosa, vestimenta
      plumbífera nem dosimetria a conferir. Tocar de novo no botão já marcado
      devolve o item a <b>não inspecionado</b> — o relatório diz o que foi olhado,
      não o que se supõe.
    </p>

    ${itens}

    ${acaoFixa(`
      <button class="bt" id="btTodosConf">Marcar todos conformes</button>
      <button class="bt principal" id="btVoltarEq">Voltar ao equipamento</button>`)}`;

  document.querySelectorAll('.vist-item .sn button').forEach(b =>
    b.addEventListener('click', ()=>{
      const item = INSPECAO_EQUIP[Number(b.dataset.i)];
      /* Tocar no que já está marcado desmarca: é como se corrige um toque
         errado sem ter de apagar a visita inteira. */
      if (eq.inspecao[item] === b.dataset.v) {
        delete eq.inspecao[item];
        delete eq.inspObs[item];
      } else {
        eq.inspecao[item] = b.dataset.v;
      }
      render();
    }));

  /* A observação grava ao sair do campo, não a cada tecla: redesenhar a tela no
     meio da digitação tiraria o foco a cada letra. */
  document.querySelectorAll('.vist-item textarea.obs').forEach(t =>
    t.addEventListener('change', ()=>{
      eq.inspObs[INSPECAO_EQUIP[Number(t.dataset.o)]] = t.value;
    }));

  el('btTodosConf').addEventListener('click', ()=>{
    INSPECAO_EQUIP.forEach(i=>{ if (!eq.inspecao[i]) eq.inspecao[i] = 'Conforme'; });
    render();
  });
  el('btVoltarEq').addEventListener('click', ()=> ir('equip'));
}

const TELAS = {
  hospitais:telaHospitais, cadHospital:telaCadHospital,
  parque:telaParque,       cadastro:telaCadastro,
  equip:telaEquip,         cadTransd:telaCadTransd,
  transd:telaTransd,       teste:telaTeste,
  vistoria:telaVistoria,   relatorio:telaRelatorio,
  sobre:telaSobre
};

function alternarTema(){
  const r = document.documentElement;
  const escuroAgora = r.getAttribute('data-theme') === 'dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', escuroAgora ? 'light' : 'dark');
}

/* Gravar dentro do render é o que garante que nada se perca: neste coletor
   o estado muda em dezenas de manipuladores, e todos terminam aqui. A
   comparação com a última gravação evita reescrever a cada navegação. */
function render(){
  try { persistir(); } catch(e){ /* gravar nunca impede desenhar */ }

  /* Estado órfão — o alvo pode ter sumido ao limpar medidas ou trocar de
     hospital. Cai para o nível mais próximo que ainda existe. */
  if (ESTADO.equip && !equipAtual()){ ESTADO.equip = null; ESTADO.slot = null; }
  if (ESTADO.hosp && !HOSPITAIS.some(h => h.id === ESTADO.hosp)) ESTADO.hosp = null;

  let v = ESTADO.vista;
  if (['equip','cadTransd','transd','teste','vistoria','relatorio'].includes(v) && !ESTADO.equip)
    v = ESTADO.hosp ? 'parque' : 'hospitais';
  if (['parque','cadastro'].includes(v) && !ESTADO.hosp) v = 'hospitais';
  if (['transd','teste'].includes(v) && ESTADO.equip &&
      !equipAtual().transdutores.some(t => t.slot === ESTADO.slot)) v = 'equip';
  ESTADO.vista = v;

  (TELAS[v] || telaHospitais)();

  const bv = el('abVoltar');
  if (bv) bv.addEventListener('click', ()=> ir(bv.dataset.alvo, {rascunho:null}));
  const bt = el('abTema');   if (bt) bt.addEventListener('click', alternarTema);
  const bs = el('abSobre');  if (bs) bs.addEventListener('click', ()=> ir('sobre'));
}


/* ==========================================================================
   Ponte com o cadastro da casca.

   Este coletor nasceu com a lista de instituições e o parque escritos no
   próprio arquivo. Quando a casca tem cadastro, ela manda — as constantes
   são substituídas no lugar (sem reatribuir, que são const) e o parâmetro
   ?cliente= abre direto no parque daquele cliente, que é o ciclo fechado:
   o ícone da modalidade no menu já sabe de quem é o equipamento.

   Sem a casca — o arquivo aberto solto — nada disso roda e o coletor segue
   com os dados de demonstração que sempre teve.
   ========================================================================== */
(function(){
  if (!window.Cadastro) return;

  const clientes = Cadastro.clientes();
  if (clientes.length) {
    HOSPITAIS.length = 0;
    HOSPITAIS.push.apply(HOSPITAIS, clientes);
  }

  /* O cadastro guarda o que é de todas as modalidades no núcleo e o resto em
     `extra`; aqui os dois voltam a ser um objeto só, no formato que este
     coletor espera, com `cliente` renomeado para `hosp`. */
  const equipamentos = Cadastro.equipamentos({modalidade: 96})
    .map(function(e){
      const o = Object.assign({}, e, e.extra || {}, {hosp: e.cliente});
      delete o.extra; delete o.cliente; delete o.modalidade;
      return o;
    });
  if (equipamentos.length) {
    PARQUE.length = 0;
    PARQUE.push.apply(PARQUE, equipamentos);
  }

  /* A casca diz de quem é a visita e, quando vem dos Relatórios, em qual
     equipamento e em qual tela. O que não existir é ignorado: um link velho
     não pode deixar o coletor num estado sem volta. */
  const params = new URLSearchParams(location.search);

  const alvo = params.get('cliente');
  if (alvo && HOSPITAIS.some(function(h){ return h.id === alvo; })) {
    ESTADO.hosp = alvo;
    ESTADO.vista = 'parque';
  }

  const eq = params.get('equip');
  if (eq && PARQUE.some(function(x){ return x.id === eq; })) {
    ESTADO.equip = eq;
    const v = params.get('vista');
    ESTADO.vista = ['equip','transd','teste','vistoria','relatorio'].indexOf(v) >= 0 ? v : 'equip';
  }
})();

/* Depois da ponte: a ponte reconstrói o PARQUE a partir do cadastro da
   casca, e é só então que faz sentido devolver a coleta gravada. */
hidratar();

history.replaceState(instantaneo(), '', '#' + ESTADO.vista);

render();
</script>
<script>
/* Registra o service worker da casca: o coletor aberto direto pelo link
   também passa a funcionar offline, sem depender de visitar o menu antes.

   E oferece a versão nova quando ela chega. Sem isto o worker novo instala,
   fica em espera e nunca entra — o aparelho continua servindo o pacote
   anterior, e nem a demonstração nem o campo percebem. */
(function(){
  if (!('serviceWorker' in navigator)) return;

  const aviso = document.getElementById('aviso');
  let pediuAtualizar = false;

  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        const novo = reg.installing;
        if (!novo) return;
        novo.addEventListener('statechange', function(){
          /* Só avisa se já havia um controlador: na primeira visita o
             "há uma versão nova" seria mentira. */
          if (novo.state === 'installed' && navigator.serviceWorker.controller && aviso)
            aviso.hidden = false;
        });
      });
      /* Quando a página abre com um worker já em espera — o caso de quem
         fechou o app antes de aceitar — o `updatefound` não dispara de novo. */
      if (reg.waiting && navigator.serviceWorker.controller && aviso) aviso.hidden = false;
    }).catch(function(){ /* sem SW o coletor ainda funciona, só não fica offline */ });

    /* Recarrega só quando a troca foi pedida: na primeira visita o
       clients.claim() do worker também dispara controllerchange. */
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!pediuAtualizar) return;
      pediuAtualizar = false;
      location.reload();
    });
  });

  const bt = document.getElementById('btAtualizar');
  if (bt) bt.addEventListener('click', function(){
    if (aviso) aviso.hidden = true;
    pediuAtualizar = true;
    navigator.serviceWorker.getRegistration().then(function(reg){
      if (reg && reg.waiting) reg.waiting.postMessage('SW_ATUALIZAR');
      else location.reload();
    });
  });
})();
</script>
