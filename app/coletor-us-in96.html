<style>
/* ==========================================================================
   Coletor de campo para controle de qualidade em ultrassom diagnóstico
   (IN nº 96/2021 · RDC 611/2022).

   Arquivo único, sem dependência de rede: fontes do sistema, gráficos em
   SVG, estado em memória. Mesmo sistema visual e mesma hierarquia de
   navegação — instituição, equipamento, ensaio — do coletor de radiografia
   convencional (IN nº 90/2021).
   ========================================================================== */

/* --- tokens: claro no :root, escuro nos dois guardas --------------------- */
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --hover:#EFF2F4;
  --border:rgba(13,25,30,.09); --border-2:rgba(13,25,30,.16);
  --text:#0F1618; --muted:#5F6E6A; --faint:#8B9793;
  --accent:#2E63C8; --accent-soft:rgba(46,99,200,.10);
  --ok:#2E9166; --warn:#B07714; --bad:#C2413F; --info:#2E63C8; --neutro:#647069;
  --ok-soft:rgba(46,145,102,.10); --warn-soft:rgba(176,119,20,.10);
  --bad-soft:rgba(194,65,63,.10); --info-soft:rgba(46,99,200,.10);
  --neutro-soft:rgba(100,112,105,.10);
  --grid:rgba(13,25,30,.07);
  --sombra:0 1px 2px rgba(13,25,30,.06);
  --sobre-accent:#FFFFFF;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* No Android nenhuma das fontes nomeadas existe e sobra o monospace do
     sistema (Roboto Mono), que não tem ≤ ≥ ± − — daí os quadradinhos. As
     famílias abaixo cobrem iOS, Android e desktop, e símbolo nenhum é
     renderizado em mono: eles ficam na pilha sans, que tem todos. */
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,"Roboto Mono",
         "Droid Sans Mono","Liberation Mono","Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0E10; --surface:#14181B; --surface-2:#1B2126; --hover:#232A30;
    --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.16);
    --text:#E9EEEC; --muted:#8C9793; --faint:#5E6A66;
    --accent:#6C9CF5; --accent-soft:rgba(108,156,245,.16);
    --ok:#43B581; --warn:#E3A33A; --bad:#E45B5B; --info:#6C9CF5; --neutro:#7C8A85;
    --ok-soft:rgba(67,181,129,.15); --warn-soft:rgba(227,163,58,.15);
    --bad-soft:rgba(228,91,91,.15); --info-soft:rgba(108,156,245,.15);
    --neutro-soft:rgba(124,138,133,.15);
    --grid:rgba(255,255,255,.07);
    --sombra:0 1px 2px rgba(0,0,0,.3);
    --sobre-accent:#08111F;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0E10; --surface:#14181B; --surface-2:#1B2126; --hover:#232A30;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.16);
  --text:#E9EEEC; --muted:#8C9793; --faint:#5E6A66;
  --accent:#6C9CF5; --accent-soft:rgba(108,156,245,.16);
  --ok:#43B581; --warn:#E3A33A; --bad:#E45B5B; --info:#6C9CF5; --neutro:#7C8A85;
  --ok-soft:rgba(67,181,129,.15); --warn-soft:rgba(227,163,58,.15);
  --bad-soft:rgba(228,91,91,.15); --info-soft:rgba(108,156,245,.15);
  --neutro-soft:rgba(124,138,133,.15);
  --grid:rgba(255,255,255,.07);
  --sombra:0 1px 2px rgba(0,0,0,.3);
  --sobre-accent:#08111F;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}

/* ==========================================================================
   Casca do aplicativo — desenhada primeiro para o celular.

   O layout de navegador só entra quando há largura E mouse. Um aparelho de
   toque reporta pointer:coarse, então nunca cai na versão de desktop, mesmo
   que o quadro onde a página é embutida seja largo — que é exatamente o que
   acontece dentro de um visualizador de artefato.
   ========================================================================== */
html,body{overflow-x:clip}
.app{display:flex; flex-direction:column; min-height:100dvh; min-width:0}
#vista{flex:1 1 auto; display:flex; flex-direction:column; padding:0 14px; min-width:0}
/* Num contêiner flex o filho não encolhe abaixo do conteúdo por padrão, e um
   nome de equipamento comprido empurraria a página de lado. */
#vista > *{min-width:0; max-width:100%}
#vista > .acao-fixa{margin-top:auto; max-width:none}

.appbar{
  position:sticky; top:0; z-index:30;
  display:flex; align-items:center; gap:4px;
  padding:calc(env(safe-area-inset-top) + 7px) 8px 8px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
}
.ab-icone{
  width:42px; height:42px; flex:0 0 auto; border-radius:13px; background:none; border:none;
  display:grid; place-items:center; cursor:pointer; transition:background .14s;
}
.ab-icone:active{background:var(--hover)}
.ab-icone:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.ab-icone svg{width:21px; height:21px; stroke:var(--text); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.ab-icone.leve svg{stroke:var(--muted); width:19px; height:19px; stroke-width:1.8}

.ab-tit{flex:1 1 auto; min-width:0; padding:0 4px}
.ab-tit b{
  display:block; font-size:16.5px; font-weight:600; letter-spacing:-.02em; line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ab-tit span{
  display:block; font-size:11.5px; color:var(--muted); line-height:1.4;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.glifo{
  width:34px; height:34px; border-radius:11px; background:var(--accent-soft);
  display:grid; place-items:center; flex:0 0 auto; margin-left:6px;
}
.glifo svg{width:19px; height:19px; stroke:var(--accent); fill:none; stroke-width:1.8; stroke-linecap:round}

.rede{
  display:inline-flex; align-items:center; gap:6px; border-radius:999px; flex:0 0 auto;
  padding:4px 10px; font-size:11px; font-weight:500;
  background:var(--warn-soft); color:var(--warn);
}
.rede::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}

/* Ação principal da tela, ancorada no rodapé como num aplicativo.
   Sticky e não fixed: o quadro que embute a página pode ser redimensionado
   à altura do conteúdo, e aí "fixed" ancoraria no fim do documento em vez
   de na tela. Sticky acerta nos dois casos. */
.acao-fixa{
  position:sticky; bottom:0; z-index:29;
  display:flex; flex-wrap:wrap; gap:8px; margin:20px -14px 0;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
}
.acao-fixa .bt{flex:1 1 0; padding:15px 14px; border-radius:15px}

/* ---------- interruptor do histórico ---------- */
.chave{
  display:flex; align-items:center; gap:13px; background:var(--surface);
  border:1px solid var(--border); border-radius:16px; padding:13px 16px; margin:14px 0 4px;
}
.chave .cnt{flex:1 1 auto; min-width:0}
.chave b{display:block; font-size:13.5px; font-weight:600}
.chave p{margin:2px 0 0; font-size:12px; color:var(--muted); line-height:1.5}
.interruptor{
  flex:0 0 auto; width:52px; height:30px; border-radius:999px; border:1px solid var(--border-2);
  background:var(--surface-2); cursor:pointer; padding:0; position:relative; transition:background .18s, border-color .18s;
}
.interruptor::after{
  content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:var(--faint); transition:transform .18s, background .18s;
}
.interruptor[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.interruptor[aria-pressed="true"]::after{transform:translateX(22px); background:var(--accent)}
.interruptor:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- elementos gerais ---------- */
h1{font-size:21px; font-weight:600; letter-spacing:-.02em; margin:0 0 4px; text-wrap:balance}
h2{font-size:15px; font-weight:600; margin:0 0 2px}
.sub{color:var(--muted); font-size:12.5px}
.rotulo{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:22px 2px 9px}

.card{background:var(--surface); border:1px solid var(--border); border-radius:16px}
.pad{padding:16px 18px}

.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:500; white-space:nowrap}
.chip::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto}
.c-conf{color:var(--ok); background:var(--ok-soft)}
.c-nconf{color:var(--warn); background:var(--warn-soft)}
.c-restr{color:var(--bad); background:var(--bad-soft)}
.c-elb{color:var(--info); background:var(--info-soft)}
.c-na{color:var(--neutro); background:var(--neutro-soft)}
.c-pend{color:var(--neutro); background:var(--neutro-soft)}

/* ---------- marcações manuais do teste ---------- */
.marcas{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 0}
.marca-bt{
  border:1px solid var(--border); background:var(--surface); border-radius:999px;
  padding:9px 16px; font-size:12.5px; color:var(--muted); cursor:pointer;
  transition:background .16s, border-color .16s, color .16s;
}
.marca-bt:hover{background:var(--hover); color:var(--text)}
.marca-bt:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.marca-bt[aria-pressed="true"][data-s="elb"]{
  background:var(--info-soft); border-color:var(--info); color:var(--info); font-weight:600}
.marca-bt[aria-pressed="true"][data-s="na"]{
  background:var(--neutro-soft); border-color:var(--neutro); color:var(--neutro); font-weight:600}

.marca-ativa{
  border:1px solid var(--border); border-left-width:3px; border-radius:13px;
  padding:14px 16px; margin:12px 0 4px; background:var(--surface);
}
.marca-ativa.m-elb{border-left-color:var(--info)}
.marca-ativa.m-na{border-left-color:var(--neutro)}
.marca-ativa b{font-size:13.5px; display:block; margin-bottom:4px}
.marca-ativa p{margin:0 0 12px; font-size:12px; color:var(--muted); line-height:1.6; max-width:66ch}

.nota-marca{font-size:11px; color:var(--info); margin:6px 0 0; font-style:italic}

.bt{
  border-radius:14px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--muted); font-size:14.5px; font-weight:500; cursor:pointer; padding:14px 18px;
  transition:transform .08s, background .14s;
}
.bt:active{transform:scale(.98)}
.bt:hover{background:var(--hover)}
.bt.principal{background:var(--accent); border-color:transparent; color:var(--sobre-accent); font-weight:600}
.bt.principal:hover{filter:brightness(1.08)}
.bt.mini{padding:8px 13px; font-size:12.5px; border-radius:11px}
.bt:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.bt:disabled{opacity:.4; cursor:default}

/* ---------- parque de equipamentos ---------- */
.busca{
  display:flex; align-items:center; gap:10px; background:var(--surface);
  border:1px solid var(--border); border-radius:14px; padding:0 14px; margin-bottom:12px;
}
.busca svg{width:16px; height:16px; stroke:var(--faint); fill:none; stroke-width:1.8; flex:0 0 auto}
.busca input{flex:1 1 auto; background:none; border:none; padding:13px 0; font-size:14.5px; min-width:0}
.busca input:focus{outline:none}
.busca input::placeholder{color:var(--faint)}

/* Listas no estilo de aplicativo: um cartão só, linhas separadas por
   filete, seta de avanço e realce ao toque em vez de ao passar o mouse. */
.lista{
  display:block; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; overflow:hidden;
}
.equip{
  width:100%; text-align:left; background:none; border:none; border-radius:0;
  border-bottom:1px solid var(--border); padding:14px 40px 14px 16px;
  cursor:pointer; display:block; position:relative; transition:background .12s;
}
.equip::after{
  content:""; position:absolute; right:17px; top:50%; width:8px; height:8px;
  border-right:2px solid var(--faint); border-top:2px solid var(--faint);
  transform:translateY(-50%) rotate(45deg);
}
.equip:active{background:var(--hover)}
.equip:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.equip .l1{display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap}
.equip .cod{font-weight:600; font-size:15.5px; letter-spacing:-.01em}
.equip .cli{font-size:12.5px; color:var(--muted); line-height:1.45}
.equip .l3{display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap}
.progresso{flex:1 1 90px; height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden; min-width:60px}
.progresso i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .3s}
.equip .pct{font-size:11.5px; color:var(--faint); flex:0 0 auto}

/* Linha da lista com ação de remover ao lado: o cartão continua sendo o
   botão de avanço, e o × é um botão irmão — botão dentro de botão não
   existe em HTML. */
.equip-linha{display:flex; align-items:stretch; border-bottom:1px solid var(--border)}
.equip-linha > .equip{flex:1 1 auto; min-width:0; border-bottom:none; padding-right:14px}
.equip-linha > .equip::after{display:none}
.apagar-t{
  flex:0 0 auto; width:50px; background:none; border:none; border-left:1px solid var(--border);
  color:var(--faint); font-size:19px; line-height:1; cursor:pointer;
  display:grid; place-items:center; transition:background .12s, color .12s;
}
.apagar-t:hover{color:var(--bad); background:var(--hover)}
.apagar-t:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

.novo{
  width:100%; background:none; border:none; border-top:1px solid var(--border); border-radius:0;
  padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:12px; text-align:left;
  color:var(--muted); transition:background .12s;
}
.lista .novo:first-child{border-top:none}
.novo:active{background:var(--hover)}
.novo:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.novo .mais{
  width:34px; height:34px; border-radius:11px; background:var(--accent-soft); color:var(--accent);
  display:grid; place-items:center; font-size:21px; font-weight:400; line-height:1; flex:0 0 auto;
}
.novo b{display:block; font-size:14.5px; font-weight:600; color:var(--text)}
.novo span{font-size:12px; line-height:1.4}

.vazio-msg{color:var(--faint); font-size:13.5px; padding:22px 16px; text-align:center}

/* ---------- formulário de cadastro ---------- */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(186px,1fr)); gap:12px}
.campo-form{display:flex; flex-direction:column; gap:5px; min-width:0}
.campo-form label{font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--faint)}
.campo-form input, .campo-form select{
  background:var(--surface-2); border:1px solid var(--border); border-radius:11px;
  padding:10px 13px; font-size:14px; width:100%;
}
.campo-form input:focus, .campo-form select:focus{outline:none; border-color:var(--accent); background:var(--surface)}
.campo-form input:invalid{border-color:var(--bad)}
.campo-form .dica{font-size:11px; color:var(--faint)}

/* Campo de texto de uma linha: a justificativa de uma marcação, o nome de uma
   estação de medida. Mesmo desenho dos campos de cadastro. */
input.txt, select.txt{
  width:100%; min-width:0; background:var(--surface-2); border:1px solid var(--border);
  border-radius:11px; padding:10px 13px;
}
input.txt:focus, select.txt:focus{outline:none; border-color:var(--accent); background:var(--surface)}
input.txt::placeholder{color:var(--faint)}

.bloco-transd{
  border:1px solid var(--border); border-radius:14px; padding:13px 15px 15px;
  background:var(--surface-2); margin-bottom:10px;
}
.bloco-transd .cabeca{display:flex; align-items:center; gap:10px; margin-bottom:11px}
.bloco-transd .slot{
  font-family:var(--mono); font-size:12px; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:8px; padding:3px 9px;
}
.bloco-transd .cabeca .nome{font-size:12.5px; color:var(--muted); flex:1 1 auto; min-width:0}
.tirar{
  width:32px; height:32px; border-radius:9px; border:1px solid var(--border); background:var(--surface);
  color:var(--faint); cursor:pointer; display:grid; place-items:center; font-size:17px; line-height:1; flex:0 0 auto;
}
.tirar:hover:not(:disabled){color:var(--bad); border-color:var(--bad)}
.tirar:disabled{opacity:.35; cursor:default}

/* ---------- técnica fixa ---------- */
.tecnica{display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:11px 20px}
.tecnica div span{display:block; font-size:10px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase}
.tecnica div b{font-size:13.5px; font-weight:500}

.resumo{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:9px; margin-bottom:6px}
.res-item{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px}
.res-item .n{font-size:22px; font-weight:600; letter-spacing:-.02em; line-height:1.15}
.res-item .r{font-size:11px; color:var(--muted); margin-top:1px}

.grupo-tit{display:flex; align-items:baseline; gap:9px; margin:20px 2px 8px}
.grupo-tit h2{font-size:13px; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--faint)}
.grupo-tit span{font-size:11.5px; color:var(--faint)}

.teste-lista{
  display:block; background:var(--surface); border:1px solid var(--border);
  border-radius:16px; overflow:hidden;
}
.teste{
  width:100%; text-align:left; background:none; border:none; border-radius:0;
  border-bottom:1px solid var(--border); padding:13px 38px 13px 16px;
  cursor:pointer; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:relative; transition:background .12s;
}
.teste:last-child{border-bottom:none}
.teste::after{
  content:""; position:absolute; right:16px; top:50%; width:7px; height:7px;
  border-right:2px solid var(--faint); border-top:2px solid var(--faint);
  transform:translateY(-50%) rotate(45deg);
}
.teste:active{background:var(--hover)}
.teste:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.teste .corpo{flex:1 1 55%; min-width:0}
.teste .nome{font-size:14.5px; font-weight:500; line-height:1.35}
.teste .meta{font-size:11.5px; color:var(--faint); margin-top:2px}
/* Sem a família mono: este bloco carrega ≤ ± % junto com os números, e a
   pilha sans tem todos os glifos em qualquer sistema. */
/* Duas alturas: situação e nome em cima, valor e tolerância embaixo. Sem a
   família mono, porque este bloco carrega ≤ ± % junto com os números e a
   pilha sans tem todos os glifos em qualquer sistema. */
.teste .valor{
  font-size:13.5px; font-weight:500; flex:1 1 100%; font-variant-numeric:tabular-nums;
  padding-top:8px; margin-top:2px; border-top:1px solid var(--border); line-height:1.45;
}
.teste .valor small{color:var(--faint); font-weight:400; font-size:11.5px; margin-left:8px}

/* ---------- coleta ---------- */
.aquis{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 16px}
.aq{border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:8px 13px; min-width:92px}
.aq span{display:block; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint)}
.aq input{
  background:transparent; border:none; padding:0; width:100%; font-size:14px; font-weight:600;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.aq input:focus{outline:none; color:var(--accent)}
.aq input::placeholder{color:var(--faint); font-weight:400}

.campos-num{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin-bottom:6px}
.campo-num{background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:13px 16px}
.campo-num label{display:block; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); margin-bottom:4px}
.campo-num .linha{display:flex; align-items:baseline; gap:8px}
.campo-num input{
  background:transparent; border:none; padding:0; flex:1 1 auto; min-width:0;
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:30px; font-weight:600; letter-spacing:-.03em;
}
.campo-num input:focus{outline:none; color:var(--accent)}
.campo-num input::placeholder{color:var(--faint); font-weight:500}
.campo-num .un{font-size:14px; color:var(--muted); font-weight:500; flex:0 0 auto}
.campo-num.ctx{background:var(--surface-2)}
.campo-num.ctx input{font-size:20px}

.opcoes{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; margin-bottom:14px}
.opcao{
  border:1px solid var(--border); background:var(--surface-2); border-radius:15px; padding:16px 14px;
  cursor:pointer; text-align:left; font-size:14px; font-weight:500; color:var(--muted); transition:all .16s;
}
.opcao:hover{background:var(--hover)}
.opcao[aria-pressed="true"][data-s="conf"]{background:var(--ok-soft); border-color:var(--ok); color:var(--ok); font-weight:600}
.opcao[aria-pressed="true"][data-s="nconf"]{background:var(--warn-soft); border-color:var(--warn); color:var(--warn); font-weight:600}
.opcao small{display:block; font-size:11px; font-weight:400; color:var(--faint); margin-top:3px; line-height:1.4}

.sn{display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden}
.sn button{background:var(--surface-2); border:none; padding:5px 13px; font-size:12px; cursor:pointer; color:var(--muted)}
.sn button:hover{background:var(--hover)}
.sn button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent); font-weight:600}

/* --- vistoria: um item por linha, com o julgamento à direita ------------
   Em campo se percorre a lista olhando o equipamento, não a tela. Por isso o
   nome do item vem antes e ocupa a linha inteira quando é longo, e o par de
   botões fica sempre no mesmo lugar. */
.vist-lista{display:flex; flex-direction:column; gap:8px}
.vist-item{
  background:var(--surface); border:1px solid var(--border); border-radius:15px;
  padding:13px 14px; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
}
.vist-item.nc{border-color:var(--warn); background:var(--warn-soft)}
.vist-item .nome{flex:1 1 190px; font-size:14px; line-height:1.4}
.vist-item .sn{flex:0 0 auto}
.vist-item textarea.obs{flex:1 1 100%; min-height:52px; margin-top:2px}

textarea.obs{
  width:100%; background:var(--surface); border:1px solid var(--border); border-radius:13px;
  padding:12px 14px; font-size:13.5px; resize:vertical; min-height:66px;
}
textarea.obs:focus{outline:none; border-color:var(--accent)}
table input.cel{
  width:100%; max-width:96px; background:var(--surface-2); border:1px solid var(--border);
  border-radius:9px; padding:5px 9px; font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:13.5px; text-align:right;
}
table input.cel:focus{outline:none; border-color:var(--accent)}

/* ---------- painel de linha de base ---------- */
.base-painel{
  border:1px solid var(--border); border-radius:16px; padding:15px 17px; margin:16px 0 4px;
  background:var(--surface); display:grid; gap:14px; grid-template-columns:minmax(0,1fr) minmax(0,240px);
  align-items:center;
}
.base-painel.sem{grid-template-columns:1fr; border-style:dashed}
.base-painel h3{font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); margin:0 0 9px}
.base-nums{display:flex; gap:22px; flex-wrap:wrap}
.base-nums div span{display:block; font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--faint)}
.base-nums div b{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:19px; font-weight:600; letter-spacing:-.02em}
.base-nota{font-size:12px; color:var(--muted); margin:9px 0 0; line-height:1.55; max-width:60ch}
.spark{width:100%; height:auto; display:block; overflow:visible}
.spark-leg{display:flex; justify-content:space-between; font-size:10px; color:var(--faint); margin-top:3px; font-family:var(--mono)}

.rodape-acoes{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.rodape-acoes .bt{flex:1 1 170px}

/* ---------- relatório ---------- */
.laudo{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 36px; margin-top:4px}
.laudo h1{font-size:19px; margin:0 0 3px}
.laudo .norma{font-size:12.5px; color:var(--muted); margin-bottom:24px}
/* A seção do transdutor tem treze testes e ocupa várias folhas: quem não pode
   partir no meio é o bloco de resultado, não a seção. */
.laudo section{margin-bottom:26px}
/* Título de seção na caixa em que se escreve — "Cadastro", "Resultados:" —
   e não como etiqueta em caixa alta. */
.laudo h3{
  font-size:14.5px; font-weight:700; letter-spacing:-.01em; color:var(--text);
  margin:0 0 11px; padding-bottom:7px; border-bottom:1px solid var(--border-2);
}
.laudo h4{font-size:13.5px; font-weight:600; margin:20px 0 7px}
.laudo h4 .num{color:var(--faint); font-family:var(--mono); font-weight:500; margin-right:7px}

/* Identificação do transdutor: é a chave de leitura dos resultados — quem está
   com o relatório na mão precisa achar de longe onde um transdutor termina e o
   outro começa. Por isso sai maior e em negrito, e não como etiqueta de seção. */
.laudo h3.sec-tit{
  display:flex; align-items:baseline; flex-wrap:wrap; gap:0 9px;
  font-size:15px; font-weight:600; letter-spacing:-.01em; text-transform:none;
  color:var(--muted); margin:0 0 14px; padding-bottom:9px;
  border-bottom:2px solid var(--border-2);
}
.laudo h3.sec-tit b{font-size:18px; font-weight:700; color:var(--text)}
.laudo h3.sec-tit .slot{
  font-size:11.5px; font-weight:600; color:var(--accent); background:var(--accent-soft);
  border-radius:7px; padding:2px 8px; letter-spacing:0;
}
.dl{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:11px 22px}
.dl div span{display:block; font-size:10.5px; color:var(--faint); letter-spacing:.04em; text-transform:uppercase}
.dl div b{font-size:13px; font-weight:500}

table{border-collapse:collapse; width:100%; font-size:12.5px}
th,td{padding:8px 10px; text-align:left; vertical-align:middle}
th{font-size:10px; font-weight:600; color:var(--faint); letter-spacing:.05em; text-transform:uppercase; border-bottom:1px solid var(--border-2)}
td{border-bottom:1px solid var(--border)}
td.num,th.num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.tab-scroll{overflow-x:auto; margin:0 -4px}
/* No laudo o cabeçalho da tabela sai na caixa corrente — "Borda
   Nítida", não "BORDA NÍTIDA". A caixa alta fica para as telas de coleta. */
.laudo th{text-transform:none; font-size:11px; letter-spacing:0; color:var(--muted)}
/* Cabeçalho longo quebra em duas linhas, como no relatório impresso. Sem isso a
   tabela não cabe na folha e empurra a última coluna para fora. */
.laudo th.num{white-space:normal}
.aq-linha{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:0 0 7px}

.parecer{border-left:3px solid var(--accent); padding:12px 0 12px 16px; margin-top:6px}
.parecer b{display:block; font-size:14px; margin-bottom:4px}
.parecer p{margin:0; font-size:13px; color:var(--muted); line-height:1.6}
.parecer.conf{border-color:var(--ok)}
.parecer.nconf{border-color:var(--warn)}

.nc{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border)}
.nc:last-child{border-bottom:none}
.nc .cnt b{font-size:13px; font-weight:500; display:block}
.nc .cnt p{margin:3px 0 0; font-size:12px; color:var(--muted); line-height:1.5}

.assinaturas{display:grid; grid-template-columns:1fr 1fr; gap:34px; margin-top:36px}
.assin{border-top:1px solid var(--border-2); padding-top:8px; font-size:11.5px; color:var(--muted)}
.assin b{display:block; font-size:13px; color:var(--text); font-weight:500}

.aviso-demo{
  display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--warn);
  background:var(--warn-soft); border-radius:999px; padding:4px 12px; margin-bottom:14px;
}
.aviso-demo::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}

/* ---------- capa e aparato normativo do relatório ---------- */
.capa{text-align:center; padding:26px 20px 30px; border-bottom:1px solid var(--border); margin-bottom:26px}
.capa .logo{height:44px; margin:0 auto 28px; display:grid; place-items:center}
.capa .logo svg{height:34px; width:auto; stroke:var(--accent); fill:none; stroke-width:1.7;
                stroke-linecap:round; stroke-linejoin:round}
.capa-num{font-family:var(--mono); font-size:13px; color:var(--muted)}
.capa-cat{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-top:4px; font-weight:600}
.capa h1{font-size:23px; margin:20px 0 0; letter-spacing:-.02em}
.capa-eq{font-size:15.5px; font-weight:600; margin-top:20px; line-height:1.5}
.capa-eq span{display:block; font-family:var(--mono); font-size:12px; font-weight:400; color:var(--muted)}
.capa-cli{font-size:14px; color:var(--muted); margin-top:14px}
.capa-ano{font-size:26px; font-weight:600; color:var(--faint); margin:20px 0 26px; letter-spacing:.04em}
.capa-rod{font-size:10.5px; color:var(--muted); line-height:1.75; border-top:1px solid var(--border); padding-top:16px; max-width:56ch; margin:0 auto}
.capa-rod b{color:var(--text); font-weight:600}

.cabeca-doc{display:flex; align-items:center; gap:14px; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:20px}
.cabeca-doc .marca{flex:0 0 auto; display:grid; place-items:center}
.cabeca-doc .marca svg{height:17px; width:auto; stroke:var(--accent); fill:none; stroke-width:1.9;
                       stroke-linecap:round; stroke-linejoin:round}
.cabeca-doc .l{flex:1 1 auto; min-width:0; font-size:10.5px; color:var(--muted); line-height:1.5}
.cabeca-doc .l b{color:var(--text); font-size:12px; display:block; font-weight:600}

/* Centralizada na coluna de texto, como no relatório impresso. */
.tol-box{border:1px solid var(--border-2); border-radius:9px; overflow:hidden; margin:11px auto 2px; max-width:60ch}
.tol-box .cab{
  background:var(--surface-2); padding:5px 12px; font-size:9.5px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; text-align:center;
  border-bottom:1px solid var(--border-2); color:var(--text);
}
.tol-box .val{padding:9px 14px; font-size:12px; text-align:center; line-height:1.6; color:var(--muted)}

.teste-desc{margin:18px 0 0; break-inside:avoid}
.teste-desc h5{font-size:13.5px; font-weight:600; margin:0 0 5px; display:flex; gap:8px}
.teste-desc h5::before{content:"•"; color:var(--accent)}
.teste-desc p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.7; text-align:justify}
.teste-desc p + p{margin-top:9px}

.laudo ul{margin:0; padding-left:20px; font-size:12.5px; color:var(--muted); line-height:1.7}
.laudo ul li{margin-bottom:4px}
.defin{font-size:12.5px; color:var(--muted); line-height:1.7}
.defin b{color:var(--text)}
.defin p{margin:0 0 11px; text-align:justify}

.nota-icp{
  font-size:9.5px; color:var(--faint); line-height:1.65; margin-top:26px;
  padding-top:12px; border-top:1px solid var(--border); text-align:justify;
}

.comparativo{width:100%; font-size:13px}
.comparativo th:first-child{width:30%}
.comparativo td{vertical-align:top; line-height:1.5}
.prosa{max-width:68ch; font-size:13.5px; color:var(--muted); line-height:1.65}
.prosa strong{color:var(--text); font-weight:600}
.prosa p{margin:0 0 12px}

/* No laudo o texto ocupa a mesma largura das tabelas e é justificado, como no
   relatório impresso: medida curta ao lado de tabela larga faz a folha parecer
   torta. Fora do laudo a coluna estreita continua valendo — lá é leitura de
   tela, não documento. */
.laudo .prosa{max-width:none; text-align:justify}

@keyframes sobe{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.anima{animation:sobe .32s cubic-bezier(.22,.61,.36,1) backwards}
@media (prefers-reduced-motion:reduce){.anima{animation:none} *{transition:none !important}}

/* ==========================================================================
   Ajustes finos do aparelho de toque
   Tudo acima já é o desenho de celular. Aqui ficam só as correções que
   dependem do meio: o iOS amplia a página sozinho ao focar um campo com
   fonte menor que 16px, e tabela de dados precisa rolar em vez de espremer.
   ========================================================================== */
input, select, textarea,
.busca input, .campo-form input, .campo-form select,
table input.cel, .aq input, textarea.obs, input.txt{font-size:16px}

.tab-scroll{-webkit-overflow-scrolling:touch; margin:0 -14px; padding:0 14px}
.tab-scroll table{min-width:440px}
/* No laudo a tabela alinha com o texto: sem sangria, senão o filete da tabela
   sai mais largo que o resto da folha. */
.laudo .tab-scroll{margin:0; padding:0}

/* Corpo de texto um ponto maior no dedo: o que se lê de pé numa sala de
   exame não é o que se lê sentado na frente de um monitor. */
@media (hover:none) and (pointer:coarse){
  body{font-size:16px}
  .sub{font-size:13px}
  .chip{font-size:12px; padding:4px 11px}
  .rotulo{font-size:11.5px}
  .equip .cod{font-size:16px}
  .equip .cli{font-size:13px}
  .equip .pct{font-size:12px}
  .teste .nome{font-size:15px}
  .teste .meta{font-size:12px}
  .teste .valor{font-size:14px}
  .teste .valor small{font-size:12px}
  .res-item .n{font-size:23px}
  .res-item .r{font-size:11.5px}
  .base-nota, .chave p{font-size:12.5px}
  .novo b{font-size:15px}
  .novo span{font-size:12.5px}
  .prosa{font-size:14px}
  .laudo{font-size:14px}
  .laudo .dl div b{font-size:13.5px}
  .teste-desc p, .defin, .laudo ul{font-size:13px}
  th,td{font-size:13px}
  .tol-box .val{font-size:12.5px}
}

/* Telas muito estreitas */
@media (max-width:390px){
  #vista{padding:0 11px}
  .tab-scroll{margin:0 -11px; padding:0 11px}
  .laudo{padding:16px 12px}
  .aq{flex:1 1 100%}
  .base-nums{gap:12px}
  .base-nums div b{font-size:17px}
  .ab-tit b{font-size:15.5px}
}

/* ==========================================================================
   Navegador de mesa
   Só entra com largura E mouse. Um celular reporta pointer:coarse e
   hover:none, então continua no desenho de aplicativo mesmo que o quadro
   onde a página está embutida seja largo.
   ========================================================================== */
@media (min-width:820px) and (hover:hover) and (pointer:fine){
  .app{max-width:980px; margin:0 auto; padding:0 0 56px; min-height:0}
  #vista{padding:0 16px}

  .appbar{padding:12px 10px 10px; gap:6px}
  .ab-tit b{font-size:15px}

  /* Sem barra ancorada no rodapé: as ações voltam para o fim do conteúdo. */
  .acao-fixa{
    position:static; padding:0; margin:22px 0 0; border-top:none;
    background:none; backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .acao-fixa .bt{flex:1 1 170px}

  input, select, textarea,
  .busca input, .campo-form input, .campo-form select,
  .aq input, textarea.obs, input.txt{font-size:14px}
  table input.cel{font-size:13.5px; padding:5px 9px}
  .campo-form input, .campo-form select{padding:10px 13px}
  .sn button{padding:5px 13px; font-size:12px}

  /* Cartões soltos, realce ao passar o mouse, sem seta de avanço. */
  .lista{background:none; border:none; border-radius:0; display:flex; flex-direction:column; gap:10px}
  .equip{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:15px 17px;
  }
  .equip::after{display:none}
  .equip:hover{background:var(--hover); border-color:var(--border-2)}
  .equip .pct{min-width:96px; text-align:right}

  /* Cartão solto e o × como controle separado ao lado. */
  .equip-linha{border-bottom:none; gap:8px}
  .equip-linha > .equip{padding-right:17px}
  .apagar-t{
    width:52px; border:1px solid var(--border); border-radius:16px; background:var(--surface);
  }
  .apagar-t:hover{border-color:var(--bad)}

  .novo{
    background:var(--surface-2); border:1px dashed var(--border-2); border-radius:16px;
    padding:16px 17px;
  }
  .novo:hover{background:var(--hover); border-color:var(--accent); color:var(--text)}

  .teste-lista{background:none; border:none; border-radius:0; display:flex; flex-direction:column; gap:6px}
  .teste{
    background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:12px 15px; flex-wrap:nowrap;
  }
  .teste::after{display:none}
  .teste:hover{background:var(--hover); border-color:var(--border-2)}
  .teste .corpo{flex:1 1 auto}
  .teste .valor{
    flex:0 1 auto; max-width:46%; text-align:right; white-space:nowrap;
    padding-top:0; margin-top:0; border-top:none; overflow:hidden; text-overflow:ellipsis;
  }
  .teste .valor small{display:block; margin-left:0; font-size:10.5px}

  .tab-scroll{margin:0 -4px; padding:0}
  .tab-scroll table{min-width:0}
  .laudo{padding:32px 36px}
  .laudo .tab-scroll{margin:0; padding:0}

  .base-painel{grid-template-columns:minmax(0,1fr) minmax(0,240px)}
  .assinaturas{grid-template-columns:1fr 1fr}
  .capa{padding:26px 20px 30px}
  .capa .logo{height:44px; margin-bottom:28px}
  .capa h1{font-size:23px}
  .capa-ano{font-size:26px}
  .marca-bt{flex:0 1 auto}
  .campos-num{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .opcoes{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .teste-desc p, .defin p{text-align:justify}
}

/* Impressão: o relatório vai para papel, então a paleta clara é forçada
   independentemente do tema em que a tela estava. */
@media print{
  @page{size:A4; margin:14mm 13mm}
  /* O guarda do tema escuro é `:root:not([data-theme="light"])`, mais
     específico que `:root`: sem repeti-lo aqui, um aparelho com o sistema em
     modo escuro imprimiria o laudo com fundo escuro. */
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
    --bg:#fff; --surface:#fff; --surface-2:#fff; --hover:#fff;
    --border:#d8dedd; --border-2:#a8b2b0;
    --text:#111; --muted:#4a5350; --faint:#6d7674;
    --accent:#1e4fa8; --ok:#1c6b45; --warn:#8a5a06; --bad:#9c2b2a; --info:#1e4fa8; --neutro:#4a5350;
    --ok-soft:#eaf5ef; --warn-soft:#fbf3e3; --bad-soft:#fbecec; --info-soft:#eaf0fb; --neutro-soft:#f0f2f2;
    --accent-soft:#eaf0fb;
    --sombra:none;
  }
  body{background:#fff; color:#111; font-size:10.5pt}
  .appbar,.acao-fixa,.rodape-acoes,.aviso-demo,.chave{display:none !important}
  .app{padding:0}
  #vista{padding:0}
  .laudo{border:none; padding:0; margin:0}
  .anima{animation:none}

  /* Nada de rolagem no papel: uma caixa com overflow não se parte entre folhas
     e o que passa da altura da página seria cortado. Na folha a tabela cabe,
     então ela volta a ser um bloco comum. */
  .tab-scroll{overflow:visible; margin:0; padding:0}
  .tab-scroll table{min-width:0}
  /* Tabela longa repete o cabeçalho na folha seguinte e não parte linha. */
  thead{display:table-header-group}
  tr{break-inside:avoid}
  /* O que precisa sair inteiro é a unidade de leitura, não a seção — a seção
     de um transdutor tem treze testes e ocupa várias folhas. */

  .capa-rod{margin-top:auto}

  .laudo section.bloco{break-before:page}
}

<script>
"use strict";

/* ==========================================================================
   1. Definição dos testes
   Estrutura derivada de mapa_extracao.json — os mesmos treze testes, os
   mesmos índices de tabela, a mesma marcação de quais dependem de linha de
   base. Trocar o mapa troca o formulário: nada aqui é escrito à mão por
   teste.
   ========================================================================== */

const GRUPOS = [
  {id:'imagem',    nome:'Modo B — imagem'},
  {id:'geometria', nome:'Modo B — geometria'},
  {id:'alvos',     nome:'Modo B — alvos do simulador'},
  {id:'doppler',   nome:'Doppler'}
];

/* Frequência do transdutor. Quando não informada, aplica-se o limite mais
   restritivo da faixa — nunca aprova o que a norma reprovaria. */
const fq = tr => (typeof tr.fmax === 'number' && tr.fmax > 0) ? tr.fmax : null;
const semFq = ' · frequência não informada, limite mais restritivo';
/* Limite de norma: 1,5 e não 1,50 — é um número redondo, não uma medida. */
const numTol = v => String(v).replace('.', ',');

/* Avaliadores e limites de critério fixo, conforme a IN nº 96/2021. */
const CRIT = {
  distancia: (v, tol) => {
    const d = Math.abs(v.medida - v.nominal);
    return (d <= tol || d <= (tol/100)*v.nominal) ? 'conf' : 'nconf';
  },
  zonaMorta: f => f === null ? 3   : (f <= 3  ? 7 : (f < 7 ? 5 : 3)),
  axial:     f => f === null ? 1   : (f > 4   ? 1 : 2),
  lateral:   f => f === null ? 1.5 : (f < 3.5 ? 4 : (f < 5 ? 3 : 1.5))
};

/* A tolerância mostrada na tela é a que de fato foi aplicada àquele
   transdutor; a caixa "Tolerância IN - 96" do relatório é o texto da norma. */
const tolDe = (t, tr) => typeof t.tol === 'function' ? t.tol(tr) : t.tol;

const TESTES = [
  {
    id:'uniformidade', num:'1', grupo:'imagem', base:false,
    nome:'Uniformidade da imagem',
    desc:`Este teste avalia a presença de artefatos na imagem. Qualitativamente,
      espera-se que a imagem não apresente artefatos que comprometam significativamente
      a visualização de estruturas de baixo e alto contraste em todo o campo de visão.`,
    tolIN:'Sem artefato que comprometa a visualização',
    tol:'Sem artefato que comprometa a visualização',
    tipo:'qualit',
    opcoes:[['Sem artefato','conf'],['Com artefato','nconf']]
  },
  {
    id:'uniformidade_quant', num:'2', grupo:'imagem', base:false, soT1:true, semAq:true,
    nome:'Uniformidade da imagem — análise quantitativa',
    desc:`Quantitativamente, é analisado o perfil dos níveis de cinza ao longo da extensão
      do campo de visão do transdutor. As quedas de sinal são avaliadas em relação ao valor
      de referência, correspondente à mediana dos valores de pixel desse perfil. Os valores
      de pixel são convertidos em intensidade do sinal (dB). A tolerância para a queda de
      sinal, expressa em dB, é apresentada a seguir.`,
    tolIN:'< 4db do valor de referência',
    tol:'< 4 dB do valor de referência',
    tipo:'tabela', dinamica:true, indice:'Queda', linhas:['1ª','2ª'],
    aval:v => v.prof < 4 ? 'conf' : 'nconf',
    cols:[{k:'prof',    r:'Profundidade da queda', un:'dB'},
          {k:'largura', r:'Largura da queda',      un:'%'}]
  },
  {
    id:'zona_morta', num:'3', grupo:'geometria', base:false,
    nome:'Zona morta',
    desc:`Esse teste permite determinar a distância mínima entre o transdutor e o primeiro
      eco identificável no objeto simulador. Sua tolerância é apresentada abaixo. Nela
      observamos a dependência do resultado com a frequência.`,
    tolIN:`≤ 7 mm para frequência ≤ 3 MHz · ≤ 5 mm para 3MHz < frequência < 7 MHz ·
      ≤ 3 mm para frequência ≥ 7 MHz`,
    tol:tr => '≤ ' + numTol(CRIT.zonaMorta(fq(tr))) + ' mm' + (fq(tr) === null ? semFq : ''),
    tipo:'escalar', un:'mm',
    aval:(v,tr) => v.zm <= CRIT.zonaMorta(fq(tr)) ? 'conf' : 'nconf',
    campos:[{k:'zm', r:'Profundidade da Zona Morta', un:'mm'}]
  },
  {
    id:'penetracao', num:'4', grupo:'imagem', base:true,
    nome:'Profundidade de penetração',
    desc:`Esse teste permite determinar a máxima profundidade que um dado tipo de
      transdutor, configurado em uma certa frequência, é capaz de alcançar. A tolerância
      estabelecida para este teste é apresentada abaixo.`,
    tolIN:'Segundo especificações do fabricante. Desvio < 6 mm do valor de referência (linha de base)',
    tol:'Desvio < 6 mm da linha de base',
    tolAbs:0.6,
    tipo:'escalar', metrica:'prof', un:'cm',
    campos:[{k:'prof', r:'Profundidade medida', un:'cm'}]
  },
  {
    id:'zona_focal', num:'5', grupo:'imagem', base:true,
    nome:'Zona focal',
    desc:`Esse teste permite avaliar se a região onde está o ponto focal é realmente a região
      que fornece a melhor informação na imagem. É observado se a estrutura avaliada estará
      com a intensidade e nitidez maiores nesse ponto. A tolerância para esse teste é segundo
      especificações do fabricante.`,
    tolIN:'Segundo especificações do fabricante',
    tol:'Segundo o fabricante · ±15 % da linha de base', tolBase:0.15,
    tipo:'escalar', metrica:'medida', un:'cm',
    deriv:v=>({r:'Diferença medida', v:v.medida-v.nominal, un:'cm'}),
    campos:[{k:'nominal', r:'Profundidade nominal do foco', un:'cm', ctx:true},
            {k:'medida',  r:'Profundidade medida do foco',  un:'cm'}]
  },
  {
    id:'exatidao_vertical', num:'6', grupo:'geometria', base:false,
    nome:'Exatidão da medida da distância vertical',
    desc:`Esse teste tem por objetivo verificar se a distância medida, feita com a
      ferramenta de medir do equipamento de ultrassom, entre estruturas verticais do
      simulador, está próxima do valor nominal. A tolerância para esse teste é apresentada
      abaixo.`,
    tolIN:'≤ ± 1,5 mm ou ± 1,5 % do valor nominal (valor real)',
    tol:'≤ ±1,5 mm ou ±1,5 % do nominal',
    tipo:'escalar', un:'mm', aval:v => CRIT.distancia(v, 1.5),
    deriv:v=>({r:'Diferença', v:v.medida-v.nominal, un:'mm'}),
    campos:[{k:'nominal', r:'Distância nominal', un:'mm', ctx:true},
            {k:'medida',  r:'Distância medida',  un:'mm'}]
  },
  {
    id:'exatidao_horizontal', num:'7', grupo:'geometria', base:false,
    nome:'Exatidão da medida da distância horizontal',
    desc:`Esse teste tem por objetivo verificar se a distância medida, feita com a
      ferramenta de medir do equipamento de ultrassom, entre estruturas horizontais do
      simulador, está próxima do valor nominal. A tolerância para esse teste é apresentada
      abaixo.`,
    tolIN:'≤ ± 2,0 mm ou ± 2,0 % do valor nominal (valor real)',
    tol:'≤ ±2,0 mm ou ±2,0 % do nominal',
    tipo:'escalar', un:'mm', aval:v => CRIT.distancia(v, 2.0),
    deriv:v=>({r:'Diferença', v:v.medida-v.nominal, un:'mm'}),
    campos:[{k:'nominal', r:'Distância nominal', un:'mm', ctx:true},
            {k:'medida',  r:'Distância medida',  un:'mm'}]
  },
  {
    id:'resolucao', num:'8', grupo:'geometria', base:false,
    nome:'Resolução axial e lateral',
    desc:`Resolução axial — Esse teste permite avaliar a capacidade do sistema resolver
      (enxergar separadamente) estruturas que estão no mesmo sentido de propagação do feixe
      de ultrassom. O nosso objeto simulador oferece a possibilidade de realizar esse teste
      em diferentes profundidades (1, 3,5 e 6 cm). A capacidade de avaliar a resolução em
      todas elas depende da profundidade de penetração máxima que o feixe é capaz de
      alcançar. Por isso, quando o alcance for pequeno, o resultado apresentado será “alvos
      não podem ser visualizados nessa profundidade”. A tolerância para esse teste é
      apresentada abaixo.

      Resolução lateral — Esse teste permite avaliar a capacidade do sistema resolver
      (enxergar separadamente) estruturas que estão perpendiculares ao sentido de propagação
      do feixe de ultrassom. O nosso objeto simulador oferece a possibilidade de realizar
      esse teste em diferentes profundidades (1,3,5 e 6 cm). A capacidade de avaliar a
      resolução em todas elas depende da profundidade de penetração máxima que o feixe é
      capaz de alcançar. Por isso, quando o alcance for pequeno, o resultado apresentado
      será “alvos não podem ser visualizados nessa profundidade”. A tolerância para esse
      teste é apresentada abaixo.`,
    tolIN:`Axial: ≤ 2 mm para transdutores com frequência ≤ 4 MHz · ≤ 1 mm para transdutores
      com frequências > 4 MHz. Lateral: ≤ 4 mm para transdutores com frequência < 3,5 MHz ·
      <3 mm para transdutores com frequências ≥ 3,5 MHz e < 5 MHz · < 1,5 mm para
      transdutores com frequências ≥ 5 MHz`,
    tol:tr => 'axial ≤ ' + numTol(CRIT.axial(fq(tr))) + ' mm · lateral ≤ ' +
              numTol(CRIT.lateral(fq(tr))) + ' mm' + (fq(tr) === null ? semFq : ''),
    tipo:'escalar', un:'mm',
    aval:(v,tr) => (v.axial <= CRIT.axial(fq(tr)) && v.lateral <= CRIT.lateral(fq(tr)))
                   ? 'conf' : 'nconf',
    campos:[{k:'axial',   r:'Resolução axial',   un:'mm'},
            {k:'lateral', r:'Resolução lateral', un:'mm'}]
  },
  {
    id:'objetos_anecoicos', num:'9', grupo:'alvos', base:true,
    nome:'Visualização de objetos anecoicos',
    desc:`Esse teste permite avaliar a capacidade de um sistema de imagem de detectar e
      exibir o tamanho, forma e a profundidade de uma estrutura anecoica dentro do phantom.
      Permite avaliar também a capacidade de detectar e exibir a forma e características
      ecogênicas de uma estrutura. O phantom apresenta objetos anecoicos de diferentes
      diâmetros (1, 2 e 4 mm).

      De acordo com o manual do phantom, os alvos devem parecer circulares e com bordas bem
      nítidas, indicando uma transição da região ecogênica para a região anecoica. Além
      disso os alvos devem estar livres de quaisquer ecos internos. Com o passar do tempo,
      sob as mesmas condições de aquisição, é esperado que os resultados sejam semelhantes.
      A tolerância exigida é apresentada abaixo.`,
    tolIN:'Segundo especificações do fabricante do equipamento e do simulador',
    tol:'Não perder objetos em relação à linha de base', tolBase:'exato',
    tipo:'tabela', metrica:'qtd', indice:'Diâmetro (mm)', linhas:[2,3,4,6,8],
    cols:[{k:'qtd', r:'Quantidade de objetos visualizados', un:''}]
  },
  {
    id:'distorcao', num:'10', grupo:'alvos', base:true,
    nome:'Distorção de objeto anecoico',
    desc:`Complementa a visualização de objetos anecoicos medindo altura e largura de um
      alvo de diâmetro conhecido. A razão entre as duas revela distorção geométrica do
      campo, e é esperado que se mantenha estável entre visitas sob a mesma técnica.`,
    tolIN:'Segundo especificações do fabricante do equipamento e do simulador',
    tol:'±10 % da linha de base', tolBase:0.10,
    tipo:'tabela', metrica:'razao', indice:'Diâmetro (mm)', linhas:[8],
    cols:[{k:'alt',   r:'Altura',  un:'cm'},
          {k:'larg',  r:'Largura', un:'cm'},
          {k:'razao', r:'Razão',   un:''}]
  },
  {
    id:'limiar', num:'11', grupo:'alvos', base:true,
    nome:'Limiar de sensibilidade abaixo contraste',
    desc:`Esse teste avalia um grupo de alvos que variam em ecogenicidade em relação ao
      fundo. É esperado que os alvos apareçam circulares, com bordas nítidas e com variação
      de contraste. A tolerância para esse teste é apresentada abaixo.`,
    tolIN:'Segundo especificações do fabricante do equipamento e do simulador',
    tol:'Manter o que era visto nas visitas anteriores',
    tipo:'booleana', indice:'Alvo', linhas:[1,2,3,4,5,6],
    cols:[{k:'contraste', r:'Apresenta contraste'},
          {k:'borda',     r:'Borda Nítida'},
          {k:'circular',  r:'Alvo Circular'}]
  },
  {
    id:'doppler_velocidade', num:'12', grupo:'doppler', base:true, semAq:true,
    nome:'Acurácia da velocidade do fluxo',
    desc:`Medida da velocidade do fluxo em uma profundidade fixa, sendo igual a 7 cm para
      transdutores setoriais e convexos e 4 cm para transdutores lineares e
      endocavitários.`,
    tolIN:'Segundo especificações do fabricante do equipamento e do simulador',
    tol:'Variação ≤ ±10 % do nominal',
    tipo:'tabela', metrica:'varia', indice:'Fluxo (ml/s)', linhas:['4,0','10,0'],
    aval:v => Math.abs(v.varia) <= 10 ? 'conf' : 'nconf',
    cols:[{k:'nominal', r:'Velocidade nominal',  un:'cm/s', ctx:true},
          {k:'medida',  r:'Velocidade medida',   un:'cm/s'},
          {k:'varia',   r:'Variação percentual', un:'%'}]
  },
  {
    id:'doppler_sensibilidade', num:'13', grupo:'doppler', base:true, semAq:true,
    nome:'Sensibilidade do sinal doppler',
    desc:`Este teste determina a profundidade na qual o sinal Doppler útil é detectado.
      Para tanto mede-se o alcance máximo no qual o sinal Doppler é detectado no vaso
      inclinado, a partir da região mais próxima do transdutor, através do sinal Doppler
      audível e do espectro do sinal Doppler visualizado na tela. Pode ser realizado com
      fluxo contínuo ou pulsado.`,
    tolIN:'Segundo especificações do fabricante do equipamento e do simulador',
    tol:'±15 % da linha de base', tolBase:0.15,
    tipo:'tabela', metrica:'color', indice:'Fluxo (ml/s)', linhas:['4,0','10,0'],
    cols:[{k:'color',     r:'Modo colorido - Fluxo contínuo', un:'cm'},
          {k:'espectral', r:'Modo espectral - Fluxo pulsado', un:'cm'}]
  }
];

const POR_ID = Object.fromEntries(TESTES.map(t=>[t.id,t]));
const testesDe = slot => TESTES.filter(t => !t.soT1 || slot === 'T1');
const linhasDe = (t, reg) =>
  (t.dinamica && reg && reg.linhas) ? Object.keys(reg.linhas) : t.linhas;

/* ==========================================================================
   2. Parque de equipamentos
   Dois equipamentos com identificação, técnica e medidas de demonstração;
   e um terceiro cadastrado e ainda sem visita.
   Em produção isto vem do banco — aqui está embutido para a demonstração
   rodar sem rede.
   ========================================================================== */

const TIPOS_TRANSD = ['Linear', 'Convexo', 'Setorial', 'Endocavitário', 'Volumétrico'];

/* Espaço reservado ao logotipo de quem emite o relatório. Enquanto não há
   identidade visual carregada, sai a marca d'água neutra abaixo; para usar um
   logotipo próprio basta trocar este SVG por <img src="..."> na capa e no
   cabeçalho de folha. Nada aqui identifica empresa alguma. */
const MARCA = '<svg viewBox="0 0 64 24" aria-hidden="true">' +
  '<path d="M2 12h6l3-8 5 16 4-12 3 4h5"/>' +
  '<circle cx="46" cy="12" r="2.4"/><path d="M53 6.5a8 8 0 0 1 0 11"/>' +
  '<path d="M57.5 3a13 13 0 0 1 0 18"/></svg>';

/* Vistoria do equipamento — o que se confere na sala antes de medir.

   Não é teste do Anexo I: não tem tolerância, instrumento nem incerteza. E não
   é vistoria de radioproteção como nos coletores de raios X — ultrassom não
   emite radiação ionizante, então não há sinalização luminosa, vestimenta
   plumbífera nem dosimetria individual a conferir. O que entra aqui é o estado
   do console, do monitor e dos transdutores, a biossegurança e a documentação.

   Agrupada na ordem em que se percorre o equipamento: da tomada ao monitor,
   do monitor aos transdutores, e por fim a pasta de documentos. */
const VISTORIA = [
  {grupo:'Console e alimentação', itens:[
    'Cabo de alimentação (rachaduras, plugues, descoloração)',
    'Aterramento do equipamento verificado',
    'Console do digitalizador (livre de danos)',
    'Filtros de poeira (limpos e desobstruídos)',
    'Controles (botões e interruptores limpos, sem quebra)'
  ]},
  {grupo:'Monitor e ajustes', itens:[
    'Tela (limpa, livre de arranhões, controles de brilho e contraste)',
    'TGC (ajuste do ganho com a profundidade funcionando)',
    'Brilho e contraste no padrão de trabalho do serviço'
  ]},
  {grupo:'Transdutores e biossegurança', itens:[
    'Cabos e conectores dos transdutores sem dano',
    'Lentes acústicas sem trinca, bolha ou delaminação',
    'Protocolo de desinfecção dos transdutores disponível e em uso',
    'Gel acústico dentro da validade e em recipiente próprio'
  ]},
  {grupo:'Documentação', itens:[
    'Manual do fabricante disponível no serviço',
    'Registro dos testes de aceitação e da linha de base',
    'Registro de treinamento da equipe no equipamento'
  ]}
];

/* A lista achatada é a que grava e a que o relatório percorre: a chave de cada
   item é o próprio texto, então mexer na redação de um item existente desliga a
   vistoria já gravada dele. */
const INSPECAO_EQUIP = VISTORIA.reduce((a, g) => a.concat(g.itens), []);
const INSPECAO_TRANSD = ['Transdutor', 'Interferência'];

/* A instituição — hospital, clínica ou unidade de pronto atendimento — é o
   primeiro nível de navegação e o primeiro nível da chave de linha de base,
   por isso é uma entidade própria e não um texto repetido em cada
   equipamento. Mesma hierarquia do coletor de raios X. */
/* Acervo de demonstração. Os nomes são deliberadamente genéricos: instituição
   inventada com cara de real acaba coincidindo com uma que existe, e nome de
   responsável técnico vem com número de registro profissional junto — que é
   de alguém. Marca e modelo de equipamento são de catálogo público e ficam
   como estão, porque é o que dá verossimilhança à demonstração. */
const HOSPITAIS = [
  {id:'hospex', nome:'Hospital Santa Aurora', cnpj:'11.222.333/0001-81',
   endereco:'Av. das Palmeiras, 1450 · Jardim América',
   cidade:'Ribeirão Preto/SP', cep:'14020-160', telefone:'(16) 3512-4800',
   rt:'Dra. Helena Duarte — CRM/SP 112.458',
   alvara:'Alvará sanitário 3549/2025-118'},

  {id:'clinex', nome:'Clínica Imagem Vale do Sol', cnpj:'11.444.777/0001-61',
   endereco:'Rua Barão de Jaguara, 820 · Centro',
   cidade:'Campinas/SP', cep:'13015-002', telefone:'(19) 3234-7710',
   rt:'Dr. Ricardo Albuquerque — CRM/SP 98.731',
   alvara:'Alvará sanitário 3509/2025-044'},

  {id:'upaex', nome:'UPA 24h Jardim Primavera', cnpj:'22.333.444/0001-81',
   endereco:'Rua Ipê Amarelo, 75 · Jardim Primavera',
   cidade:'Sorocaba/SP', cep:'18052-300', telefone:'(15) 3228-9100',
   rt:'Dra. Camila Nogueira — CRM/SP 134.902',
   alvara:'Alvará sanitário 3552/2026-009'}
];

const hospPorId = id => HOSPITAIS.find(h => h.id === id) ||
  {id:'', nome:'—', endereco:'', cidade:'', cep:'', telefone:'', rt:'', alvara:'', cnpj:''};
const hospDe = eq => hospPorId(eq.hosp);
const equipDe = hospId => PARQUE.filter(e => e.hosp === hospId);

/* O cadastro do parque vem preenchido — instituição, equipamento,
   transdutor e técnica são dados de acervo, não de coleta. As MEDIDAS
   começam vazias: cada visita entra em branco, com os cabeçalhos dos treze
   testes prontos e os campos esperando digitação. O botão de demonstração
   despeja o acervo real de medidas por cima. */
const PARQUE = [
  {
    id:'US-0614', relatorio:'2026/0471', periodicidade:'Anual',

/* Converte a string compacta de aquisição em campos editáveis. */
function parseAq(s){
  const o = {Gn:'', Fc:'', Fr:'', Pr:''};
  (s || '').split(' · ').forEach(p=>{
    const [k, ...v] = p.split(' ');
    if (k in o) o[k] = v.join(' ');
  });
  return o;
}
/* Despeja o acervo de medidas num equipamento — e o inverso, que devolve a
   visita ao estado em branco. O cadastro (hospital, equipamento, transdutor,
   técnica) não é tocado por nenhum dos dois. */
const temDemo = eq => !!DEMO_MEDIDAS[eq.id];

/* Abrir a tela de um teste cria o registro vazio que os campos precisam para
   escrever. Isso não é medida: só conta como coletado o registro que tem
   algum valor de fato — senão navegar pelo roteiro faria a visita parecer
   iniciada. */
function regPreenchido(reg){
  for (const k of Object.keys(reg)){
    if (k === 'acq') continue;
    const v = reg[k];
    if (k === 'linhas'){
      for (const l of Object.keys(v))
        for (const c of Object.keys(v[l])) if (!nada(v[l][c])) return true;
    } else if (!nada(v)) return true;
  }
  return false;
}
const temMedidasTransd = (eq, slot) => !!(eq.medidas && eq.medidas[slot]) &&
  Object.keys(eq.medidas[slot]).some(tid => regPreenchido(eq.medidas[slot][tid]));
const temMedidas = eq => Object.keys(eq.medidas).some(slot => temMedidasTransd(eq, slot));
/* Transdutores desta visita que ainda não têm nenhuma medida — os que entram
   depois de a demonstração já ter sido gerada caem aqui. */
const transdVazios = eq => eq.transdutores.filter(tr => !temMedidasTransd(eq, tr.slot));

/* --- medidas geradas para transdutor fora do acervo ----------------------
   Um transdutor cadastrado agora não tem relatório de onde copiar. Em vez de
   ficar de fora da demonstração, recebe medidas coerentes com a sua própria
   frequência: os testes de critério fixo saem dentro da tolerância que a IN
   nº 96 aplica àquele transdutor, e os de linha de base, em valores plausíveis
   para a faixa. O sorteio é semeado pela identidade do transdutor — a mesma
   demonstração se repete igual, e dois transdutores não saem iguais. */
function medidasSinteticas(eq, tr){
  const semente = eq.id + '|' + tr.slot + '|' + tr.ns + '|' + tr.modelo;
  const s  = (k, a, b) => a + embaralhar(semente + '|' + k) * (b - a);
  const n  = (k, a, b, casas) => +s(k, a, b).toFixed(casas);
  const um = (k, lista) => lista[Math.min(lista.length - 1, Math.floor(s(k, 0, lista.length)))];
  const f  = fq(tr) || 3.5;

  /* Quanto maior a frequência, menor o alcance — e do alcance saem quase
     todas as outras grandezas do transdutor. */
  const alvo = Math.max(4.5, 17 - 1.2 * f);
  const prof = n('pen', alvo - 0.7, alvo + 0.7, 1);
  const foco = +(prof * 0.4).toFixed(1);
  const dec  = v => String(+(+v).toFixed(1)).replace('.', ',');
  const aq = (k, fr, fc, pr) =>
    ({Gn:String(Math.round(s(k + 'gn', 54, 72))), Fc:dec(fc), Fr:fr, Pr:dec(pr)});

  const zmLim = CRIT.zonaMorta(f), axLim = CRIT.axial(f), latLim = CRIT.lateral(f);

  /* Os alvos de menor contraste são os que somem primeiro. */
  const limiar = {};
  [1,2,3,4,5,6].forEach(i=>{
    const fraco = i >= 5;
    limiar[i] = {contraste: fraco && s('c'+i,0,1) < .55 ? 0 : 1,
                 borda:     fraco && s('b'+i,0,1) < .45 ? 0 : 1,
                 circular:  s('r'+i,0,1) < .10 ? 0 : 1};
  });

  const velocidade = fx => {
    const nominal = fx === '4,0' ? 70.0 : 143.0;
    const medida  = +(nominal * (1 + s('dv'+fx, -0.07, 0.07))).toFixed(1);
    return {nominal, medida, varia:+(((medida / nominal) - 1) * 100).toFixed(1)};
  };
  const alcance = fx => {
    const color = +(prof * s('ds'+fx, 0.80, 0.92)).toFixed(2);
    return {color, espectral:+(color * s('de'+fx, 0.93, 0.99)).toFixed(2)};
  };

  const alt = n('dalt', 0.72, 0.82, 2);
  const razao = n('draz', 0.98, 1.07, 2);

  const todos = {
    uniformidade:{acq:aq('uni', 'Gen', foco, prof * 0.9),
      res:'Sem artefato', obs:''},
    uniformidade_quant:{acq:parseAq(''),
      linhas:{'1ª':{prof:n('uq1p', 1.2, 2.8, 1), largura:n('uq1l', 4.0, 12.0, 1)},
              '2ª':{prof:n('uq2p', 2.0, 3.6, 1), largura:n('uq2l', 3.0, 9.0, 1)}}},
    zona_morta:{acq:aq('zm', 'Res', 1, 4.5),
      zm:n('zmv', zmLim * 0.30, zmLim * 0.75, 1)},
    penetracao:{acq:aq('pn', 'Pen', prof, prof + 1), prof},
    zona_focal:{acq:aq('zf', 'Gen', foco, prof * 0.7),
      nominal:foco, medida:+(foco * s('zfm', 0.96, 1.05)).toFixed(1)},
    exatidao_vertical:{acq:aq('ev', 'Res', foco, prof * 0.7),
      nominal:40.0, medida:n('evm', 39.55, 40.45, 1)},
    exatidao_horizontal:{acq:aq('eh', 'Res', foco, prof * 0.7),
      nominal:2.00, medida:n('ehm', 1.94, 2.06, 2)},
    resolucao:{acq:aq('rs', 'Res', foco, prof * 0.8),
      axial:n('rsa', axLim * 0.5, axLim * 0.95, 1),
      lateral:n('rsl', latLim * 0.45, latLim * 0.9, 1)},
    objetos_anecoicos:{acq:aq('oa', 'Pen', prof, prof + 1),
      linhas:{2:{qtd:um('a2',[2,4,4])}, 3:{qtd:um('a3',[4,4,6])},
              4:{qtd:um('a4',[4,6,6])}, 6:{qtd:um('a6',[6,6,8])},
              8:{qtd:um('a8',[6,8,8])}}},
    distorcao:{acq:aq('ds', 'Res', foco, prof * 0.5),
      linhas:{8:{alt, larg:+(alt / razao).toFixed(2), razao}}},
    limiar:{acq:aq('lm', 'Res', foco, prof * 0.7), linhas:limiar},
    doppler_velocidade:{acq:parseAq(''),
      linhas:{'4,0':velocidade('4,0'), '10,0':velocidade('10,0')}},
    doppler_sensibilidade:{acq:parseAq(''),
      linhas:{'4,0':alcance('4,0'), '10,0':alcance('10,0')}}
  };

  /* Só entram os testes que se aplicam ao slot — a análise quantitativa de
     uniformidade é feita uma vez por equipamento, no T1. */
  const saida = {};
  testesDe(tr.slot).forEach(t =>
    saida[t.id] = Object.assign({marca:null, marcaObs:''}, todos[t.id]));
  return saida;
}

/* Despeja o acervo de medidas num equipamento. O transdutor que não estiver no
   acervo — porque foi cadastrado depois — recebe medidas geradas para a sua
   própria frequência, em vez de ficar em branco. Com `slot`, só aquele
   transdutor é preenchido e o resto da visita fica como está. */
function gerarDemo(eq, slot){
  const fonte = DEMO_MEDIDAS[eq.id] || {};
  const alvos = slot ? eq.transdutores.filter(tr => tr.slot === slot) : eq.transdutores;
  if (!alvos.length) return false;

  if (!slot){ eq.medidas = {}; eq.inspTransd = {}; }
  eq.medidas    = eq.medidas    || {};
  eq.inspTransd = eq.inspTransd || {};

  alvos.forEach(tr=>{
    if (fonte[tr.slot]){
      const copia = JSON.parse(JSON.stringify(fonte[tr.slot]));
      Object.keys(copia).forEach(tid=>{
        copia[tid].acq = parseAq(copia[tid].aq);
        delete copia[tid].aq;
      });
      eq.medidas[tr.slot] = copia;
    } else {
      eq.medidas[tr.slot] = medidasSinteticas(eq, tr);
    }
    /* A inspeção visual faz parte da visita, e sai no relatório junto. */
    eq.inspTransd[tr.slot] = {};
    INSPECAO_TRANSD.forEach(i => eq.inspTransd[tr.slot][i] = 'Conforme');
  });

  if (!slot || !eq.inspecao || !Object.keys(eq.inspecao).length){
    eq.inspecao = {};
    eq.inspObs = {};
    INSPECAO_EQUIP.forEach(i => eq.inspecao[i] = 'Conforme');
  }
  return true;
}

/* Um teste só. É o que o botão dentro do teste chama: o resto da visita fica
   como está, inclusive as marcações de ELB e de não aplicável dos outros. */
function gerarDemoTeste(eq, tr, testeId){
  const doAcervo = (DEMO_MEDIDAS[eq.id] || {})[tr.slot];
  let medida;
  if (doAcervo && doAcervo[testeId]){
    medida = JSON.parse(JSON.stringify(doAcervo[testeId]));
    medida.acq = parseAq(medida.aq);
    delete medida.aq;
  } else {
    medida = medidasSinteticas(eq, tr)[testeId];
  }
  if (!medida) return false;
  eq.medidas[tr.slot] = eq.medidas[tr.slot] || {};
  eq.medidas[tr.slot][testeId] = Object.assign({marca:null, marcaObs:''}, medida);
  return true;
}

/* Devolve um teste à folha em branco, sem tocar nos demais. */
function limparTeste(eq, slot, testeId){
  if (eq.medidas[slot]) delete eq.medidas[slot][testeId];
  registro(eq, slot, testeId);
}

const limparMedidas = eq => { eq.medidas = {}; eq.inspecao = {}; eq.inspObs = {};
                             eq.inspTransd = {};
                             if (typeof esquecerVisita === 'function') esquecerVisita(eq.id); };
/* Apaga a visita de um transdutor só — o cadastro dele não é tocado. */
const limparTransd = (eq, slot) => {
  if (eq.medidas)    delete eq.medidas[slot];
  if (eq.inspTransd) delete eq.inspTransd[slot];
};
const podeHistorico = eq => !eq.semHistorico && temMedidas(eq);

/* ==========================================================================
   3. Histórico e linha de base
   As visitas anteriores. Em produção saem do banco, agrupadas pela chave
   instituição · unidade · N/S do equipamento · N/S do transdutor ·
   protocolo, e só entre medidas de mesma técnica.
   ========================================================================== */

const ANOS = [2023, 2024, 2025];

function embaralhar(semente){
  let h = 2166136261;
  for (let i=0; i<semente.length; i++){ h ^= semente.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 1000) / 1000;
}

/* Séries fixadas onde o desvio precisa ser visível e explicável. */
const DESVIOS = {
  'US-0614|T1|penetracao|·|prof':       [9.5, 9.4, 9.3],
  'US-0614|T3|penetracao|·|prof':       [15.8, 15.3, 14.8],
  'US-0614|T1|limiar|3|circular':       [1, 1, 1],
  'US-0614|T3|limiar|5|contraste':      [1, 1, 1],
  'US-0614|T1|distorcao|8|razao':       [1.00, 1.01, 1.00],
  'US-0614|T1|objetos_anecoicos|2|qtd': [6, 6, 6],
  'US-0378|T1|limiar|3|borda':             [1, 1, 1],
  'US-0378|T3|limiar|3|circular':          [1, 1, 1],
  'US-0378|T2|objetos_anecoicos|8|qtd':    [6, 6, 5],
  'US-0378|T2|penetracao|·|prof':          [12.4, 12.1, 11.8]
};

const chaveSerie = (eqId, slot, testeId, linha, col) =>
  eqId + '|' + slot + '|' + testeId + '|' + (linha === undefined ? '·' : linha) + '|' + col;

/* Devolve [{ano, v}] das visitas anteriores, ou null se não houver o que
   comparar. Equipamento sem visita anterior não tem série alguma. */
function serie(eq, slot, testeId, linha, col){
  if (eq.semHistorico) return null;
  const ch = chaveSerie(eq.id, slot, testeId, linha, col);
  if (DESVIOS[ch]) return ANOS.map((a,i)=>({ano:a, v:DESVIOS[ch][i]}));

  const reg = eq.medidas[slot] && eq.medidas[slot][testeId];
  if (!reg) return null;
  const atual = linha === undefined ? reg[col] : (reg.linhas && reg.linhas[linha] || {})[col];
  if (typeof atual !== 'number') return null;

  /* Sim/Não e contagens de objetos não admitem jitter: um alvo é visto ou
     não é, e meio objeto não existe. Só grandezas contínuas variam. */
  const t = POR_ID[testeId];
  if (t && t.tipo === 'booleana') return ANOS.map(ano=>({ano, v:atual}));
  const inteiro = t && t.tolBase === 'exato';

  return ANOS.map(ano=>{
    const j = (embaralhar(ch + ano) - 0.5) * 0.06;   // ±3 %
    const v = atual * (1 + j);
    return {ano, v: inteiro ? Math.round(v)
                            : (Math.abs(atual) >= 10 ? +v.toFixed(1) : +v.toFixed(2))};
  });
}

function linhaBase(eq, slot, testeId, linha, col){
  const s = serie(eq, slot, testeId, linha, col);
  if (!s || !s.length) return null;
  return {serie:s, ref: s.reduce((a,b)=>a+b.v, 0) / s.length, n:s.length};
}

/* ==========================================================================
   4. Avaliação
   Três caminhos: critério fixo (a norma dá o limite), linha de base (a
   referência vem do histórico) e ELB — o estado de hoje, em que não há
   histórico e o campo sai em branco no relatório.
   ========================================================================== */

const ROTULOS = {conf:'conforme', nconf:'não conforme', elb:'ELB',
                 na:'não aplicável', pend:'pendente'};
/* No laudo a avaliação sai em caixa de título — "Conforme", "Não Conforme".
   Nas telas de coleta o rótulo continua em caixa baixa, que é o desenho do
   aplicativo. */
const ROTULOS_DOC = {conf:'Conforme', nconf:'Não Conforme', elb:'ELB',
                     na:'Não Aplicável', pend:'Pendente'};
const SITUACOES = ['conf', 'nconf', 'elb', 'na', 'pend'];
const contagemZero = () => ({conf:0, nconf:0, elb:0, na:0, pend:0});

/* "Não aplicável" é o único estado que não pesa: um teste que não se aplica
   não torna a visita pior. Sem valor inicial no reduce, uma lista só de NA
   continua sendo NA em vez de virar "conforme". */
const PESO = {restr:6, nconf:5, elb:4, pend:3, conf:2, na:1};
const pior = arr => arr.length ? arr.reduce((a,b)=> PESO[b] > PESO[a] ? b : a) : 'pend';

const nada = v => v === null || v === undefined || v === '';

function contraBase(t, eq, slot, linha, col, valor){
  if (!ESTADO.historico) return null;
  const lb = linhaBase(eq, slot, t.id, linha, col);
  if (lb === null || typeof valor !== 'number') return null;

  const b = {ref:lb.ref, serie:lb.serie, delta:valor - lb.ref};

  /* Contagem de objetos: o critério é não perder alvos, não ficar perto. */
  if (t.tolBase === 'exato')
    return Object.assign(b, {pct:null, banda:null,
      situacao: Math.round(valor) >= Math.round(lb.ref) ? 'conf' : 'nconf'});

  /* Penetração: a IN-96 dá a tolerância em milímetros, não em porcentagem. */
  if (typeof t.tolAbs === 'number')
    return Object.assign(b, {pct:null, banda:[lb.ref - t.tolAbs, lb.ref + t.tolAbs],
      situacao: Math.abs(b.delta) <= t.tolAbs ? 'conf' : 'nconf'});

  const tol = t.tolBase || 0.10;
  const pct = lb.ref === 0 ? 0 : b.delta / lb.ref;
  return Object.assign(b, {pct, banda:[lb.ref*(1-tol), lb.ref*(1+tol)],
    situacao: Math.abs(pct) <= tol ? 'conf' : 'nconf'});
}

function avaliar(t, eq, tr){
  const reg = eq.medidas[tr.slot] && eq.medidas[tr.slot][t.id];
  if (!reg) return {situacao:'pend', texto:'—'};

  /* Marcação manual do técnico vence a avaliação automática. */
  if (reg.marca === 'na')  return {situacao:'na',  texto:'não se aplica'};
  if (reg.marca === 'elb') return {situacao:'elb', texto:'nova linha de base'};

  if (t.tipo === 'qualit'){
    if (nada(reg.res)) return {situacao:'pend', texto:'—'};
    const op = t.opcoes.find(o => o[0] === reg.res);
    return {situacao: op ? op[1] : 'pend', texto: reg.res};
  }

  if (t.tipo === 'escalar'){
    if (t.campos.some(c => nada(reg[c.k]))) return {situacao:'pend', texto:'—'};
    const m = t.campos.find(c => !c.ctx);
    if (t.aval) return {situacao: t.aval(reg, tr), texto: fmt(reg[m.k]) + ' ' + m.un};
    const r = contraBase(t, eq, tr.slot, undefined, t.metrica, reg[t.metrica]);
    return r ? {situacao:r.situacao, texto: fmt(reg[t.metrica]) + ' ' + t.un}
             : {situacao:'elb', texto: fmt(reg[t.metrica]) + ' ' + t.un};
  }

  const linhas = linhasDe(t, reg);
  if (linhas.some(l => t.cols.some(c => nada((reg.linhas[l]||{})[c.k]))))
    return {situacao:'pend', texto:'—'};

  if (t.tipo === 'booleana'){
    if (!ESTADO.historico) return {situacao:'elb', texto:'—'};
    let mudou = 0;
    linhas.forEach(l => t.cols.forEach(c => {
      const s = serie(eq, tr.slot, t.id, l, c.k);
      if (s && s.every(p => p.v === 1) && reg.linhas[l][c.k] === 0) mudou++;
    }));
    return {situacao: mudou ? 'nconf' : 'conf',
            texto: mudou ? mudou + (mudou > 1 ? ' alvos mudaram' : ' alvo mudou') : 'estável'};
  }

  const sits = linhas.map(l => {
    const v = reg.linhas[l];
    if (t.aval) return t.aval(v, tr);
    const r = contraBase(t, eq, tr.slot, l, t.metrica, v[t.metrica]);
    return r ? r.situacao : 'elb';
  });
  const s = pior(sits);
  const fora = sits.filter(x => x === 'nconf').length;
  const n = linhas.length;
  return {situacao:s, texto:
    s === 'elb' ? n + ' linhas sem referência'
    : fora      ? fora + ' de ' + n + ' fora'
                : n + ' linhas conformes'};
}

function resumoTransd(eq, tr){
  const lista = testesDe(tr.slot);
  const contagem = contagemZero();
  lista.forEach(t => { contagem[avaliar(t, eq, tr).situacao]++; });
  const sits = SITUACOES.filter(k => contagem[k] > 0 && k !== 'pend');
  return {total:lista.length, contagem, situacao: sits.length ? pior(sits) : 'pend'};
}

function resumoHospital(h){
  const lista = equipDe(h.id);
  const geral = contagemZero();
  let total = 0, semVisita = 0;
  lista.forEach(eq => {
    const r = resumoEquip(eq);
    SITUACOES.forEach(k => geral[k] += r.geral[k]);
    total += r.total;
    if (!eq.visita) semVisita++;
  });
  const feitos = total - geral.pend;
  const sits = SITUACOES.filter(k => geral[k] > 0 && k !== 'pend');
  return {equipamentos:lista.length, semVisita, geral, total, feitos,
          situacao: feitos ? pior(sits) : 'pend'};
}

function resumoEquip(eq){
  const geral = contagemZero();
  let total = 0;
  eq.transdutores.forEach(tr => {
    const r = resumoTransd(eq, tr);
    SITUACOES.forEach(k => geral[k] += r.contagem[k]);
    total += r.total;
  });
  const feitos = total - geral.pend;
  const sits = SITUACOES.filter(k => geral[k] > 0 && k !== 'pend');
  return {geral, total, feitos, situacao: feitos ? pior(sits) : 'pend'};
}

   5. Utilitários
   ========================================================================== */

const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(v, casas){
  if (nada(v)) return '—';
  if (typeof v !== 'number') return String(v);
  const c = casas !== undefined ? casas : (Math.abs(v) >= 100 ? 1 : 2);
  return v.toFixed(c).replace('.', ',');
}
const val = v => nada(v) ? '' : (typeof v === 'number' ? fmt(v) : String(v));
const pctTxt = p => (p > 0 ? '+' : '') + (p*100).toFixed(1).replace('.', ',') + ' %';
const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isNaN(n) ? null : n; };

function sparkline(base, atual){
  const pts = base.serie.map(p => p.v).concat([atual]);
  const banda = base.banda;
  const todos = pts.concat(banda || []);
  let min = Math.min(...todos), max = Math.max(...todos);
  const folga = (max - min) * 0.28 || Math.abs(max)*0.1 || 1;
  min -= folga; max += folga;

  const W = 240, H = 74, PX = 6;
  const x = i => PX + i * ((W - PX*2) / (pts.length - 1));
  const y = v => H - 10 - ((v - min) / (max - min)) * (H - 22);

  const bandaSvg = banda ? `<rect x="0" y="${y(banda[1]).toFixed(1)}" width="${W}"
      height="${Math.max(1,(y(banda[0]) - y(banda[1]))).toFixed(1)}"
      fill="var(--accent)" opacity=".09"/>` : '';
  const caminho = pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const bolinhas = pts.slice(0,-1).map((v,i)=>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="var(--muted)"/>`).join('');
  const fim = pts.length - 1;
  const cor = 'var(--' + (base.situacao === 'conf' ? 'ok' : 'warn') + ')';

  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Histórico: ${base.serie.map(p=>p.ano+' '+fmt(p.v)).join(', ')}; esta visita ${fmt(atual)}.">
    ${bandaSvg}
    <line x1="0" y1="${y(base.ref).toFixed(1)}" x2="${W}" y2="${y(base.ref).toFixed(1)}"
          stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
    <path d="${caminho}" fill="none" stroke="var(--muted)" stroke-width="1.6"
          stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>
    ${bolinhas}
    <circle cx="${x(fim).toFixed(1)}" cy="${y(pts[fim]).toFixed(1)}" r="5.5" fill="${cor}" opacity=".22"/>
    <circle cx="${x(fim).toFixed(1)}" cy="${y(pts[fim]).toFixed(1)}" r="3.2" fill="${cor}"/>
  </svg>
  <div class="spark-leg"><span>${base.serie[0].ano}</span><span>esta visita</span></div>`;
}

/* Ação principal da tela, ancorada no rodapé. */
const acaoFixa = html => `<div class="acao-fixa">${html}</div>`;

/* Cria o registro de um teste sob demanda, para que um equipamento recém
   cadastrado possa ser medido normalmente. */
function registro(eq, slot, testeId){
  const t = POR_ID[testeId];
  eq.medidas[slot] = eq.medidas[slot] || {};
  let r = eq.medidas[slot][testeId];
  if (!r){
    r = {acq:{Gn:'', Fc:'', Fr:'', Pr:''}, marca:null, marcaObs:''};
    if (t.tipo === 'qualit'){ r.res = ''; r.obs = ''; }
    else if (t.tipo === 'escalar'){ t.campos.forEach(c => r[c.k] = null); }
    else {
      r.linhas = {};
      t.linhas.forEach(l => { r.linhas[l] = {}; t.cols.forEach(c => r.linhas[l][c.k] = null); });
    }
    eq.medidas[slot][testeId] = r;
  }
  return r;
}

const CAMPOS_EQUIP = [
  {k:'unidade',     r:'Unidade',           dica:'Se o hospital tiver mais de uma'},

  {k:'sala',        r:'Sala'},
