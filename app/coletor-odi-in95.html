      <div class="sub">${esc(tuboDe(eq))} · ${esc(eq.tecnologia)} ·
        ${esc(eq.kvpMax)} kVp / ${esc(eq.maMax)} mA · N/S ${esc(eq.ns)}</div>
    </div>

    <div class="resumo">
      <div class="res-item"><div class="n mono">${p.feitos}<span style="font-size:14px; color:var(--faint)">/${p.total}</span></div><div class="r">ensaios concluídos</div></div>
      <div class="res-item"><div class="n mono" style="color:var(--ok)">${p.contagem.conf || 0}</div><div class="r">conformes</div></div>
      <div class="res-item"><div class="n mono" style="color:var(--warn)">${p.contagem.nconf || 0}</div><div class="r">não conformes</div></div>
      <div class="res-item"><div class="n mono" style="color:var(--bad)">${p.contagem.restr || 0}</div><div class="r">nível de restrição</div></div>
    </div>

    <p class="rotulo">Vistoria de radioproteção</p>
    <button class="teste" id="btVistoria">
      <span class="chip c-${vist.pend === INSPECAO_EQUIP.length ? 'pend'
                          : vist.nconf ? 'nconf' : vist.pend ? 'pend' : 'conf'}">${
        vist.pend === INSPECAO_EQUIP.length ? 'não iniciada'
        : vist.nconf ? vist.nconf + ' não conforme(s)'
        : vist.pend ? 'em andamento' : 'conforme'}</span>
      <span class="corpo">
        <span class="nome">Sinalização, vestimentas, posto do operador e dosimetria</span>
        <span class="meta">${INSPECAO_EQUIP.length} itens · condições da RDC nº 611 · não é ensaio do Anexo I</span>
      </span>
      <span class="valor">${vist.conf + vist.nconf}/${INSPECAO_EQUIP.length}</span>
    </button>

    <p class="rotulo">Periodicidade</p>
    <div class="pills">${filtros.map(([id,rot])=>
      `<button class="pill" data-f="${id}" aria-pressed="${ESTADO.filtro === id}">${rot}</button>`).join('')}</div>

    ${grupos}

    ${acaoFixa(`
      <button class="bt" id="btDemoEq">Preencher exemplo</button>
      <button class="bt principal" id="btLaudo">Ver o relatório gerado</button>`)}`;

  el('btLaudo').addEventListener('click', ()=> ir('laudo'));
  el('btVistoria').addEventListener('click', ()=> ir('vistoria'));
  el('btDemoEq').addEventListener('click', ()=>{ preencherDemo(eq.id); persistir(); render(); });
  document.querySelectorAll('.pill').forEach(b =>
    b.addEventListener('click', ()=>{ ESTADO.filtro = b.dataset.f; render(); }));
  /* Só os cartões que carregam um ensaio. A classe `.teste` é o desenho do
     cartão, e o da vistoria a reaproveita — sem o seletor por atributo, ele
     recebia este manipulador também, abria um ensaio inexistente e o roteiro
     se redesenhava no lugar da vistoria. */
  document.querySelectorAll('.teste[data-en]').forEach(b =>
    b.addEventListener('click', ()=> ir('ensaio', {ensaio:b.dataset.en, estacao:0})));
}

/* ==========================================================================
   9. Coleta de um ensaio
   Teclado próprio em vez do teclado do sistema: na sala de exame se digita
   com luva, de pé, olhando para o instrumento e não para a tela.
   ========================================================================== */

function telaEnsaio(){
  const eq   = equipAtual();
  const ens  = POR_ID[ESTADO.ensaio];
  const reg  = registro(eq.id, ens.id);
  const c    = calcular(ens, reg);
  const instr = INSTRUMENTOS[ens.instr];

  const cabeca = `
    <div class="contexto" style="margin-top:14px">
      <div style="flex:1 1 300px">
        <h1 style="font-size:18px">${esc(ens.nome)}</h1>
        <div class="sub">${esc(ens.aplic)} · ${esc(ens.period)}</div>
        <div class="limites">
          <div class="lim-item"><span>Tolerância</span><b>${esc(ens.tolTexto)}</b></div>
          <div class="lim-item"><span>Nível de restrição</span><b>${esc(ens.restrTexto || '—')}</b></div>
        </div>
      </div>
      <span class="chip c-${c.situacao}" style="margin-top:4px">${ROTULOS[c.situacao]}</span>
    </div>
    <p class="ajuda">${esc(ens.ajuda)}${ens.nota ? ' <b style="color:var(--faint)">' + esc(ens.nota) + '</b>' : ''}</p>
    <p class="ajuda" style="color:var(--faint); font-size:11.5px; margin-bottom:14px">
      Instrumento: ${esc(instr.modelo)} · certificado ${esc(instr.cert)} · validade ${esc(instr.validade)}
      ${ens.N != null ? ` · coeficiente ${num(ens.N,3)} · U ± ${num(ens.Urel,1)} % (k = 2)` : ''}
    </p>`;

  const demo = `
    <p class="rotulo">Demonstração</p>
    <div class="card pad">
      <div class="rodape-acoes" style="margin:0">
        <button class="bt mini" id="btGerarEnsaio">Gerar medidas de exemplo</button>
        ${temAlgumaLeitura(reg) || reg.concluido
          ? '<button class="bt mini" id="btLimparEnsaio">Limpar este ensaio</button>' : ''}
      </div>
      <p class="base-nota" style="margin:11px 0 0">Preenche só este ensaio, com leituras
      plausíveis para as estações configuradas acima, e o marca como concluído.</p>
    </div>`;

  const rodape = demo + `
    <p class="rotulo">Observações do inspetor</p>
    <textarea class="obs" id="obs" placeholder="Condições do ensaio, número de série do acessório, restrições observadas…">${esc(reg.obs || '')}</textarea>
    ${acaoFixa(`
      <button class="bt" id="btNA">${reg.na ? 'Voltar a aplicar' : 'Não aplicável'}</button>
      <button class="bt principal" id="btConcluir">${reg.concluido ? 'Concluído · reabrir' : 'Concluir ensaio'}</button>`)}`;

  topo({voltar:'roteiro', titulo:ens.nome, sub:eq.id + ' · ' + eq.marca + ' ' + eq.modelo});

  el('vista').innerHTML = cabeca +
    (ens.tipo === 'qualit' ? blocoQualitativo(ens, reg, c) : blocoNumerico(ens, reg, c)) +
    rodape;

  el('obs').addEventListener('input', e=>{ reg.obs = e.target.value; persistir(); });
  el('btGerarEnsaio').addEventListener('click', ()=>{
    gerarMedidasEnsaio(eq.id, ens.id); persistir(); render();
  });
  const btLimpar = el('btLimparEnsaio');
  if (btLimpar) btLimpar.addEventListener('click', ()=>{
    limparEnsaio(eq.id, ens.id); persistir(); render();
  });
  el('btNA').addEventListener('click', ()=>{
    reg.na = !reg.na; reg.concluido = reg.na; reg.ts = Date.now();
    if (reg.na) enfileirar(eq.id, ens.id);
    persistir(); render();
  });
  el('btConcluir').addEventListener('click', ()=>{
    reg.concluido = !reg.concluido; reg.ts = Date.now();
    if (reg.concluido){ enfileirar(eq.id, ens.id); ir('roteiro'); }
    else { persistir(); render(); }
  });

  if (ens.tipo === 'qualit') ligarQualitativo(ens, reg);
  else ligarNumerico(ens, reg);
}

function blocoQualitativo(ens, reg, c){
  const opcoes = [
    {s:'conf',  rot:'Conforme',     sub:ens.tolTexto},
    {s:'nconf', rot:'Não conforme', sub:'Fora do critério; exige correção e reavaliação'}
  ];
  if (ens.temRestr) opcoes.push({s:'restr', rot:'Nível de restrição', sub:ens.restrTexto});
  opcoes.push({s:'na', rot:'Não aplicável', sub:'Recurso inexistente neste equipamento'});

  const campos = (ens.campos || []).length ? `
    <p class="rotulo">Parâmetros medidos</p>
    <div class="campos">${(ens.campos || []).map(cp=>{
      const valor = (reg.campos && reg.campos[cp.id] != null) ? reg.campos[cp.id] : cp.valor;
      return `<button class="campo" data-cp="${esc(cp.id)}" aria-pressed="false">
        <span>${esc(cp.rot)}</span>
        <b class="mono">${esc(String(valor).replace('.', ','))} ${esc(cp.unidade || '')}</b></button>`;
    }).join('')}</div>` : '';

  return `${campos}
    <p class="rotulo">Resultado da inspeção</p>
    <div class="opcoes">${opcoes.map(o=>
      `<button class="opcao" data-s="${o.s}" aria-pressed="${reg.resultado === o.s}">
        ${esc(o.rot)}<small>${esc(o.sub)}</small></button>`).join('')}</div>`;
}

function ligarQualitativo(ens, reg){
  document.querySelectorAll('.opcao').forEach(b => b.addEventListener('click', ()=>{
    reg.resultado = b.dataset.s;
    reg.na = (b.dataset.s === 'na');
    persistir(); render();
  }));
  document.querySelectorAll('.campo').forEach(b => b.addEventListener('click', ()=>{
    const cp = (ens.campos || []).find(x => x.id === b.dataset.cp);
    const atual = (reg.campos && reg.campos[cp.id] != null) ? reg.campos[cp.id] : cp.valor;
    const s = prompt(`${cp.rot} (${cp.unidade || ''})`, String(atual).replace('.', ','));
    if (s != null){
      const v = parseFloat(s.replace(',', '.'));
      if (!isNaN(v)){ reg.campos = reg.campos || {}; reg.campos[cp.id] = v; persistir(); render(); }
    }
  }));
}

function blocoNumerico(ens, reg, c){
  const est = estacoesDe(ens, reg);
  const lista = est.length ? est : [{rot:'Leitura'}];
  const iEst = Math.min(ESTADO.estacao, lista.length - 1);
  const leiturasEst = (reg.leituras[iEst] || []);

  const campos = (ens.campos || []).length ? `
    <div class="campos">${(ens.campos || []).map(cp=>{
      const valor = (reg.campos && reg.campos[cp.id] != null) ? reg.campos[cp.id] : cp.valor;
      const focado = ESTADO.foco.tipo === 'campo' && ESTADO.foco.id === cp.id;
      if (cp.tipo === 'opcao'){
        return `<div class="campo"><span>${esc(cp.rot)}</span>
          <select data-sel="${esc(cp.id)}" class="mono">${cp.opcoes.map(o=>
            `<option value="${esc(o)}" ${o === valor ? 'selected' : ''}>${esc((cp.rotulos && cp.rotulos[o]) || o)}</option>`).join('')}</select></div>`;
      }
      return `<button class="campo" data-cp="${esc(cp.id)}" aria-pressed="${focado}">
        <span>${esc(cp.rot)}</span>
        <b class="mono">${esc(String(valor).replace('.', ','))} ${esc(cp.unidade || '')}</b></button>`;
    }).join('')}</div>` : '';

  /* A lista de estações é a técnica do serviço: dá para trocar os pontos de
     medida, tirar e acrescentar, sem sair do ensaio. */
  const podeEditar = estacoesEditaveis(ens);
  const editando = podeEditar && ESTADO.editEst;
  const temNominal = ((ens.estacoes || [])[0] || {}).nominal != null;

  const chips = lista.map((e,i)=>{
      const n = (reg.leituras[i] || []).length;
      const cls = i === iEst ? 'atual' : (n >= ens.repeticoes ? 'cheia' : '');
      return `<button class="est ${cls}" data-est="${i}"><b>${esc(e.rot)}</b><span>${n}/${ens.repeticoes}</span></button>`;
    }).join('');

  const linhasEd = lista.map((e,i)=>`<div class="est-linha">
      <input class="txt" data-er="${i}" value="${esc(e.rot || '')}"
             placeholder="nome da estação" autocomplete="off">
      ${temNominal ? `<input class="txt n" data-en="${i}" inputmode="decimal" placeholder="nominal"
             value="${e.nominal == null ? '' : esc(String(e.nominal).replace('.', ','))}">
        <span class="un">${esc(unEst(ens))}</span>` : ''}
      ${ens.tipo === 'radiom' ? `<select class="txt" data-ea="${i}">
          <option value="livre"${e.area === 'livre' ? ' selected' : ''}>área livre</option>
          <option value="controlada"${e.area === 'controlada' ? ' selected' : ''}>área controlada</option>
        </select>` : ''}
      <button class="tirar" data-ex="${i}" ${lista.length < 2 ? 'disabled' : ''}
              aria-label="Remover estação">&times;</button>
    </div>`).join('');

  const editor = `<div class="est-edit">
      ${linhasEd}
      <div class="est-acoes">
        <button class="bt mini" id="btAddEst">+ estação</button>
        <button class="bt mini" id="btResetEst">restaurar as do Anexo I</button>
      </div>
      <p class="base-nota" style="margin:11px 0 0">O Anexo I diz o que medir e com que
      tolerância, não em que pontos: escolha aqui os valores que este equipamento vai
      testar. As leituras já registradas seguem com a sua estação.</p>
    </div>`;

  const estacoes = (lista.length > 1 || podeEditar) ? `
    <div class="rotulo-linha">
      <p class="rotulo">Estações de medida</p>
      ${podeEditar ? `<button class="bt mini" id="btEditEst">${editando ? 'Concluir' : 'Editar'}</button>` : ''}
    </div>
    ${editando ? editor : `<div class="estacoes">${chips}</div>`}` : '';

  const focoCampo = ESTADO.foco.tipo === 'campo'
    ? (ens.campos || []).find(x => x.id === ESTADO.foco.id) : null;
  const contagem = leiturasEst.length >= ens.repeticoes
    ? `estação completa · ${leiturasEst.length} leitura${leiturasEst.length > 1 ? 's' : ''}`
    : `leitura ${leiturasEst.length + 1} de ${ens.repeticoes}`;
  const rotVisor = focoCampo ? `${focoCampo.rot} do ensaio`
                             : (lista.length > 1 ? `${lista[iEst].rot} · ${contagem}` : contagem);
  const unVisor = focoCampo ? (focoCampo.unidade || '') : ens.unidadeBruta;

  const previa = montarPrevia(ens, reg, c, iEst);

  /* Com várias estações a lista mostra só a estação em foco; o conjunto completo
     aparece no roteiro e no relatório. */
  const soAtual = lista.length > 1;
  const regs = [];
  (reg.leituras || []).forEach((l,i)=>{
    if (soAtual && i !== iEst) return;
    (l || []).forEach((v,j)=> regs.push(`<div class="reg">
      <span class="e">${esc(lista[i] ? lista[i].rot : '—')}</span>
      <span class="v mono">${num(v, ens.casasBrutas)} <span style="color:var(--faint)">${esc(ens.unidadeBruta)}</span></span>
      <button class="x" data-del="${i}:${j}" title="Remover leitura" aria-label="Remover leitura">&times;</button>
    </div>`));
  });
  const outras = (reg.leituras || []).reduce((s,l,i)=>
    s + ((soAtual && i !== iEst) ? (l || []).length : 0), 0);

  const teclas = ['7','8','9','4','5','6','1','2','3',',','0','←'];

  return `${campos}${estacoes}
    <div class="visor-box">
      <div class="visor-rot">${esc(rotVisor)}</div>
      <div class="visor">
        <span class="v mono ${ESTADO.buffer ? '' : 'vazio'}" id="visor">${esc(ESTADO.buffer || '0')}</span>
        <span class="u">${esc(unVisor)}</span>
      </div>
      <div class="previa">${previa}</div>
    </div>
    <div class="teclado">${teclas.map(t=>
      `<button class="tecla${(t === '←' || t === ',') ? ' aux' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>
    <div class="acoes">
      <button class="bt" id="btApagar">Apagar</button>
      <button class="bt principal" id="btRegistrar">${focoCampo ? 'Gravar parâmetro' : 'Registrar leitura'}</button>
    </div>
    <p class="rotulo">Leituras ${soAtual ? 'desta estação' : 'deste ensaio'}${
      outras ? ` <span style="text-transform:none; letter-spacing:0; font-weight:400">· mais ${outras} em outras estações</span>` : ''}</p>
    <div class="registros">${regs.length ? regs.reverse().join('') : '<p class="vazio-msg">nenhuma leitura registrada ainda</p>'}</div>`;
}

function montarPrevia(ens, reg, c, iEst){
  const v = valorBuffer();
  const cor = s => s === 'conf' ? 'var(--ok)' : s === 'nconf' ? 'var(--warn)'
                 : s === 'restr' ? 'var(--bad)' : s === 'lim' ? 'var(--info)' : 'var(--faint)';

  /* Com número no visor e estação de desvio, mostra o desvio da leitura em tempo real. */
  if (v != null && v > 0 && ESTADO.foco.tipo === 'leitura' && ens.tipo === 'desvio'){
    const est = estacoesDe(ens, reg)[iEst];
    if (!est || est.nominal == null) return '<span class="txt">estação sem valor nominal</span>';
    const N = ESTADO.corrigir && ens.N != null ? ens.N : 1;
    const d = (v * N - est.nominal) / est.nominal * 100;
    const s = avaliar(d, ens.lim);
    return `<span class="d" style="color:${cor(s)}">${sinal(d,2)} %</span>
            <span class="chip c-${s}">${ROTULOS[s]}</span>`;
  }
  /* porEstacao é construído na ordem das estações; em ensaios de estação única
     cai sempre no primeiro item. Com resultado próprio, a estação atual tem
     precedência sobre o resultado consolidado do ensaio. */
  const p = (c.porEstacao || [])[iEst] || (c.porEstacao || [])[0];
  const detalhe = p && p.detalhe ? `<span class="txt">${esc(p.detalhe)}</span>` : '';

  if (p && p.valor != null && p.situacao && p.situacao !== '—' && p.situacao !== 'pend'){
    return `<span class="d" style="color:${cor(p.situacao)}">${esc(p.texto)}</span>
            <span class="chip c-${p.situacao}">${ROTULOS[p.situacao]}</span>${detalhe}`;
  }
  if (c.valor != null || (c.texto && c.texto !== '—')){
    return `<span class="d" style="color:${cor(c.situacao)}">${esc(c.texto)}</span>
            <span class="chip c-${c.situacao}">${ROTULOS[c.situacao]}</span>${detalhe}`;
  }
  return '<span class="txt">o resultado aparece conforme as leituras entram</span>';
}

const valorBuffer = () => {
  const v = parseFloat(ESTADO.buffer.replace(',', '.'));
  return isNaN(v) ? null : v;
};

function ligarNumerico(ens, reg){
  document.querySelectorAll('.tecla').forEach(b =>
    b.addEventListener('click', ()=> digitar(b.dataset.t)));

  document.querySelectorAll('.est').forEach(b => b.addEventListener('click', ()=>{
    ESTADO.estacao = Number(b.dataset.est); ESTADO.buffer = ''; ESTADO.foco = {tipo:'leitura'}; render();
  }));

  document.querySelectorAll('.campo[data-cp]').forEach(b => b.addEventListener('click', ()=>{
    const id = b.dataset.cp;
    ESTADO.foco = (ESTADO.foco.tipo === 'campo' && ESTADO.foco.id === id)
      ? {tipo:'leitura'} : {tipo:'campo', id};
    ESTADO.buffer = ''; render();
  }));

  document.querySelectorAll('select[data-sel]').forEach(s => s.addEventListener('change', ()=>{
    reg.campos = reg.campos || {}; reg.campos[s.dataset.sel] = s.value; persistir(); render();
  }));

  /* Cópia de trabalho: enquanto ninguém mexe, o ensaio usa a lista do rol;
     ao primeiro ajuste o registro passa a ter a sua. */
  const copiaEst = () => JSON.parse(JSON.stringify(estacoesDe(ens, reg)));
  function gravarEst(est){
    est.forEach((e,i)=>{ if (!e.rot) e.rot = 'Estação ' + (i + 1); });
    reg.estacoes = est;
    ajustarLeituras(reg, est.length);
    if (ESTADO.estacao >= est.length) ESTADO.estacao = est.length - 1;
    persistir(); render();
  }

  const btEd = el('btEditEst');
  if (btEd) btEd.addEventListener('click', ()=>{ ESTADO.editEst = !ESTADO.editEst; render(); });

  document.querySelectorAll('[data-er]').forEach(inp => inp.addEventListener('change', ()=>{
    const est = copiaEst();
    est[+inp.dataset.er].rot = inp.value.trim();
    gravarEst(est);
  }));

  document.querySelectorAll('[data-en]').forEach(inp => inp.addEventListener('change', ()=>{
    const est = copiaEst(), i = +inp.dataset.en;
    const v = parseFloat(inp.value.replace(',', '.'));
    est[i].nominal = isNaN(v) ? null : v;
    /* Rótulo em branco acompanha o nominal — quem digita 81 quer ver "81 kVp". */
    if (!est[i].rot && est[i].nominal != null)
      est[i].rot = String(est[i].nominal).replace('.', ',') + ' ' + unEst(ens);
    gravarEst(est);
  }));

  document.querySelectorAll('[data-ea]').forEach(sel => sel.addEventListener('change', ()=>{
    const est = copiaEst();
    est[+sel.dataset.ea].area = sel.value;
    gravarEst(est);
  }));

  document.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', ()=>{
    const est = copiaEst(), i = +b.dataset.ex;
    if (est.length < 2) return;
    est.splice(i, 1);
    (reg.leituras || []).splice(i, 1);
    gravarEst(est);
  }));

  const btAdd = el('btAddEst');
  if (btAdd) btAdd.addEventListener('click', ()=>{
    const est = copiaEst();
    const ult = est[est.length - 1] || {};
    const nova = {rot:''};
    if (ult.nominal != null) nova.nominal = ult.nominal;
    if (ult.area) nova.area = ult.area;
    est.push(nova);
    ESTADO.estacao = est.length - 1;
    gravarEst(est);
  });

  const btReset = el('btResetEst');
  if (btReset) btReset.addEventListener('click', ()=>{
    delete reg.estacoes;
    ajustarLeituras(reg, (ens.estacoes || []).length);
    ESTADO.estacao = 0;
    persistir(); render();
  });

  el('btApagar').addEventListener('click', ()=>{ ESTADO.buffer = ''; render(); });
  el('btRegistrar').addEventListener('click', registrar);

  document.querySelectorAll('.x[data-del]').forEach(b => b.addEventListener('click', ()=>{
    const [i,j] = b.dataset.del.split(':').map(Number);
    reg.leituras[i].splice(j,1); persistir(); render();
  }));

  function digitar(t){
    if (t === '←') ESTADO.buffer = ESTADO.buffer.slice(0,-1);
    else if (t === ','){ if (!ESTADO.buffer.includes(',') && ESTADO.buffer) ESTADO.buffer += ','; }
    else if (ESTADO.buffer.replace(',','').length < 6) ESTADO.buffer += t;
    render();
  }

  function registrar(){
    const v = valorBuffer();
    if (v == null) return;
    if (ESTADO.foco.tipo === 'campo'){
      reg.campos = reg.campos || {}; reg.campos[ESTADO.foco.id] = v;
      ESTADO.foco = {tipo:'leitura'};
    } else {
      const est = estacoesDe(ens, reg);
      const i = Math.max(0, Math.min(ESTADO.estacao, est.length - 1));
      reg.leituras[i] = reg.leituras[i] || [];
      reg.leituras[i].push(v);
      /* Ao fechar exatamente as repetições previstas, salta para a próxima estação
         que ainda falta. Uma leitura extra numa estação já completa não move o foco. */
      if (reg.leituras[i].length === ens.repeticoes){
        const prox = est.findIndex((e,k)=> k > i && (reg.leituras[k] || []).length < ens.repeticoes);
        if (prox >= 0) ESTADO.estacao = prox;
      }
    }
    ESTADO.buffer = ''; persistir(); render();
  }

  ESTADO._digitar = digitar;
  ESTADO._registrar = registrar;
}

/* Teclado físico — útil quando a demonstração roda em notebook. */
document.addEventListener('keydown', e=>{
  if (ESTADO.vista !== 'ensaio') return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const ens = POR_ID[ESTADO.ensaio];
  if (!ens || ens.tipo === 'qualit' || !ESTADO._digitar) return;
  if (/^[0-9]$/.test(e.key)){ ESTADO._digitar(e.key); e.preventDefault(); }
  else if (e.key === ',' || e.key === '.'){ ESTADO._digitar(','); e.preventDefault(); }
  else if (e.key === 'Backspace'){ ESTADO._digitar('←'); e.preventDefault(); }
  else if (e.key === 'Enter'){ ESTADO._registrar(); e.preventDefault(); }
});

/* ==========================================================================
   9b. Vistoria do equipamento

   A inspeção visual não é ensaio do Anexo I — não tem tolerância, nem
   periodicidade, nem instrumento — mas é o que abre a visita e o que o laudo
   traz antes dos resultados. Fica numa tela própria, percorrida de uma vez ao
   chegar na sala, em vez de espalhada entre os ensaios.

   Três estados por item: conforme, não conforme e não inspecionado. O
   terceiro é o inicial e sobrevive: visita em que ninguém olhou o cabo de
   alimentação sai dizendo isso, e não "conforme" por omissão.
   ========================================================================== */

function contarVistoria(v){
  const c = {conf:0, nconf:0, pend:0};
  INSPECAO_EQUIP.forEach(i=>{
    const s = (v.inspecao || {})[i];
    if (s === 'Conforme') c.conf++;
    else if (s) c.nconf++;
    else c.pend++;
  });
  return c;
}

function telaVistoria(){
  const eq = equipAtual();
  const v  = visita(eq.id);
  const c  = contarVistoria(v);
  v.inspObs = v.inspObs || {};

  const linha = (item)=>{
    const i = INSPECAO_EQUIP.indexOf(item);
    const s = (v.inspecao || {})[item];
    const o = v.inspObs[item] || '';
    return `<div class="vist-item ${s && s !== 'Conforme' ? 'nc' : ''}">
      <span class="nome">${esc(item)}</span>
      <span class="sn">
        <button data-i="${i}" data-v="Conforme" aria-pressed="${s === 'Conforme'}">Conforme</button>
        <button data-i="${i}" data-v="Não conforme" aria-pressed="${!!s && s !== 'Conforme'}">Não conforme</button>
      </span>
      ${s && s !== 'Conforme'
        ? `<textarea class="obs" data-o="${i}"
             placeholder="O que foi encontrado — vai para a coluna de observações do laudo">${esc(o)}</textarea>`
        : ''}
    </div>`;
  };

  const itens = VISTORIA.map(g=>{
    const pendentes = g.itens.filter(i=>!(v.inspecao || {})[i]).length;
    return `<div class="grupo-tit"><h2>${esc(g.grupo)}</h2>
        <span>${g.itens.length - pendentes}/${g.itens.length}</span></div>
      <div class="vist-lista">${g.itens.map(linha).join('')}</div>`;
  }).join('');

  topo({voltar:'roteiro', titulo:'Vistoria de radioproteção',
        sub:eq.marca + ' ' + eq.modelo + ' · ' + eq.id});

  el('vista').innerHTML = `
    <div style="margin:14px 0 12px">
      <h1>Condições de proteção radiológica</h1>
      <div class="sub">${INSPECAO_EQUIP.length} itens · ${c.conf} conforme(s) ·
        ${c.nconf} não conforme(s) ·
        ${c.pend ? c.pend + ' ainda não inspecionado(s)' : 'nenhum item em aberto'}</div>
    </div>

    <p class="sub" style="margin:0 2px 14px; max-width:66ch">
      Sinalização, vestimentas plumbíferas, posto do operador, dosimetria e
      documentação — as condições da RDC nº 611/2022, que não são ensaio do Anexo I e
      nem por isso deixam de entrar no laudo. Tocar de novo no botão já marcado devolve
      o item a <b>não inspecionado</b>: o relatório diz o que foi olhado, não o que se
      supõe.
    </p>

    ${itens}

    ${acaoFixa(`
      <button class="bt" id="btTodosConf">Marcar todos conformes</button>
      <button class="bt principal" id="btVoltarRot">Voltar ao roteiro</button>`)}`;

  document.querySelectorAll('.vist-item .sn button').forEach(b =>
    b.addEventListener('click', ()=>{
      const item = INSPECAO_EQUIP[Number(b.dataset.i)];
      v.inspecao = v.inspecao || {};
      /* Tocar no que já está marcado desmarca: é como se corrige um toque
         errado sem ter de apagar a visita inteira. */
      if (v.inspecao[item] === b.dataset.v) {
        delete v.inspecao[item];
        delete v.inspObs[item];
      } else {
        v.inspecao[item] = b.dataset.v;
      }
      persistir(); render();
    }));

  /* A observação grava ao sair do campo, não a cada tecla: redesenhar a tela
     no meio da digitação tiraria o foco a cada letra. */
  document.querySelectorAll('.vist-item textarea.obs').forEach(t =>
    t.addEventListener('change', ()=>{
      v.inspObs[INSPECAO_EQUIP[Number(t.dataset.o)]] = t.value;
      persistir();
    }));

  el('btTodosConf').addEventListener('click', ()=>{
    v.inspecao = v.inspecao || {};
    INSPECAO_EQUIP.forEach(i=>{ if (!v.inspecao[i]) v.inspecao[i] = 'Conforme'; });
    persistir(); render();
  });
  el('btVoltarRot').addEventListener('click', ()=> ir('roteiro'));
}

/* ==========================================================================
   Exportação da visita em planilha

   Uma visita, um arquivo. O formato é longo: cada linha é uma grandeza, com
   as colunas da esquerda dizendo onde e em que ensaio, e o par
   variável/valor dizendo o que aquele número é. Leitura bruta, valor nominal,
   parâmetro do ensaio, resultado consolidado e item de vistoria convivem na
   mesma tabela, distinguidos pela coluna `variavel`.

   É feio de ler de cima a baixo e é exatamente o que uma tabela dinâmica e um
   INSERT no banco querem. A folha de rosto legível já existe: é o relatório.

   Todo contexto se repete em toda linha, de propósito. Planilha longa se
   filtra e se pivota; planilha que só diz o equipamento no alto de cada bloco
   não sobrevive a uma ordenação por outra coluna.

   O que a planilha guarda é a **leitura bruta**. O resultado consolidado vai
   junto por conveniência, mas é derivado — ao reimportar, recalcule, nunca
   confie na coluna. Se a tolerância da norma mudar, a conta muda e o arquivo
   antigo continua correto no que importa.
   ========================================================================== */

const COLUNAS_PLANILHA = [{rot:'', larg:58}, {rot:'', larg:36}];

/* A unidade vai no rótulo, e não numa terceira coluna: assim a coluna B fica
   só com o que foi medido ou cadastrado — número onde é número, texto onde é
   texto. É o que se copia, se soma e se confere de bater o olho. */
const un = u => u ? ' (' + u + ')' : '';

/* O motor calcula em ponto flutuante, e -4.796888888888884 numa célula não é
   precisão, é ruído: o ensaio declara quantas casas valem. A leitura bruta não
   passa por aqui — só o que foi derivado dela. */
const arred = (v, casas) => (v == null || !isFinite(v)) ? v
  : Number(Number(v).toFixed(casas == null ? 4 : casas));

function linhasPlanilha(eqId){
  const eq = EQUIPAMENTOS.find(e => e.id === eqId);
  const inst = instDe(eq);
  const v = visita(eqId);
  const data = v.data || hoje();
  const L = [];

  /* Rótulo vazio ou valor ausente não vira linha: a planilha é para ler, e
     linha com traço no lugar do número só ocupa espaço. */
  const par   = (rot, val) => { if (val != null && val !== '') L.push([rot, val]); };
  const sub   = (rot, val) => par('    ' + rot, val);
  const forte = rot => { const l = [rot, '']; l.forte = true; L.push(l); };
  const secao = t => L.push({secao:t});
  const vazio = () => L.push({vazio:true});

  L.push({titulo:'Controle de Qualidade — Radiologia Odontológica Intraoral'});
  par('Instrução Normativa', 'IN nº 95/2021 · RDC nº 611/2022');
  par('Data da visita', data);
  par('Natureza da avaliação', v.tipo);
  par('Relatório nº', eq.relatorio);
  par('Periodicidade', eq.periodicidade);
  vazio();

  secao('CLIENTE');
  par('Instituição', inst.nome);
  par('CNPJ', inst.cnpj);
  par('Endereço', inst.endereco);
  par('Cidade', inst.cidade);
  par('CEP', inst.cep);
  par('Telefone', inst.telefone);
  par('Responsável técnico', inst.rt);
  par('Licença sanitária', inst.alvara);
  vazio();

  secao('EQUIPAMENTO');
  par('Código', eq.id);
  par('Marca', eq.marca);
  par('Modelo', eq.modelo);
  par('Número de série', eq.ns);
  par('Patrimônio', eq.patrimonio);
  par('Unidade', eq.unidade);
  par('Setor', eq.setor);
  par('Sala', eq.sala);
  par('Receptor', eq.tecnologia);
  par('Instalação', eq.tipo);
  vazio();

  secao('CONJUNTO EMISSOR');
  par('Modelo do tubo', eq.tuboModelo || eq.tubo);
  par('N/S do tubo', eq.tuboNs);
  par('Ano de fabricação', eq.anoFab);
  par('Tensão máxima (kVp)', eq.kvpMax);
  par('Corrente máxima (mA)', eq.maMax);
  par('Filtração total', eq.filtracao);
  par('Localizador', eq.localizador);
  vazio();

  secao('VISTORIA DE RADIOPROTEÇÃO');
  VISTORIA.forEach(g => {
    forte(g.grupo);
    g.itens.forEach(item => {
      par('    ' + item, (v.inspecao || {})[item] || 'Não inspecionado');
      const o = (v.inspObs || {})[item];
      if (o) par('        observação', o);
    });
  });
  vazio();

  /* Um bloco por ensaio, na ordem do roteiro: o nome abre em negrito e as
     medidas vêm recuadas embaixo. É a mesma leitura de uma folha de campo. */
  GRUPOS.forEach(g => {
    const lista = ENSAIOS.filter(e => e.grupo === g.id);
    if (!lista.length) return;
    secao('ENSAIOS · ' + g.nome.toUpperCase());

    lista.forEach(ens => {
      const reg = v.resultados[ens.id];
      forte(ens.nome);

      if (!reg || (!reg.concluido && !temAlgumaLeitura(reg))){
        sub('Situação', 'não realizado');
        return;
      }
      if (reg.na){
        sub('Situação', 'não aplicável');
        if (reg.obs) sub('Observação', reg.obs);
        return;
      }

      const c = calcular(ens, reg);

      (ens.campos || []).forEach(cp => {
        const val = (reg.campos && reg.campos[cp.id] != null) ? reg.campos[cp.id] : cp.valor;
        sub(cp.rot + un(cp.unidade), val);
      });

      if (ens.tipo === 'qualit'){
        sub('Avaliação', ROTULOS[c.situacao] || '—');
      } else {
        estacoesDe(ens, reg).forEach((e, i) => {
          (reg.leituras[i] || []).forEach((x, k) =>
            sub(e.rot + ' · leitura ' + (k + 1) + un(ens.unidadeBruta), x));
          if (e.nominal != null) sub(e.rot + ' · nominal' + un(unEst(ens)), e.nominal);
        });
        /* O resultado por estação vem do motor, não da lista de estações: em
           alguns ensaios o motor reescreve o rótulo — a CSR vira "CSR a
           70 kVp" — e casar por texto perderia essas linhas. */
        /* Com uma estação só, a linha da estação e o resultado do ensaio são o
           mesmo número: repetir os dois só faz a folha render menos. */
        const umaEstacao = (c.porEstacao || []).length <= 1;
        (c.porEstacao || []).forEach(p => {
          if (p.valor != null && !umaEstacao)
            sub(p.rot + ' · resultado' + un(ens.unidade), arred(p.valor, ens.casas));
          if (p.detalhe) sub(p.rot + ' · referência', p.detalhe);
        });
        if (ens.N != null)    sub('Coeficiente de calibração', ens.N);
        if (ens.Urel != null) sub('Incerteza expandida (%)', ens.Urel);
        if (c.valor != null)  sub('Resultado' + un(ens.unidade), arred(c.valor, ens.casas));
      }

      sub('Tolerância', ens.tolTexto);
      if (ens.restrTexto && ens.restrTexto !== '—') sub('Nível de restrição', ens.restrTexto);
      sub('Situação', ROTULOS[c.situacao] || '—');
      if (reg.obs) sub('Observação', reg.obs);
    });
    vazio();
  });

  return L;
}

/* Nome de arquivo que ordena sozinho na pasta: equipamento e data ISO. */
function nomePlanilha(eqId){
  const v = visita(eqId);
  const d = String(v.data || hoje()).split('/');
  const iso = d.length === 3 ? d[2] + '-' + d[1] + '-' + d[0] : 'sem-data';
  return 'CQ_IN95_' + eqId + '_' + iso + '.xlsx';
}

/* Precisa ser chamada de dentro de um toque: tanto a folha de
   compartilhamento quanto o download exigem gesto do usuário. */
async function exportarPlanilha(eqId, botao){
  if (!window.Planilha){
    alert('O gerador de planilha não carregou. Recarregue o aplicativo.');
    return;
  }
  const rotulo = botao ? botao.textContent : '';
  if (botao){ botao.disabled = true; botao.textContent = 'Gerando…'; }
  try {
    const blob = Planilha.gerar({
      aba: 'Visita',
      colunas: COLUNAS_PLANILHA,
      linhas: linhasPlanilha(eqId),
      filtro: false, congelar: false
    });
    const como = await Planilha.salvar(blob, nomePlanilha(eqId));
    if (botao) botao.textContent = como === 'cancelado' ? rotulo : 'Planilha pronta';
  } catch (e){
    if (botao) botao.textContent = 'Falhou — tente de novo';
    console.error('exportarPlanilha', e);
  } finally {
    if (botao){
      botao.disabled = false;
      setTimeout(()=>{ if (botao) botao.textContent = rotulo; }, 2600);
    }
  }
}

/* Validade padrão do laudo: um ano da data da visita. */
function validadeDe(data){
  const p = String(data || '').split('/');
  if (p.length !== 3) return '—';
  const d = new Date(Number(p[2]) + 1, Number(p[1]) - 1, Number(p[0]));
  d.setDate(d.getDate() - 1);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

const cabecaDoc = eq => {
  const h = instDe(eq), ano = (BD.visitas[eq.id] && BD.visitas[eq.id].data || hoje()).slice(-4);
  return `<div class="cabeca-doc">
    <span class="marca" aria-hidden="true">${MARCA}</span>
    <span class="l"><b>${esc(h.nome)}</b>Controle de qualidade ${esc(ano)} ·
      ${eq.relatorio ? esc(eq.relatorio) + ' · ' : ''}${esc(eq.marca)} ${esc(eq.modelo)} ·
      ${esc(eq.id)}</span>
  </div>`;
};

/* --- tabela de inspeção geral, na mesma redação do coletor de ultrassom ---
   A terceira coluna é a observação escrita na vistoria. Item reprovado sem
   observação sai com um traço, e não com texto inventado: o que o relatório
   afirma é o que o físico digitou. */
function tabelaInspecao(itens, valores, obs, grupos){
  const linha = i=>{
    const v = (valores || {})[i];
    const o = ((obs || {})[i] || '').trim();
    return `<tr><td>${esc(i)}</td>
      <td style="width:1%">${v ? `<span class="chip c-${v === 'Conforme' ? 'conf' : 'nconf'}">${esc(v)}</span>`
                               : '<span class="chip c-pend">Não inspecionado</span>'}</td>
      <td style="width:22%">${esc(o) || '—'}</td></tr>`;
  };
  /* Com grupos, cada um abre uma linha de título — é como a vistoria é feita
     e como o laudo fica legível. Sem grupos, a tabela sai corrida, que é o
     caso das listas curtas. */
  const linhas = grupos
    ? grupos.map(g=>`<tr class="total"><td colspan="3">${esc(g.grupo)}</td></tr>`
                    + g.itens.map(linha).join('')).join('')
    : itens.map(linha).join('');
  return `<div class="tab-scroll"><table>
    <thead><tr><th>Inspeção</th><th>Avaliação</th><th>Observações</th></tr></thead>
    <tbody>${linhas}</tbody></table></div>`;
}

/* --- um bloco de resultado, na numeração do relatório -------------------- */
function blocoEnsaio(ens, v, numero){
  const reg = v.resultados[ens.id];
  const c   = calcular(ens, reg);
  const feito = reg && reg.concluido;
  const chip = s => `<span class="chip c-${s}">${ROTULOS_DOC[s]}</span>`;
  let tabela;

  if (!feito){
    tabela = `<table><tbody><tr><td>Ensaio ainda não realizado nesta visita.</td>
      <td style="width:1%">${chip('pend')}</td></tr></tbody></table>`;
  }
  else if (reg.na || c.situacao === 'na'){
    tabela = `<table><thead><tr><th>Resultado</th><th>Avaliação</th><th>Observações</th></tr></thead>
      <tbody><tr><td>Ensaio não aplicável a este equipamento.</td><td>${chip('na')}</td>
      <td>${esc(reg.obs) || '—'}</td></tr></tbody></table>`;
  }
  else if (ens.tipo === 'qualit'){
    tabela = `<table><thead><tr><th>Critério</th><th>Avaliação</th><th>Observações</th></tr></thead>
      <tbody><tr><td>${esc(ens.tolTexto)}</td><td>${chip(c.situacao)}</td>
      <td>${esc(reg.obs) || '—'}</td></tr></tbody></table>`;
  }
  else {
    const pes = (c.porEstacao || []).filter(p => p.rot);
    /* Com uma estação só, a linha de fechamento repetiria a própria medida:
       nesse caso a tolerância entra na coluna de referência e a tabela tem
       uma linha, como no relatório de ultrassom. */
    const uma = pes.length <= 1;
    const linhas = pes.map(p=>`<tr${uma ? ' class="total"' : ''}>
        <td>${esc(p.rot)}</td>
        <td class="num mono">${esc(p.texto)}</td>
        <td>${uma ? 'Tolerância ' + esc(ens.tolTexto) + (p.detalhe ? ' · ' + esc(p.detalhe) : '')
                  : esc(p.detalhe || '—')}</td>
        <td>${p.situacao && p.situacao !== '—' ? chip(p.situacao) : '—'}</td>
      </tr>`).join('');
    const total = uma ? '' : `<tr class="total">
        <td>Resultado do ensaio</td>
        <td class="num mono">${esc(c.texto)}</td>
        <td>Tolerância ${esc(ens.tolTexto)}</td>
        <td>${chip(c.situacao)}</td>
      </tr>`;
    tabela = `<table>
      <thead><tr><th>Estação de medida</th><th class="num">Resultado</th>
        <th>Referência aplicada</th><th>Avaliação</th></tr></thead>
      <tbody>${linhas || total}${linhas ? total : ''}</tbody></table>`;
  }

  const contexto = [];
  if (feito && !reg.na && ens.N != null)
    contexto.push(`Coeficiente ${num(ens.N,3)} · U ± ${num(ens.Urel,1)} % (k = 2)`);
  if (feito && !reg.na && (ens.campos || []).length){
    (ens.campos || []).forEach(cp=>{
      const valor = (reg.campos && reg.campos[cp.id] != null) ? reg.campos[cp.id] : cp.valor;
      contexto.push(`${cp.rot}: ${cp.tipo === 'opcao' ? ((cp.rotulos && cp.rotulos[valor]) || valor)
                                 : String(valor).replace('.', ',') + ' ' + (cp.unidade || '')}`);
    });
  }
  const nota = (feito && !reg.na && reg.obs)
    ? 'Observação em campo — ' + reg.obs : '';

  /* Título, parâmetros e tabela são uma coisa só: na impressão o bloco inteiro
     passa para a folha seguinte em vez de partir no meio. */
  return `<div class="bloco-res">
    <h4><span class="num">${esc(numero)}</span>${esc(ens.nome)}</h4>
    ${contexto.length ? `<p class="aq-linha">Parâmetros do ensaio — ${esc(contexto.join(' · '))}</p>` : ''}
    <div class="tab-scroll">${tabela}</div>
    ${nota ? `<p class="nota-marca">${esc(nota)}</p>` : ''}
  </div>`;
}

/* Gráfico de desvios por estação, em SVG puro — sem biblioteca externa,
   para que o relatório abra e imprima sem rede. */
function graficoSecao(v){
  const alvo = ['kvp_exat','tempo_exat'].find(id=>{
    const r=v.resultados[id]; return r && r.concluido && !r.na;
  });
  if (!alvo) return '';
  const ens=POR_ID[alvo];
  const c=calcular(ens, v.resultados[alvo]);
  const pts=c.porEstacao.filter(p=>p.valor!=null);
  if (pts.length<2) return '';

  const W=680, H=200, mL=46, mR=14, mT=16, mB=34;
  const iw=W-mL-mR, ih=H-mT-mB;
  const restr = ens.lim.restr || ens.lim.tol*2;
  const vals = pts.map(p=>p.valor);
  /* Domínio assimétrico: cada lado recebe só a altura de que precisa, mas nunca
     menos que a faixa de tolerância — senão o limite sai do gráfico. */
  const hiV = Math.max(0, Math.max.apply(null, vals));
  const loV = Math.min(0, Math.min.apply(null, vals));
  const topo = Math.max(hiV*1.28, ens.lim.tol*1.35, hiV>ens.lim.tol ? restr*1.06 : 0);
  const base = Math.max(-loV*1.28, ens.lim.tol*1.35, -loV>ens.lim.tol ? restr*1.06 : 0);
  const yZero = mT + ih*topo/(topo+base);
  const cortar = v => Math.min(mT+ih, Math.max(mT, v));
  const y = val => cortar(val>=0 ? yZero - (val/topo)*(yZero-mT)
                                 : yZero + (-val/base)*(mT+ih-yZero));
  const bw = Math.min(48, iw/pts.length*0.5);
  const dentro = val => val<=topo && val>=-base;

  const faixa = (a,b,cor) => `<rect x="${mL}" y="${y(b).toFixed(1)}" width="${iw}"
     height="${Math.max(0,y(a)-y(b)).toFixed(1)}" fill="${cor}"/>`;

  const barras = pts.map((p,i)=>{
    const cx = mL + iw*(i+0.5)/pts.length;
    const yb = y(p.valor);
    const cor = p.situacao==='conf'?'var(--ok)':p.situacao==='nconf'?'var(--warn)':p.situacao==='restr'?'var(--bad)':'var(--info)';
    return `<rect x="${(cx-bw/2).toFixed(1)}" y="${Math.min(yZero,yb).toFixed(1)}" width="${bw.toFixed(1)}"
              height="${Math.max(1.5,Math.abs(yb-yZero)).toFixed(1)}" rx="3" fill="${cor}" opacity=".85"/>
            <text x="${cx.toFixed(1)}" y="${(yb + (p.valor>=0?-7:15)).toFixed(1)}" text-anchor="middle"
              font-size="10.5" fill="var(--muted)" font-family="JetBrains Mono, ui-monospace, monospace">${sinal(p.valor,1)}%</text>
            <text x="${cx.toFixed(1)}" y="${(H-11).toFixed(1)}" text-anchor="middle"
              font-size="10.5" fill="var(--faint)">${esc(p.rot)}</text>`;
  }).join('');

  const linha = (val,cor) => !dentro(val) ? '' :
    `<line x1="${mL}" x2="${W-mR}" y1="${y(val).toFixed(1)}" y2="${y(val).toFixed(1)}"
       stroke="${cor}" stroke-width="1" stroke-dasharray="4 4"/>
     <text x="${mL-6}" y="${(y(val)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--faint)"

  return `<section>

      ${faixa(-restr, -ens.lim.tol, 'var(--warn-soft)')}
      ${faixa(restr, topo, 'var(--bad-soft)')}
      ${faixa(-base, -restr, 'var(--bad-soft)')}
      <line x1="${mL}" x2="${W-mR}" y1="${yZero.toFixed(1)}" y2="${yZero.toFixed(1)}" stroke="var(--border-2)" stroke-width="1"/>

      <span><i style="background:var(--bad)"></i>nível de restrição ${esc(ens.restrTexto)}</span>
      <span>${esc(c.formula)}</span>
    </div>
  </section>`;
}

function pacote(f){
  const ens=POR_ID[f.ensaio];
  const reg=BD.visitas[f.equip].resultados[f.ensaio];
  const c=calcular(ens, reg);
  const eq=EQUIPAMENTOS.find(e=>e.id===f.equip);
  const instr=INSTRUMENTOS[ens.instr] || {modelo:null, serie:null, cert:null, validade:null};
  return {
    norma:'ANVISA IN 95/2021',
    equipamento:{id:eq.id, serie:eq.ns, instituicao:instDe(eq).nome},
    ensaio:{id:ens.id, nome:ens.nome, aplicabilidade:ens.aplic, periodicidade:ens.period},
    coleta:{data:BD.visitas[f.equip].data, hora:hora(f.ts), leiturasBrutas:reg.leituras,
            parametros:reg.campos, observacao:reg.obs || null, naoAplicavel:!!reg.na},
    instrumento:{modelo:instr.modelo, serie:instr.serie, certificado:instr.cert,
                 validade:instr.validade, coeficiente:ens.N!=null?ens.N:null,
                 incertezaExpandidaPercent:ens.Urel!=null?ens.Urel:null, fatorAbrangencia:2},
    resultado:{valor:c.valor, unidade:ens.unidade || null, texto:c.texto,
               tolerancia:ens.tolTexto, nivelRestricao:ens.restrTexto || null,
               situacao:c.situacao, formula:c.formula,
               porEstacao:c.porEstacao.map(p=>({estacao:p.rot, valor:p.valor, situacao:p.situacao}))}
  };
}

function enviarFila(){
  if (!ESTADO.online || !BD.fila.length) return;
  ESTADO.sincronizando=true; render();
  /* Envio simulado: em produção, um POST por lote com reenvio idempotente. */
  setTimeout(()=>{
    BD.enviados += BD.fila.length;
    BD.fila = [];
    ESTADO.sincronizando=false;
    persistir(); render();
  }, 900);
}

/* --------------------------------------------------------------------------
   Geração de medidas de exemplo, ensaio a ensaio

   O acervo acima cobre as estações do rol. Quando o usuário troca os pontos de
   medida — outro kV, outro mAs, mais uma espessura de PMMA — a leitura
   arquivada daquela estação deixa de fazer sentido, e o valor é sintetizado em
   torno do novo nominal. Assim o botão de exemplo continua honesto depois de
   qualquer ajuste na técnica.
   -------------------------------------------------------------------------- */

const jitter = (a, b) => a + Math.random() * (b - a);

function leiturasSinteticas(ens, est, i, fonte){
  const n = Math.max(1, ens.repeticoes || 1);
  const casas = ens.casasBrutas != null ? ens.casasBrutas : 2;
  const arquivo = fonte.leituras || [];
  let centro;

  if (ens.tipo === 'linear' && est.nominal != null){
    /* Na linearidade a estação é o mAs e a leitura é o kerma: o centro sai do
       rendimento por mAs que o acervo já traz. */
    const base0 = (arquivo[0] || [])[0];
    const nom0  = ((ens.estacoes || [])[0] || {}).nominal;
    const porMas = (base0 && nom0) ? base0 / nom0 : 51;
    centro = est.nominal * porMas;
  }
  else if (est.nominal != null){
    centro = est.nominal;
  }
  else {
    const arq = (arquivo[i] && arquivo[i].length) ? arquivo[i] : (arquivo[0] || []);
    centro = arq.length ? media(arq) : 1;
    /* Ponto de área controlada acrescentado à mão fica na ordem de grandeza da
       sala de exame, não a de um corredor. */
    if (ens.tipo === 'radiom' && est.area === 'controlada' && !(arquivo[i] || []).length)
      centro = Math.max.apply(null, arquivo.map(a => (a || [])[0] || 0).concat([centro]));
  }

  const disp = ens.tipo === 'repro' ? 0.006 : 0.004;
  return Array.from({length:n}, ()=>
    +(centro * jitter(1 - disp, 1 + disp)).toFixed(casas));
}

/* Preenche um ensaio com o acervo de demonstração e o marca como concluído.
   É o que o botão dentro do ensaio chama, e também o que a demonstração do
   equipamento inteiro repete para cada item do roteiro. */
function gerarMedidasEnsaio(eqId, ensId){
  const ens = POR_ID[ensId];
  const reg = registro(eqId, ensId);
  const base = BASE_DEMO[ensId] || {};
  const over = (PERFIS_DEMO[eqId] || {})[ensId] || {};
  const fonte = Object.assign({}, base, over);

  reg.campos = Object.assign({}, valoresPadrao(ens), base.campos || {}, over.campos || {});
  reg.obs = fonte.obs || '';
  reg.na  = !!fonte.na;
  if (fonte.resultado !== undefined) reg.resultado = fonte.resultado;

  if (ens.tipo !== 'qualit'){
    const est = estacoesDe(ens, reg);
    const padrao = ens.estacoes || [];
    reg.leituras = est.map((e,i)=>{
      const pronta = (fonte.leituras || [])[i];
      /* A leitura arquivada só serve se a estação continuar sendo a mesma. */
      const mesma = padrao[i] && (padrao[i].nominal == null || padrao[i].nominal === e.nominal);
      return (pronta && pronta.length && mesma)
        ? pronta.slice()
        : leiturasSinteticas(ens, e, i, fonte);
    });
  }

  reg.concluido = true;
  reg.ts = Date.now();
  enfileirar(eqId, ensId);
  return reg;
}

/* Devolve o ensaio ao estado de folha em branco, com as estações que o usuário
   configurou — limpar a coleta não desfaz a técnica escolhida. */
function limparEnsaio(eqId, ensId){
  const ens = POR_ID[ensId];
  const v = visita(eqId);
  const reg = registro(eqId, ensId);
  const est = estacoesDe(ens, reg);
  v.resultados[ensId] = {
    leituras: est.length ? est.map(()=>[]) : [[]],
    estacoes: reg.estacoes,
    campos: valoresPadrao(ens),
    resultado:null, obs:'', na:false, concluido:false, ts:null
  };
  BD.fila = BD.fila.filter(f => !(f.equip === eqId && f.ensaio === ensId));
}

/* Achados de vistoria do acervo de demonstração. A chave é um trecho do item,
   e não a posição na lista: reordenar a vistoria não embaralha os achados, e
   trecho que não casa com item nenhum simplesmente não produz achado — nunca
   derruba a demonstração. */
const VISTORIA_DEMO = {
  'ODI-03':[
    {contem:'Cabo disparador de 2 m',
     obs:'Disparador com cabo de 1,2 m; o operador dispara ao lado do cabeçote.'},
    {contem:'Posicionador de receptor',
     obs:'Sem posicionador: o paciente segura o filme com o dedo.'},
    {contem:'Protetor de tireoide',
     obs:'Protetor de tireoide não disponível no consultório.'}
  ]
};

function preencherDemo(eqId){
  const v = visita(eqId);
  ENSAIOS.forEach(ens => gerarMedidasEnsaio(eqId, ens.id));
  v.inspecao = {};
  v.inspObs = {};
  INSPECAO_EQUIP.forEach(i => v.inspecao[i] = 'Conforme');
  (VISTORIA_DEMO[eqId] || []).forEach(function(achado){
    const item = INSPECAO_EQUIP.find(function(i){ return i.indexOf(achado.contem) >= 0; });
    if (!item) return;
    v.inspecao[item] = 'Não conforme';
    v.inspObs[item] = achado.obs;
  });
  v.data = hoje();
}

  const amostra = BD.fila.length ? pacote(BD.fila[BD.fila.length - 1]) : null;

        aplicados e a classificação já resolvida — o sistema de laudos recebe o resultado

}

function alternarTema(){
  const r = document.documentElement;
  const escuroAgora = r.getAttribute('data-theme') === 'dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', escuroAgora ? 'light' : 'dark');
}

function render(){
  /* Estado órfão — o alvo pode ter sumido ao limpar medidas ou trocar de
     instituição. Cai para o nível mais próximo que ainda existe. */
  if (ESTADO.equip && !equipAtual()) ESTADO.equip = null;
  if (ESTADO.hosp && !INSTITUICOES.some(h => h.id === ESTADO.hosp)) ESTADO.hosp = null;

  let v = ESTADO.vista;
  if (['roteiro','ensaio','vistoria','laudo'].includes(v) && !ESTADO.equip)
    v = ESTADO.hosp ? 'parque' : 'instituicoes';
  if (v === 'parque' && !ESTADO.hosp) v = 'instituicoes';
  if (v === 'ensaio' && !POR_ID[ESTADO.ensaio]) v = 'roteiro';
  ESTADO.vista = v;

  (TELAS[v] || telaInstituicoes)();

  const bv = el('abVoltar'); if (bv) bv.addEventListener('click', ()=> ir(bv.dataset.alvo));
  const bt = el('abTema');   if (bt) bt.addEventListener('click', alternarTema);
  const bs = el('abSobre');  if (bs) bs.addEventListener('click', ()=> ir('sobre'));
  const br = el('abRede');   if (br) br.addEventListener('click', ()=> ir('sync'));
}


/* ==========================================================================
   Ponte com o cadastro da casca.

   Este coletor nasceu com a lista de instituições e o parque escritos no
   próprio arquivo. Quando a casca tem cadastro, ela manda — as constantes
   são substituídas no lugar (sem reatribuir, que são const) e o parâmetro
   ?cliente= abre direto no parque daquele cliente, que é o ciclo fechado:
   o ícone da modalidade no menu já sabe de quem é o equipamento.

   Sem a casca — o arquivo aberto solto — nada disso roda e o coletor segue
   com os dados de demonstração que sempre teve.
   ========================================================================== */
(function(){
  if (!window.Cadastro) return;

  const clientes = Cadastro.clientes();
  if (clientes.length) {
    INSTITUICOES.length = 0;
    INSTITUICOES.push.apply(INSTITUICOES, clientes);
  }

  /* O cadastro guarda o que é de todas as modalidades no núcleo e o resto em
     `extra`; aqui os dois voltam a ser um objeto só, no formato que este
     coletor espera, com `cliente` renomeado para `hosp`. */
  const equipamentos = Cadastro.equipamentos({modalidade: 95})
    .map(function(e){
      const o = Object.assign({}, e, e.extra || {}, {hosp: e.cliente});
      delete o.extra; delete o.cliente; delete o.modalidade;
      return o;
    });
  if (equipamentos.length) {
    EQUIPAMENTOS.length = 0;
    EQUIPAMENTOS.push.apply(EQUIPAMENTOS, equipamentos);
  }


  /* ----------------------------------------------------------------------
     Instrumentos do serviço

     O coletor nasceu com uma lista fixa de instrumentos. Quando o serviço
     cadastrou os seus, são eles que valem — e a tabela de equipamento
     utilizado do laudo passa a mostrar o parque de medição de quem assina.

     O que não estiver cadastrado continua vindo da lista interna: o arquivo
     aberto solto, sem a casca, não pode ficar sem instrumento nenhum.
     -------------------------------------------------------------------- */

  /* A tensão à qual o ensaio mede, que é o que escolhe o coeficiente no
     certificado. Vem do parâmetro do próprio ensaio quando ele tem um; senão,
     da média das estações, quando a leitura bruta é em kVp. Sem nada disso,
     null — e o cadastro devolve o primeiro coeficiente. */
  function kvDoEnsaio(ens){
    const campoKv = (ens.campos || []).find(function(c){ return c.id === 'kvp'; });
    if (campoKv && campoKv.valor != null) return Number(campoKv.valor);
    if (ens.unidadeBruta === 'kVp'){
      const noms = (ens.estacoes || [])
        .map(function(e){ return e.nominal; })
        .filter(function(v){ return v != null; });
      if (noms.length) return noms.reduce(function(a,b){ return a+b; }, 0) / noms.length;
    }
    return null;
  }

  /* Os tipos que o coletor já conhecia, mais os que só existem no cadastro do
     serviço — `outro`, tipicamente, usado por ensaio acrescentado. Sem isto o
     laudo procura um instrumento que ninguém definiu. */
  const tiposUsados = Object.keys(INSTRUMENTOS);
  Cadastro.TIPOS_INSTRUMENTO.forEach(function(t){
    if (tiposUsados.indexOf(t.id) < 0 && Cadastro.instrumentoDoTipo(t.id)) tiposUsados.push(t.id);
  });

  tiposUsados.forEach(function(tipo){
    const cadastrado = Cadastro.instrumentoDoTipo(tipo);
    if (!cadastrado) return;
    INSTRUMENTOS[tipo] = {
      nome: cadastrado.nome || Cadastro.tipoInstrumento(tipo).nome,
      modelo: [cadastrado.fabricante, cadastrado.modelo].filter(Boolean).join(' ') || '—',
      serie: cadastrado.serie || '—',
      cert: (cadastrado.cert && cadastrado.cert.numero) || '—',
      validade: (cadastrado.cert && cadastrado.cert.validade) || '—',
      rastreab: (cadastrado.cert && cadastrado.cert.rastreab) || '—',
      /* Guardado para o coeficiente e para o aviso de certificado vencido. */
      registro: cadastrado
    };
  });

  /* Cada ensaio passa a usar o coeficiente e a incerteza do certificado do
     instrumento que o serviço cadastrou, na qualidade de feixe do ensaio. Sem
     instrumento cadastrado, ficam os valores que o coletor já trazia. */
  ENSAIOS.forEach(function(ens){
    const meta = INSTRUMENTOS[ens.instr];
    if (!meta || !meta.registro) return;
    const c = Cadastro.coefDe(meta.registro, kvDoEnsaio(ens));
    if (c.N != null) ens.N = c.N;
    if (c.U != null) ens.Urel = c.U;
  });

  /* A casca diz de quem é a visita e, quando vem dos Relatórios, em qual
     equipamento e em qual tela. O que não existir é ignorado: um link velho
     não pode deixar o coletor num estado sem volta. */
  const params = new URLSearchParams(location.search);
  /* Marca que o coletor foi aberto pela casca: muda para onde o voltar leva. */
  ESTADO.viaCasca = false;

  const alvo = params.get('cliente');
  if (alvo && INSTITUICOES.some(function(h){ return h.id === alvo; })) {
    ESTADO.hosp = alvo;
    ESTADO.vista = 'parque';
    ESTADO.viaCasca = true;
  }

  const eq = params.get('equip');
  if (eq && EQUIPAMENTOS.some(function(x){ return x.id === eq; })) {
    ESTADO.equip = eq;
    const v = params.get('vista');
    ESTADO.vista = ['roteiro','ensaio','vistoria','laudo'].indexOf(v) >= 0 ? v : 'roteiro';
    const ens = params.get('ensaio');
    if (ens && POR_ID[ens]) { ESTADO.ensaio = ens; ESTADO.vista = 'ensaio'; }
  }
})();

history.replaceState(instantaneo(), '', '#' + ESTADO.vista);

render();

</script>
<script>
/* Registra o service worker da casca: o coletor aberto direto pelo link
   também passa a funcionar offline, sem depender de visitar o menu antes.

   E oferece a versão nova quando ela chega. Sem isto o worker novo instala,
   fica em espera e nunca entra — o aparelho continua servindo o pacote
   anterior, e nem a demonstração nem o campo percebem. */
(function(){
  if (!('serviceWorker' in navigator)) return;

  const aviso = document.getElementById('aviso');
  let pediuAtualizar = false;

  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound', function(){
        const novo = reg.installing;
        if (!novo) return;
        novo.addEventListener('statechange', function(){
          /* Só avisa se já havia um controlador: na primeira visita o
             "há uma versão nova" seria mentira. */
          if (novo.state === 'installed' && navigator.serviceWorker.controller && aviso)
            aviso.hidden = false;
        });
      });
      /* Quando a página abre com um worker já em espera — o caso de quem
         fechou o app antes de aceitar — o `updatefound` não dispara de novo. */
      if (reg.waiting && navigator.serviceWorker.controller && aviso) aviso.hidden = false;
    }).catch(function(){ /* sem SW o coletor ainda funciona, só não fica offline */ });

    /* Recarrega só quando a troca foi pedida: na primeira visita o
       clients.claim() do worker também dispara controllerchange. */
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!pediuAtualizar) return;
      pediuAtualizar = false;
      location.reload();
    });
  });

  const bt = document.getElementById('btAtualizar');
  if (bt) bt.addEventListener('click', function(){
    if (aviso) aviso.hidden = true;
    pediuAtualizar = true;
    navigator.serviceWorker.getRegistration().then(function(reg){
      if (reg && reg.waiting) reg.waiting.postMessage('SW_ATUALIZAR');
      else location.reload();
    });
  });
})();
</script>
